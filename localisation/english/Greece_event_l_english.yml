l_english:
 greece.1.t:0 "German Proposal for an Alliance"
 greece.1.d:0 "Germany wishes to stand alongside us against the Ottomans. Perhaps we will be able to realize our once-frustrated dream of hegemony in the Near East."
 greece.1.a:0 "This is how a solid alliance is forged."
 greece.1.b:0 "No!"
 greece.2.t:0 "Rejection of Request for Surrender"
 greece.2.d:0 "The Austrian Empire has informed us that it is too late and that fighting will continue. Perhaps Greece may not survive..."
 greece.2.a:0 "Is this the end of Greece?"
 greece.3.t:0 "Austro-Greek Friendship"
 greece.3.d:0 "The Austrian Empire has put forward the following proposals, expressing a desire to maintain favorable relations with Greece."
 greece.3.a:0 "Austro-Greek Trade Agreement"
 greece.3.b:0 "Austrian Guarantee of Independence"
 greece.3.c:0 "Alliance with Austria"
 greece.4.t:0 "British Pressure"
 greece.4.d:0 "Britain has exerted political pressure on Greece to fight on their side, while simultaneously attempting to appease us with promises of land claims. Our choice will shape the ultimate fate of Greece."
 greece.4.a:0 "I prefer Germany."
 greece.4.b:0 "Splendid! We shall stand with Britain!"
 greece.5.t:0 "Death of Prime Minister Kondylis"
 greece.5.d:0 "This morning, Greece's military dictator and prime minister, Georgios Kondylis, passed away in Athens from an acute heart attack. This occurred three years after he overthrew the Second Hellenic Republic in a 1933 military coup. Several key figures, including King George II, expressed condolences over his passing. Ioannis Metaxas stands as the most likely candidate to succeed him."
 greece.5.a:0 "Today, Greece enters a new chapter."
 greece.6.t:0 "Death of Venizelos"
 greece.6.d:0 "Eleftherios Kyriakos Venizelos, the father of Greek liberalism and republicanism, passed away from a stroke in Pennsylvania yesterday evening. Venizelos spearheaded numerous reforms as leader of the Liberal Party and went into exile in the United States following a failed republican officer coup against royalist rule. Though pardoned after King George II returned to power, he passed away far abroad without treading on Greek soil again. His remains are reportedly buried in Crete."
 greece.6.a:0 "Though he has passed, his ideals endure."
 greece.7.t:0 "Greek Revolution"
 greece.7.d:0 "Yesterday evening, Greek republican officers launched a coup d'état against the royalists. Republican officers succeeded in seizing control of the Greek parliament and detaining key royalist figures. Greece is now governed by republicans and followers of Venizelos.\n\nWhile some royalist officers are reportedly plotting a counterattack, their numbers are small and failure appears likely."
 greece.7.a:0 "Surprising news."
 greece.8.t:0 "Civil War Erupts!"
 greece.8.d:0 "Shortly after the success of the republican coup, royalist officers split into opposing camps and initiated a civil war. Greece has been plunged into a vortex of chaos, and this struggle will determine which faction governs the realm."
 greece.8.a:0 "Treason!"
 greece.9.t:0 "Greece Repudiates the Treaty of Thessaloniki"
 greece.9.d:0 "This morning, Greece declared its rearmament, maintaining that the Treaty of Thessaloniki had served its purpose. This act represents a complete disregard for the pact, signaling that Greece is preparing for war once more. Bulgaria responded with acute alarm. The Balkan powder keg threatens to ignite."
 greece.9.a:0 "Long live Greece!"
 greece.9.b:0 "Cease this nonsense!"
 greece.9.c:0 "The turbulent Balkans."
 greece.10.t:0 "Civil War Erupts!"
 greece.10.d:0 "Shortly after royalists assumed complete control of Greek politics, Greek republicans reacted with fierce indignation, culminating in civil war. This conflict will determine which faction governs Greece."
 greece.10.a:0 "Treason!"
 greece.11.t:0 "Greek Alliance Proposal"
 greece.11.d:0 "A proposal from Greece has arrived, seeking an alliance against Bulgaria—the nation that inflicted severe humiliation upon us during the Great War. Joining hands with them may enable us to reclaim lost territories."
 greece.11.a:0 "A fine proposal."
 greece.11.b:0 "Far too dangerous."
 greece.12.t:0 "[FROM.GetName] Accepts Alliance"
 greece.12.d:0 "[FROM.GetName] has accepted our alliance proposal. They shall fight alongside us against Bulgaria."
 greece.12.a:0 "The hour draws near."
 greece.13.t:0 "[FROM.GetName] Rejects Alliance Proposal"
 greece.13.d:0 "[FROM.GetName] rejected our proposal, stating that an alliance with us carries excessive danger. They shall crumble alone."
 greece.13.a:0 "We have no need for them either."
 greece.14.t:0 "Greece Requests Alliance"
 greece.14.d:0 "Amidst a rapidly shifting international situation, Greece transmitted a formal document requesting an alliance with our government. Partnering with them could reinforce our strategic position in the Balkans."
 greece.14.a:0 "They will prove to be a worthy ally."
 greece.14.b:0 "I question whether this alliance will truly benefit us."
 greece.15.t:0 "A Magnificent Victory"
 greece.15.a:0 "Following a prolonged struggle, we have chastised Bulgaria. Now, we shall divide the spoils of war among our allies."
 greece.15.a:0 "We have punished them."
 greece.16.t:0 "Treaty of Sofia"
 greece.16.d:0 "After a long campaign, Greece and its allies emerged victorious over Bulgaria. The Bulgarian army was shattered, and its capital ultimately fell. As a consequence of this victory, the Treaty of Sofia was signed, inflicting severe terms upon Bulgaria."
 greece.16.a:0 "Victory for the Balkan League."
 greece.17.t:0 "Laying Claim to Ottoman Territory"
 greece.17.d:0 "During the era of the Eastern Roman Empire, Greek lands encompassed a vast expanse. Having lost those territories to foreign occupation, much of which remains in Ottoman hands, we must officially assert our rightful sovereignty now that we are at war with the Ottomans."
 greece.17.a:0 "The Great Idea."
 greece.18.t:0 "Ottoman Request for Conditional Surrender"
 greece.18.d:0 "The Ottoman Empire suffered a crushing defeat at the hands of Greek forces, as high-spirited troops breached Ottoman defenses with ease. Consequently, the Ottomans presented terms for surrender, demonstrating to the world which power holds dominance in the region."
 greece.18.a:0 "We have triumphed!"
 greece.18.b:0 "No, we have no need for it."
 greece.19.t:0 "Greece Rejects Surrender Terms"
 greece.19.d:0 "The Greek government declared that fighting will continue, asserting that only the complete destruction of the Ottoman Empire will end this war. All that remains for us is to await this grim outcome."
 greece.19.a:0 "No!"
 greece.20.t:0 "The Fourth Balkan War"
 greece.20.d:0 "At dawn today, the Greek government issued a declaration of war against Bulgaria. Artillery shelling along the Greco-Bulgarian border has already inflicted hundreds of casualties. While the past three Balkan wars concluded in Bulgarian victories, the defeated nations have united once more to ignite war anew. The fate of the Balkans hangs in the balance."
 greece.20.a:0 "The Balkans are at war."
 greece.21.t:0 "Greco-Turkish War"
 greece.21.d:0 "Yesterday evening, Greece delivered a declaration of war against the Ottoman Empire. Fresh from its victory over Bulgaria in the Balkans, Greece now wages war against the Ottomans to reclaim portions of the historical Eastern Roman realm. War between Greece and the Ottoman Empire has officially commenced."
 greece.21.a:0 "Who shall emerge victorious?"
 greece.22.t:0 "Treaty of Sofia"
 greece.22.d:0 "Following an extended conflict, Bulgaria secured victory against Greece and its allies. The Greek army was shattered and the capital ultimately captured. As a consequence of this defeat, the Treaty of Sofia was signed, forcing Greece to endure severe terms."
 greece.22.a:0 "Victory for Bulgaria."
 greece.23.t:0 "Death of Metaxas"
 greece.23.d:0 "Ioannis Metaxas, the royalist ruler of Greece, has passed away in Athens from throat cancer. Following his autocratic administration, Alexandros Koryzis has been appointed as the new Prime Minister, forming a new government for Greece."
 greece.23.a:0 "So he has passed..."
 greece.24.t:0 "German-Greek Alliance Signed"
 greece.24.d:0 "The governments of Germany and Greece simultaneously announced the conclusion of an official military alliance in Berlin and Athens. This accord comes as part of Germany's broader efforts to expand its diplomatic and military presence in the Balkans and reinforce strategic influence across Europe.\n\nThrough this alliance, the Greek government seeks to fortify national security and elevate its international standing alongside Germany. France and its allies expressed grave concern, with intense focus centered on how German-Greek cooperation will reshape European geopolitics."
 greece.24.a:0 "The die is cast."