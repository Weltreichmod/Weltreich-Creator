l_english:
 serbia.1.t:0 "German Request"
 serbia.1.d:0 "Germany has requested that we form an alliance with them. This pact could potentially elevate our nation into the preeminent power in the Balkans."
 serbia.1.a:0 "A fine idea."
 serbia.1.b:0 "No, we have no need for them."
 serbia.2.t:0 "Serbian Proposal"
 serbia.2.d:0 "The Serbian government has proposed the creation of Yugoslavia, a unified South Slavic state. They maintain that uniting the South Slavs will forge a stronger nation capable of safeguarding our shared heritage. Whether to accept or reject their proposal rests in our hands."
 serbia.2.a:0 "A splendid idea."
 serbia.2.b:0 "We shall preserve our independence."
 serbia.3.t:0 "[FROM.GetName] Agrees to Form Yugoslavia"
 serbia.3.d:0 "[FROM.GetName] has accepted our proposal to establish Yugoslavia. They shall join us in uniting into a single state, navigating the world stage tied together by a common destiny."
 serbia.3.a:0 "A wise decision."
 serbia.4.t:0 "[FROM.GetName] Rejects Yugoslav Unification"
 serbia.4.d:0 "[FROM.GetName] has rejected our proposal to establish Yugoslavia. We shall bind them to our cause by force of arms if necessary, crushing any who dare resist."
 serbia.4.a:0 "They brought this upon themselves."
 serbia.5.t:0 "Serbia Proclaims Yugoslavia"
 serbia.5.d:0 "This morning, Serbia formally proclaimed the establishment of Yugoslavia, a unified homeland for the South Slavic peoples. The dream of a South Slav nation—cherished since before the Great War—was once completely shattered by the German-led Central Powers.\n\nYet the Serbs never relinquished their dream, waiting patiently for Austrian control to wane. Today, they have successfully broken free from Austrian oversight and proclaimed Yugoslavia.\n\nThis new state ascends with high expectations of developing into a formidable regional power within the Balkans."
 serbia.5.a:0 "Long live Yugoslavia!"