l_english:
 fentian.1.t:0 "Japanese Investment Proposals"
 fentian.1.d:0 "Japanese investors have requested permission to invest in the Fengtian region. Their capital will undoubtedly serve as a foundation for enriching all of Fengtian. However, this clearly carries the distinct disadvantage of undermining our legitimacy."
 fentian.1.a:0 "Money comes before legitimacy."
 fentian.1.b:0 "Legitimacy is paramount."
 fentian.2.t:0 "[FROM.GetName] Demands Submission"
 fentian.2.d:0 "This morning, [FROM.GetName] demanded our immediate submission. They declared that unless we submit as their puppet state, they will wage war against us."
 fentian.2.a:0 "We must submit."
 fentian.2.b:0 "We shall not."
 fentian.3.t:0 "[FROM.GetName] Accepts"
 fentian.3.d:0 "[FROM.GetName] has agreed to comply with our demands. They are now our puppet state and shall follow our orders."
 fentian.3.a:0 "Unification is on the horizon!"
 fentian.4.t:0 "[FROM.GetName] Refuses"
 fentian.4.d:0 "[FROM.GetName] has rejected our demands. They declared that they will never surrender and will fight to the bitter end. War is the only remaining answer."
 fentian.4.a:0 "Declare war!"
 fentian.5.t:0 "Fengtian Requests Military Aid"
 fentian.5.d:0 "The Fengtian government has requested military aid from us. Accepting this may allow us to further expand our influence within Fengtian."
 fentian.5.a:0 "Sell infantry equipment."
 fentian.5.b:0 "Sell support equipment."
 fentian.5.c:0 "Sell field artillery."
 fentian.5.dd:0 "Sell nothing."
 fentian.6.t:0 "Japan Accepts Request for Aid"
 fentian.6.d:0 "Japan has extended a helping hand to us. They did not reject our request and provided a substantial quantity of equipment. These supplies are currently in transit and will prove invaluable to us."
 fentian.6.a:0 "Very good."
 fentian.9.t:0 "Japan Rejects Our Request"
 fentian.9.d:0 "Despite our earnest request, the Japanese government has refused to provide military assistance. They express no desire to become involved in our conflict, maintaining that we must resolve our own affairs."
 fentian.9.a:0 "Damn it!"
 fentian.10.t:0 "Overwhelming Japanese Influence"
 fentian.10.d:0 "We are subjected to excessively high Japanese influence. They manipulate our politics and economy at will, driving our legitimacy into the abyss."
 fentian.10.a:0 "Something... has gone wrong."
 fentian.11.t:0 "Waning Japanese Influence"
 fentian.11.d:0 "Japan's influence is no longer as formidable as it once was. While their sway remains significant, it is no longer enough to dictate terms to Fengtian at will. We shall be able to reclaim our legitimacy once more."
 fentian.11.a:0 "We will never be swayed by them again."