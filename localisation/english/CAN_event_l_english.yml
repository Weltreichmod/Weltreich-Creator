l_english:
 canada_wr.1.t:0 "Collapse of the Coalition"
 canada_wr.1.d:0 "Following a protracted crisis, the Liberal-Conservative-CCF coalition has collapsed. The CCF declared its withdrawal from the government and passed a vote of no confidence against the cabinet. The Canadian Parliament has been dissolved, and a new general election is set to take place."
 canada_wr.1.a:0 "Unstable Canadian politics."
 canada_wr.2.t:0 "Democratic Coalition Conference"
 canada_wr.2.d:0 "Yesterday morning, Liberal Party leader Mackenzie King, Conservative Party leader Bennett, and CCF leader Woodworth met for high-level talks. They gathered to establish the direction of the coalition government and reconcile their differences. Their effort..."
 canada_wr.2.a:0 "...proved successful."
 canada_wr.2.b:0 "...ended in failure."
 canada_wr.3.t:0 "The [GetYear] General Election"
 canada_wr.3.d:0 "Following the dissolution of Parliament, a general election was held to form a new administration. The party securing the largest share of votes in this election is..."
 canada_wr.3.a:0 "...the Liberal Party."
 canada_wr.3.b:0 "...the CCF."
 canada_wr.3.c:0 "The election has entered a deadlock!"
 canada_wr.4.t:0 "Banning of the Social Credit Party"
 canada_wr.4.d:0 "This morning, under Section 98 of the Criminal Code, the Social Credit Party was designated an extremist organization and officially outlawed. They were forcibly dissolved, and while backlash is fierce, this ruling appears irreversible."
 canada_wr.4.a:0 "Farewell, Integralists."
 canada_wr.5.t:0 "Government in Turmoil"
 canada_wr.5.d:0 "In the new election following the dissolution of Parliament, no political party managed to secure a majority to form a functional government. Canada now lingers in political vacuum; should this state persist, the nation will inevitably be plunged into grave chaos."
 canada_wr.5.a:0 "This is a serious issue."
 canada_wr.6.t:0 "The Rise of Extremism"
 canada_wr.6.d:0 "The government's recent incompetence has spurred the rapid rise of extremist political forces. The growth of both communism and integralism has reached an undeniable momentum, making their eventual ascension to power seem almost certain. The time has come for us to choose our path."
 canada_wr.6.a:0 "Toward Communism."
 canada_wr.6.b:0 "Integralism is the righteous path."
 canada_wr.7.t:0 "Communist Demonstrations"
 canada_wr.7.d:0 "Amidst a collapsed government, a paralyzed nation, and stagnant economic recovery, countless workers took to the streets in protest. Although police succeeded in dispersing the crowds within hours, demonstrations continue to erupt across the country, and communist rallies are expected to persist."
 canada_wr.7.a:0 "Such is the tide of the times."
 canada_wr.8.t:0 "Constitutional Amendment"
 canada_wr.8.d:0 "The current Canadian Constitution is thoroughly outdated and reflects pro-capitalist interests. While a new constitution serving the working class must be enacted, the authority to amend our constitution remains in the hands of the British Parliament. Let us present our newly drafted constitution to them and demand its passage."
 canada_wr.8.a:0 "They must accept it."
 canada_wr.9.t:0 "Constitutional Amendment"
 canada_wr.9.d:0 "The current Canadian Constitution is thoroughly outdated and reflects pro-capitalist interests. Let us revise the constitution for the working class and guide Canada along the proper path."
 canada_wr.9.a:0 "Toward a new era!"
 canada_wr.10.t:0 "Canada's Constitutional Request"
 canada_wr.10.d:0 "The newly established Canadian government has dispatched a formal request demanding that our Parliament approve its constitutional amendments. Debate over their proposed constitution was extensive in the British Parliament, and after lengthy deliberation, Parliament reached a conclusion."
 canada_wr.10.a:0 "Grant approval."
 canada_wr.10.b:0 "Refuse approval."
 canada_wr.11.t:0 "Approval of the British Parliament"
 canada_wr.11.d:0 "The British Parliament has approved our constitutional amendments. Our nation now possesses a constitution aligned with our principles. Friction between the United Kingdom and Canada should now subside."
 canada_wr.11.a:0 "Splendid!"
 canada_wr.12.t:0 "Parliament Refuses"
 canada_wr.12.d:0 "The British Parliament has rejected our request, dismissing it as outrageous. The public is demanding an immediate and decisive response to the rejection of our legitimate demands."
 canada_wr.12.a:0 "Then it is independence!"
 canada_wr.12.b:0 "We must accept their decision."
 canada_wr.13.t:0 "Canada Declares Independence"
 canada_wr.13.d:0 "Following our refusal to approve Canada's constitutional amendments, the Canadian government chose to break ties with us. They have formally proclaimed immediate and total independence from the United Kingdom."
 canada_wr.13.a:0 "Madmen."
 canada_wr.14.t:0 "Canada Requests to Join Comintern"
 canada_wr.14.d:0 "Yesterday evening, the Canadian government transmitted a formal request seeking a military alliance with us. Collaborating with Canada could enable the establishment of further communist states across North America."
 canada_wr.14.a:0 "Agreed."
 canada_wr.14.b:0 "They are far too distant."
 canada_wr.15.t:0 "Soviet-Canadian Alliance"
 canada_wr.15.d:0 "Shocking news reverberated across the globe around noon yesterday. The recently communized Canadian government has forged close diplomatic ties with Soviet Russia, culminating in a formal military alliance. The United States appears deeply alarmed, with growing apprehension that a red plague may spread throughout the Americas."
 canada_wr.15.a:0 "A bizarre alliance."
 canada_wr.16.t:0 "The Soviets Reject Our Offer"
 canada_wr.16.d:0 "Soviet Russia has rejected our proposal for an alliance. They reasoned that an alliance with us would be overly cumbersome and unnecessary, warning that it would unduly provoke the United States. It appears no alliance will materialize between us for the foreseeable future."
 canada_wr.16.a:0 "They rejected it?"
 canada_wr.17.t:0 "Support from Integralist Comrades"
 canada_wr.17.d:0 "The recently established Integralist regime in Canada has received multifaceted assistance from various Integralist states around the world. Canada will cultivate firm solidarity with Integralist nations globally."
 canada_wr.17.a:0 "Our gratitude!"
 canada_wr.18.t:0 "Canada's Goodwill Request"
 canada_wr.18.d:0 "The Canadian government has sent a telegram expressing a desire to foster closer bilateral relations with us. Though vast distances and differing ideologies separate us, this may present a valuable diplomatic opportunity."
 canada_wr.18.a:0 "Naturally."
 canada_wr.19.t:0 "Strengthened Relations with Britain"
 canada_wr.19.d:0 "The British government has accepted our request. As Canada's heritage is intrinsically bound to Britain, this outcome unites us into a common destiny of shared bloodlines."
 canada_wr.19.a:0 "A welcome development."
 canada_wr.20.t:0 "Collapse of the Democratic Coalition"
 canada_wr.20.d:0 "The democratic coalition of Canada, formed in 1935 to counter the Social Credit Party, collapsed today. Comprising the Liberal Party, the Conservative Party, and the CCF, internal friction between the Liberals and the CCF ultimately boiled over, fragmenting the administration. A general election will be held shortly to form a new government, though the ultimate victor remains entirely uncertain."
 canada_wr.20.a:0 "Were they a coalition administration?"
 canada_wr.21.t:0 "The Democratic Coalition Solidifies"
 canada_wr.21.d:0 "Reports indicate that the democratic coalition government—comprising the Liberal Party of Canada, the Conservative Party, and the CCF—has firmly consolidated its alliance. Driven by the shared imperative of suppressing their common adversary, the Social Credit Party, they have reconciled key policy differences. While the Social Credit Party dismissed their unity as mere political theater, the coalition has demonstrated genuine consensus across numerous fronts."
 canada_wr.21.a:0 "The coalition shall endure."
 canada_wr.22.t:0 "The People Demand a Change of Regime"
 canada_wr.22.d:0 "Despite extensive efforts to suppress communist influence among the populace, communism has acquired overwhelming traction with the public. Citizens have taken to the streets to demand the immediate resignation of our government, and the crisis is rapidly spiraling out of control."
 canada_wr.22.a:0 "Concede to their demands."
 canada_wr.23.d:0 "Despite extensive efforts to suppress integralist influence among the populace, integralism has acquired overwhelming traction with the public. Citizens have taken to the streets to demand the immediate resignation of our government, and the crisis is rapidly spiraling out of control."