l_english:
 Soviet.1.t:0 "Treaty of Königsberg"
 Soviet.1.d:0 "Germany has offered us a non-aggression pact in exchange for economic aid."
 Soviet.1.a:0 "Splendid."
 Soviet.1.b:0 "Absurd."
 Soviet.2.t:0 "Franco-[SOV.GetName] Non-Aggression Pact"
 Soviet.2.d:0 "The French government has expressed its desire to sign a non-aggression pact with us. Much like ourselves, France bears the bitter history of defeat in the Great War and was forced to sign a humiliating treaty dictated by Germany. This shared legacy of suffering may well bind our two nations together."
 Soviet.2.a:0 "Splendid."
 Soviet.2.b:0 "Absurd."
 Soviet.3.t:0 "Germany Rejects Surrender Terms"
 Soviet.3.d:0 "Germany has rejected our conditional surrender, declaring that the war shall continue until every last Slav is swept away. The future of Russia grows dark..."
 Soviet.3.a:0 "What?"
 Soviet.4.t:0 "Independence from [FROM.GetName]"
 Soviet.4.d:0 "In the bitter struggle across Eastern Europe, [FROM.GetName] was defeated, and Germany has demanded the independence of all its former puppet states. Pursuant to the Treaty of Kazan, our homeland is once again a fully sovereign nation."
 Soviet.4.a:0 "To our independence!"
 Soviet.5.t:0 "British Proposal for Joint Exercises"
 Soviet.5.d:0 "Great Britain has proposed joint military exercises with our [SOV.GetName]. Training alongside their forces might help pull the deplorable quality of our Red Army up from the abyss."
 Soviet.5.a:0 "We approve."
 Soviet.5.b:0 "Decline their offer."
 Soviet.6.t:0 "British Diplomatic Mission Arrives in Leningrad"
 Soviet.6.d:0 "A British diplomatic delegation has arrived in Leningrad to open negotiations with our government. It is time to hear what they have to say."
 Soviet.6.a:0 "Very well, let us hear them out."
 Soviet.6.b:0 "Tell them we have no need for this."
 Soviet.7.t:0 "Military Cooperation with Britain"
 Soviet.7.d:0 "The British diplomatic mission has proposed formal military cooperation. Such an arrangement could greatly elevate the current substandard readiness of our armed forces."
 Soviet.7.a:0 "Agreed."
 Soviet.7.b:0 "Rejected."
 Soviet.8.t:0 "Scientific Cooperation with Britain"
 Soviet.8.d:0 "The British delegation has proposed scientific cooperation with our institutes. This may significantly boost our foundational research capabilities."
 Soviet.8.a:0 "Agreed."
 Soviet.8.b:0 "Rejected."
 Soviet.9.t:0 "Economic Cooperation with Britain"
 Soviet.9.d:0 "The British delegation has proposed economic cooperation. This could provide a vital stimulus to our industrial capacity."
 Soviet.9.a:0 "Agreed."
 Soviet.9.b:0 "Rejected."
 Soviet.10.t:0 "Alliance with Britain"
 Soviet.10.d:0 "The British government has signaled its desire to forge a formal alliance with us. Such a pact may prove indispensable if we are to successfully counter the German threat."
 Soviet.10.a:0 "A sound proposal."
 Soviet.10.b:0 "Is such a measure truly necessary?"
 Soviet.12.t:0 "Anglo-Soviet Alliance"
 Soviet.12.d:0 "News of the alliance between Great Britain and the [SOV.GetName] was broadcast this morning. Bound by a mutual military pact, both nations shall stand shoulder to shoulder in the wars to come."
 Soviet.12.a:0 "The Red Army leads the way."
 Soviet.13.t:0 "Soviet Rejection"
 Soviet.13.d:0 "The Soviet government found our proposals unsatisfactory and has officially rejected them. It appears the Soviets harbor little desire for an alliance with us, driven largely by the fear that such a pact would provoke Berlin."
 Soviet.13.a:0 "Cowards."
 Soviet.14.t:0 "In Moscow"
 Soviet.14.d:0 "In the wake of Kamenev's death, Russia has been plunged into turmoil. Stalin, Zinoviev, and Trotsky pursue only their own narrow ambitions, showing utter disregard for the toiling masses. Outraged by the Troika's betrayal, Bukharin has held clandestine meetings in Moscow with numerous figures of the Workers' Opposition, forging a resolute front against the ruling clique."
 Soviet.14.a:0 "Dangerous agitators."
 Soviet.15.t:0 "Workers' Opposition Denounces the Troika"
 Soviet.15.d:0 "An official manifesto from the Workers' Opposition was published in Moscow today, fiercely condemning the Troika for its anti-worker policies. The ruling faction has dismissed the statement as baseless slander unworthy of a response. This confrontation threatens to severely deepen the political rift within the party."
 Soviet.15.a:0 "What fate awaits Russia now?"
 Soviet.16.t:0 "The First Step"
 Soviet.16.d:0 "'The solution to our immediate crisis boils down to one imperative: the Kremlin must act. The Red Army must expand, and it requires a general mobilization decreed by the General Secretary. We await a favorable response from the research directorates.'\n\nMikhail Nikolayevich Tukhachevsky let out a weary sigh. The Western powers still dismissed Russia as an Eastern backwater—uncivilized and unworthy of recognizing a socialist state. The Treaty of Brest-Litovsk had only cemented that humiliating perception in stone. Yet Russia dreamed of vengeance. General Tukhachevsky did not dismiss the grand ambitions of Bukharin's faction as mere delusion. Until the day Prussia was brought low once more, the Red Army would remain on a permanent war footing. The party-state continued its relentless expansion, but a hard limit had finally been reached. Even a federation is bound by laws—laws that restrict the manpower the military may conscript and the factories it may mobilize. Just days ago, the military hit that ceiling, and the directorate urged the drafting of a formal decree. Mikhail knew the brutal reality of the armed forces all too well: vast and formidable, yet starved, harsh, and heavily deformed. Must he drive even more souls into agony with his own hands? Must he turn a deaf ear to those whose dreams had been crushed? To Mikhail, however, the path was blindingly obvious.\n\nWar was still on the horizon, but not so distant that it could be measured in decades. The Kremlin endows its master with a terrible burden—a double-edged sword that grants supreme authority while inflicting ceaseless agony. Within moments, the General Secretary affixed his signature to the brief order: expand conscription and mobilization, compelling yet more of the populace into the service of the state. The courier who took the paper never saw his expression—whether it twisted in anguish or blazed with fanaticism. Mikhail himself would never truly know."
 Soviet.16.a:0 "Sacrifice for the greater cause."
 Soviet.17.t:0 "A Bitter Cup"
 Soviet.17.d:0 "The Kremlin, Moscow—the very heart of the Bolshevik Revolution. Here sits Nikolai Ivanovich Bukharin, holding the fate of all Russia in his hands. The strutting reactionaries of the military high command shiver in Siberian stockades, while the grandiose dreams of the Red Napoleon have withered, forced to lean upon the fickle charity of Western capitals. Bukharin now occupies the seat of the Chairman of the Council of People's Commissars. Yet, seemingly untouchable, he finds himself trapped in profound agony over an unresolved dilemma left hanging from the last Politburo session—one that perhaps has no peaceful solution.\n\nThe ultimate goal of a workers' government has never wavered: to tear the German bourgeoisie limb from limb. The burning ideal to wash away the humiliation of 1918 had not dimmed for over two decades. Nikolai remembered every waking moment of it—from the bitter road out of Leningrad to the vaulted halls of the Moscow citadel. He would never forget. But could those agonizing memories serve as the bedrock of courage? In Nikolai's trembling hand lay a dossier. Both the Red Army Research Institute and the Politburo demanded the same thing: the current Red Army was far too weak to drive out the Germans, demanding his personal intervention to authorize a massive, additional mobilization. His soul recoiled. Who was he to drive the masses back into the slaughterhouse? Koba, perhaps, possessed the stomach for such cruelty, but not he. The conditions within the ranks were already desperate, plagued by brutal excesses and systemic neglect. To draft more men was to invite rivers of fresh suffering—and a torrent of curses directed squarely at his name. Nikolai shrank from the choice. It was... monstrously cruel. Yet, logic was on their side. And the Kremlin was giving him no escape."
 Soviet.17.a:0 "-Signed: Nikolai Ivanovich Bukharin, Chairman of the Council of People's Commissars."
 Soviet.18.t:0 "Common Cause"
 Soviet.18.d:0 "The conquest of power is a path no sane man believes to be easy. Yet men dare it driven by grand ambitions. And Tukhachevsky harbors ambitions of the highest order:\nTo beat back the imperialist empires, including Germany, and submerge the entire world in the crimson tide of communism.\nYet Bukharin's current regime is blinded entirely by a singular obsession with revenge against Germany. His policies will inevitably deliver Soviet Russia bound and gagged into the hands of France, Britain, and the United States. To avert this catastrophe, Tukhachevsky has begun laying the groundwork for a coup, seeking to gather comrades who share his revolutionary zeal. Whether they follow him out of genuine ideological devotion or divergent tactical goals matters little for now; the immediate necessity is simply gathering enough strength to ensure the coup's triumph."
 Soviet.18.a:0 "Same bed, different dreams."
 Soviet.19.t:0 "The Army Subservient to Civil Authority"
 Soviet.19.d:0 "Were an absolute Tsar of all the Russias to gaze upon this era, he would surely draw a heavy, despairing breath. Though the mindset of that ill-fated autocrat remains buried in the past, Nikolai Ivanovich Bukharin shares his certainty on one front: the utter failure to subordinate the Red Army is a catastrophic menace. Today, the once-glorious military has degenerated into a factional cabal dancing to the tune of a handful of ambitious generals. It is rotting from within, sliding toward collapse. If only this single directive could sweep away all his anxieties! The Politburo has resolved to execute the plan long held in readiness—a formal proclamation addressed to every officer and man clad in khaki. Nikolai prays this deals a decisive blow to the bloated prestige of those arrogant old warlords. The core mandate is absolute: every military unit above a specified threshold shall henceforth have a political commissar dispatched directly from the Soviet, whose counsel must be strictly heeded by all commanders. Nikolai has already personally vetted and compiled the roster of loyal party members to be assigned to each unit—men of proven reliability who categorically refuse to follow Tukhachevsky. It was the fruit of desperate labor to prevent figures akin to the Red Napoleon from sweeping aside civil authority on the pretext of military incompetence. Should the Red Army rise in total rebellion, the situation would turn perilous indeed, yet the old marshals would likely shrug it off as bureaucratic red tape, perhaps even losing the order amidst the hundreds of daily dispatches flooding their desks. One way or another, Nikolai's design would bear fruit. With a tense expression, he set his signature to the document, then summoned his chief of staff to issue a chilling warning: 'Under no circumstances shall this reach his eyes.' Days later, the fallout arrived. The only general to scream in frantic protest was Tukhachevsky—that venomous, cunning viper. The broader officer corps had simply stamped the directive without grasping its true significance. That evening's Politburo meeting was saturated with the triumphant applause of its members. The Communist Party of the Soviet Union had finally secured a firm, unshakeable leash upon the Red Army, enabling them to monitor its every move. Radiating satisfaction, Nikolai poured heavy drafts of aged liquor for his comrades."
 Soviet.19.a:0 "We must find a Russian St. Helena for him."
 Soviet.20.t:0 "Clipping the Wings"
 Soviet.20.d:0 ""What is this? No, no! I cannot be discarded like this! No!" Ever since Bukharin seized power, a heavy tension has gripped the Soviet state. Following a protracted, silent struggle of wills between Bukharin and Tukhachevsky, the General Secretary has resolved to strip Tukhachevsky of his principal supporters. Rokossovsky has been cast into prison, while Yakir, moving swiftly, petitioned Bukharin for a voluntary demotion accompanied by a public self-criticism. While the total collapse of the old Troika means state repression is no longer a constraint for Bukharin, failure to effectively crush the Tukhachevsky faction will inevitably lead straight to a coup d'état."
 Soviet.20.a:0 "An unstable Soviet."
 Soviet.21.t:0 "The Officers' Purge"
 Soviet.21.d:0 "At last, the dark shadow of the purges has penetrated the ranks of the [SOV.GetName]'s military. Last night, several high-ranking officers were abruptly dragged away by political police under charges of treason. The sanctuary of the armed forces has been breached; no one is safe from the purge."
 Soviet.21.a:0 "Terrifying."
 Soviet.22.t:0 "The Trial of Bukharin"
 Soviet.22.d:0 "The final tribunal for Bukharin and his co-conspirators concluded today. Arrested a week prior on charges of treason, they were universally found guilty. Bukharin has been sentenced to Siberian exile, while his subordinates face severe penal servitude. This effectively grants Stalin absolute mastery over the [SOV.GetName], signaling the imminent initiation of a sweeping purge to liquidate all remaining pockets of opposition."
 Soviet.22.a:0 "\"And thus, the end has come.\""
 Soviet.23.t:0 "Bukharin Seizes Power"
 Soviet.23.d:0 "Driven by a desperate sense of survival against the looming threat of Stalin's purges, anti-Stalinist factions within the [SOV.GetName] united in revolt. Nikolai Bukharin, leading his loyal cadres, executed a complete takeover of Moscow and hurled Stalin from his pedestal. Stalin's current whereabouts remain unknown, leaving the [SOV.GetName] firmly under the dominion of Bukharin."
 Soviet.23.a:0 "The era of Bukharin."
 Soviet.24.t:0 "Trotsky Seizes Power"
 Soviet.24.d:0 "Driven by a desperate sense of survival against the looming threat of Stalin's purges, anti-Stalinist factions within the [SOV.GetName] united in revolt. Lev Trotsky, leading his loyal cadres, executed a complete takeover of Moscow and hurled Stalin from his pedestal. Stalin's current whereabouts remain unknown, leaving the [SOV.GetName] firmly under the dominion of Trotsky."
 Soviet.24.a:0 "The era of Trotsky."
 Soviet.25.t:0 "Soviet Civil War"
 Soviet.25.d:0 "The relentless pressure of the purges has finally plunged the [SOV.GetName] into civil war. Stalin's recent campaign against his political rivals provoked a violent backlash from Bukharin and his allies, culminating in an open armed rebellion. As the echoes of the first Russian Civil War fade into history, the eyes of the world turn once more to determine the victor of a fratricidal conflict."
 Soviet.25.a:0 "Crush the traitors!"
 Soviet.25.b:0 " Rally behind Bukharin!"
 Soviet.26.t:0 "Soviet Civil War"
 Soviet.26.d:0 "The relentless pressure of the purges has finally plunged the [SOV.GetName] into civil war. Stalin's recent campaign against his political rivals provoked a violent backlash from Trotsky and his allies, culminating in an open armed rebellion. As the echoes of the first Russian Civil War fade into history, the eyes of the world turn once more to determine the victor of a fratricidal conflict."
 Soviet.26.a:0 "Crush the traitors!"
 Soviet.26.b:0 "Rally behind Trotsky!"
 Soviet.29.t:0 "Aftermath of the Purges Subsides"
 Soviet.29.d:0 "Though the relentless wave of purges left society paralyzed for months, the heavy psychological gloom has finally begun to lift, and public life is slowly regaining its vitality."
 Soviet.29.a:0 "A welcome development."
 Soviet.31.t:0 "Bukharin's Plea for Assistance"
 Soviet.31.d:0 "Late last evening, Bukharin made clandestine contact with our government, urgently requesting expanded support to counter Stalin. Ever since Stalin seized ascendancy, our nation has covertly backed Bukharin to sow persistent chaos within the [SOV.GetName]. However, Stalin's recent, aggressive consolidation of power has profoundly terrified Bukharin. Our response shall be..."
 Soviet.31.a:0 "We shall grant it."
 Soviet.31.b:0 "Impossible."
 Soviet.32.t:0 "German Assent"
 Soviet.32.d:0 "Berlin has resolved to extend its support to our cause. Their backing shall pave a smoother path toward our seizure of power."
 Soviet.32.a:0 "Flawless."
 Soviet.33.t:0 "German Refusal"
 Soviet.33.d:0 "Ultimately, Germany has rejected our appeals. We shall settle accounts with Stalin relying solely on our own strength."
 Soviet.33.a:0 "Regrettable."
 Soviet.34.t:0 "Clandestine Gathering in Leningrad"
 Soviet.34.d:0 "In a shadowed, gloomy alleyway of Leningrad, a figure wrapped tightly in a heavy black coat slipped into an unassuming tavern.\nOnce the heavy oak door clicked shut, the interior revealed itself to be a remarkably mundane drinking establishment. Glancing cautiously about, the man made his way directly to the bartender.\n\"Ilyich Ulyanov.\"\nHearing the coded phrase, the bartender cast a brief, knowing glance before motioning him to follow. The man fell into step behind him in silence. Pausing before an unmarked door, the bartender stepped aside, gesturing toward the threshold. As the man pushed it open, every pair of eyes in the room instantly locked onto him.\nThe heavy, palpable tension bore no resemblance to a common tavern.\n\"At last you have arrived, Comrade.\"\nBreaking the stagnant silence, one of the men seated at the table spoke.\n\"Come take your seat. We have much to discuss.\"\nThe man crossed the threshold, and the door slammed shut behind him."
 Soviet.34.a:0 "A moment later, the distinct sound of a lock turning echoed."
 Soviet.35.t:0 "Bukharin Ascends to Power"
 Soviet.35.d:0 "Stunning news broke from the [SOV.GetName] late last evening: Stalin has been stripped of his authority, and Bukharin has emerged as the new supreme leader of the [SOV.GetName]. After years of bitter political rivalry and tireless maneuvering, Bukharin's ambitions have finally borne fruit. Stalin's current whereabouts are entirely unknown, though rumors whisper he has already been liquidated in secret. With Bukharin at the helm, profound economic, diplomatic, and political transformations await the [SOV.GetName]."
 Soviet.35.a:0 "At last, victory is ours."
 Soviet.35.b:0 "Now, let us prepare to collect our due."
 Soviet.35.c:0 "Bukharin's triumph."
 Soviet.36.t:0 "Demands upon the [SOV.GetName]"
 Soviet.36.d:0 "Having sustained Bukharin through his darkest struggles, we now reap the rewards as he assumes leadership of the [SOV.GetName]. It is time to present our rightful bill. Our demand shall be..."
 Soviet.36.a:0 "Demand arms factories."
 Soviet.36.b:0 "Demand civilian factories."
 Soviet.36.c:0 "Demand resources."
 Soviet.37.t:0 "German Demands"
 Soviet.37.d_1:0 "The inevitable has come to pass. The German government has covertly approached us, demanding the transfer of a portion of our arms factories to the Reich. We have no choice but to comply, praying this satisfies their appetite. Should we refuse, Berlin will undoubtedly bare its teeth in open hostility."
 Soviet.37.d_2:0 "The inevitable has come to pass. The German government has covertly approached us, demanding the transfer of a portion of our civilian factories to the Reich. We have no choice but to comply, praying this satisfies their appetite. Should we refuse, Berlin will undoubtedly bare its teeth in open hostility."
 Soviet.37.d_3:0 "The inevitable has come to pass. The German government has covertly approached us, demanding the transfer of a portion of our vital resources to the Reich. We have no choice but to comply, praying this satisfies their appetite. Should we refuse, Berlin will undoubtedly bare its teeth in open hostility."
 Soviet.37.a:0 "We must accept."
 Soviet.37.b:0 "We know nothing of this."
 Soviet.38.t:0 "[SOV.GetName] Responds"
 Soviet.38.d_1:0 "The [SOV.GetName] has acceded to our demands, agreeing to deliver what we asked. It stands as clear vindication of our long-term investments."
 Soviet.38.d_2:0 "With unmitigated ingratitude, the [SOV.GetName] has rejected our rightful demands. We shall unleash every punitive measure at our disposal to shatter them."
 Soviet.38.a:0 "Excellent."
 Soviet.38.b:0 "Impose severe sanctions."
 Soviet.39.t:0 "Draconian German Sanctions"
 Soviet.39.d:0 "Infuriated by our defiance, Germany and its puppet states have slapped a total embargo upon us, simultaneously sealing the European borders of the [SOV.GetName] and applying crippling economic pressure."
 Soviet.39.a:0 "Let them try!"
 Soviet.40.t:0 "Bukharin's Rebuke"
 Soviet.40.d:0 "\"You cannot do this, Comrade!\"\nInside the Provisional Soviet Political Bureau in Vladivostok, Bukharin bellowed at the top of his lungs. Shoving aside the guard who barred his path, he threw the office door wide open.\n\"Explain yourself, Trotsky!\"\nTrotsky, seated calmly amidst a sea of documents, slowly raised his eyes.\n\"What is the meaning of this intrusion, Comrade?\"\n\"Do you take me for a fool?\" Bukharin's face was flushed a furious crimson.\n\"You swore that if I backed your bid, you would place me in the seat of the People's Commissar. Yet look at me—relegated to some worthless, subordinate office!\"\n\"Comrade, I stated that such an arrangement was conceivable; I never gave a binding oath.\" Trembling with uncontainable rage at Trotsky's evasive wordplay, Bukharin shook from head to toe.\n\"You have brought this entirely upon yourself.\" With that single, cutting retort, Bukharin stormed out of the room."
 Soviet.40.a:0 "We must prepare for the worst."
 Soviet.41.t:0 "Bukharin's Uprising"
 Soviet.41.d:0 "Having previously united with Trotsky to overthrow Stalin, Bukharin has now severed ties with him, igniting yet another civil war. The [SOV.GetName] is thus torn into a brutal three-way struggle between Stalin, Bukharin, and Trotsky—a crucible that will seal the nation's ultimate destiny while leaving staggering social and economic devastation in its wake."
 Soviet.41.a:0 "The fate of the [SOV.GetName] slips further into the abyss."
 Soviet.42.t:0 "End of the Soviet Civil War"
 Soviet.42.d:0 "The Trotskyist faction has emerged victorious from the Soviet Civil War. The anti-Trotskyist coalition committed critical strategic blunders that sealed their doom. As a staunch advocate of permanent revolution, Trotsky signals a dramatic shift in the [SOV.GetName]'s foreign policy. Yet the nation lies utterly ravaged by the internecine conflict, and urgent reconstruction must begin."
 Soviet.42.a:0 "A new Soviet."
 Soviet.43.t:0 "Conclusion of the Third Five-Year Plan"
 Soviet.43.d:0 "The final economic blueprint for the [SOV.GetName] has reached its culmination, marking our economic policies as a resounding success and dramatically expanding the nation's industrial scale and growth rate. With this chapter closed, the Soviet government shifts its full energies toward advanced industries, massive capital investments, and grand state projects."
 Soviet.43.a:0 "The triumph of socialism."
 Soviet.44.t:0 "Treaty of Hamburg"
 Soviet.44.d:0 "Germany has offered us a non-aggression pact in exchange for economic cooperation."
 Soviet.44.a:0 "Splendid."
 Soviet.44.b:0 "Absurd."
 Soviet.45.t:0 "Second Russian Civil War"
 Soviet.45.d:0 "Astonishing news from the [SOV.GetName] has shocked the globe: the Russian White Army, once defeated by Soviet Russia, has risen in a new civil war. Figures such as Kerensky and Kolchak, having rallied abroad, have forged an anti-Soviet coalition and launched an offensive against the current masters of Russia. The White movement is expected to actively court foreign powers terrified by the global spread of communism. The slumbering bear of the East has been violently roused."
 Soviet.45.a:0 "The resurrection of the Russian Republic."
 Soviet.46.t:0 "End of the Soviet Civil War"
 Soviet.46.d:0 "Stalin's faction has emerged victorious from the Soviet Civil War. The Trotskyist faction committed critical military blunders that paved the way for Stalin's triumph. A sweeping political purge now appears inevitable. Nevertheless, the [SOV.GetName] has suffered catastrophic damage and desperately requires restoration."
 Soviet.46.a:0 "Stalin's Soviet."
 Soviet.47.t:0 "End of the Soviet Civil War"
 Soviet.47.d:0 "The opposition faction has emerged victorious from the Soviet Civil War. The Troika committed severe military miscalculations that led to their downfall. This victory promises radical reorientations in the [SOV.GetName]'s economic and foreign policies, though the nation remains severely devastated and demands immediate rehabilitation."
 Soviet.47.a:0 "An astonishing turn of events."
 Soviet.48.t:0 "Aid from [FROM.GetName]"
 Soviet.48.d:0 "The government of [FROM.GetName] has resolved to supply us with 2,000 rifles. This assistance will prove invaluable, serving as a vital stepping stone to crush the wicked [SOV.GetName]."
 Soviet.48.a:0 "A favorable omen."
 Soviet.49.t:0 "Terror Strikes Moscow!"
 Soviet.49.d:0 "A horrifying atrocity shook Moscow this morning. Terrorists loyal to the White movement launched coordinated, indiscriminate attacks across roadways and factories, culminating in a devastating bomb blast targeting civilians. The perpetrators were slain on the spot, and police authorities are convinced the White Army orchestrated the carnage."
 Soviet.49.a:0 "Scum!"
 Soviet.50.t:0 "The Great Western Uprising"
 Soviet.50.d:0 "Anti-communist forces launched a massive armed insurrection across western Russia this morning. Styling themselves the Russian White Army, they struck at [SOV.GetName] garrisons, seizing vast stores of weaponry and vital industrial sites. This plunges the [SOV.GetName] into a punishing two-front struggle, dragging out the bloodshed. Perhaps this Second Russian Civil War shall end in White victory after all."
 Soviet.50.a:0 "Crush communism!"
 Soviet.51.t:0 "End of the Second Russian Civil War"
 Soviet.51.d:0 "A relentless series of titanic battles across Russia has culminated in the triumph of the Russian Republic. The [SOV.GetName] forces suffered catastrophic losses, ultimately forfeiting Moscow and capitulating entirely to the White Army. Reversing the outcome of the first civil war, Russia has been thrust back into the capitalist fold. A brutal purge of Soviet communists is unavoidable, and blood will flow across Russia for a long time to come."
 Soviet.51.a:0 "The end of communism."
 Soviet.52.t:0 "End of the Second Russian Civil War"
 Soviet.52.d:0 "A relentless series of titanic battles across Russia has culminated in the triumph of the [SOV.GetName]. The White Army suffered catastrophic losses, ultimately forfeiting its temporary capital and submitting entirely to the Red Army. Just as in the first civil war, the Red Army has secured ultimate victory. A massive purge of anti-communists is unavoidable, and blood will flow across Russia for a long time to come."
 Soviet.52.a:0 "The death of the Russian Republic's dream."
 Soviet.53.t:0 "Preparing for the First Russian General Election"
 Soviet.53.d:0 "The Russian Republic's inaugural general election shall be held within the coming month. First, we must determine which political forces to cultivate as our primary supporters."
 Soviet.53.a:0 "The Monarchists and the Military"
 Soviet.53.b:0 "The Republicans and the Citizens"
 Soviet.54.t:0 "Backing a Faction"
 Soviet.54.d:0 "Two prominent parties stand as the likely victors and prospective rulers in the upcoming election. Let us throw our weight behind one of them to secure their triumph."
 Soviet.54.a:0 "Support Stavka."
 Soviet.54.b:0 "Support the Constitutional Democratic Party."
 Soviet.55.t:0 "Hosting a Banquet"
 Soviet.55.d:0 "Prior to the general election, we shall host a grand banquet to court key influential figures and align them with our cause. Those invited to the tables shall be..."
 Soviet.55.a:0 "The Kolchak faction."
 Soviet.55.b:0 "The Kerensky faction."
 Soviet.56.t:0 "The First Russian General Election"
 Soviet.56.d:0 "At last, Russia's first general election has concluded with a remarkably high turnout of 50 percent, determining the nation's new president. The victor of this historic election is..."
 Soviet.56.a:0 "The ballot holds the truth."
 Soviet.57.t:0 "Russian Demands"
 Soviet.57.d:0 "We are facing formal pressure from Moscow demanding our incorporation into Russian rule. Shall we acquiesce to this?"
 Soviet.57.a:0 "We shall comply."
 Soviet.57.b:0 "No, our potential remains unfulfilled!"
 Soviet.58.t:0 "[From.GetName] Subsumed into Russia"
 Soviet.58.d:0 "The parliament of [From.GetName] has formally petitioned for integration into Russian administration. We shall reorganize [From.GetName] as an integral part of Russia."
 Soviet.58.a:0 "Welcome home."
 Soviet.59.t:0 "[From.GetName] Refuses!"
 Soviet.59.d:0 "With outrageous insolence, [From.GetName] has rejected Russian integration! What such a wretched state hopes to accomplish on its own remains an unfathomable mystery."
 Soviet.59.a:0 "Declare war."
 Soviet.60.t:0 "Military Crisis"
 Soviet.60.d:0 "Despite protracted battles and staggering casualties, we have surrendered numerous vital territorial bulwarks to the German invaders. Morale within our ranks has plummeted to catastrophic depths, and defeatism festers throughout the military. Countless soldiers attempt desertion or openly defy commanders' orders. Unless the front is stabilized, our entire armed forces face total collapse."
 Soviet.60.a:0 "Urgent measures must be taken."
 Soviet.61.t:0 "Formation of the Soviet Union"
 Soviet.61.d:0 "Today in Moscow, the leaders of Russia, Ukraine, Belarus, and the Transcaucasian Soviet Federative Socialist Republic convened to officially proclaim the creation of the Union of Soviet Socialist Republics. The historic pact was forged in the Moscow Kremlin under the leadership of the Russian Soviet, amidst a grand display of fluttering red banners. This newly unified federal state steps onto the world stage as a fresh titan grounded in socialist theory. Appointed to premier government posts, the delegates passionately declared that 'our Union faces its historic destiny as the ultimate bastion for the progress of human civilization and true justice.' In a land once backward and subjugated prior to 1917, workers wave red flags, exulting in the birth of their federation."
 Soviet.61.a:0 "Be glorified, our free Motherland!"
 Soviet.62.t:0 "The Soviet Civil War"
 Soviet.62.d:0 "Escalating tensions between the Troika faction—upholding the New Economic Policy—and the anti-Troika opposition have ruptured into yet another civil war. Masses rising against the tyranny of Bukharin and his peers have sparked an uprising whose outcome will fundamentally alter the destiny of the Soviet Union."
 Soviet.62.a:0 "Who shall prevail?"
 Soviet.63.t:0 "Another Revolution"
 Soviet.63.d:0 "At the center of the assembly hall stood a towering red banner. Embossed with a golden hammer and sickle, it symbolized prosperity, progress, and revolution for the workers. Yet Yuri knew it for what it truly was—a cloth drenched in ash and blood. With every flutter of the flag, the faces of the countless enemy soldiers he had slain flashed before his eyes.\n\n\"Comrades!\" shouted a young political commissar from the podium, his voice echoing through the chamber. \"Today, we take the first step to heal past fractures and establish a new Supreme Soviet! The counter-revolutionaries of the world claimed our revolution was dead, but they were wrong. The revolution is not ended—it has only just begun!\"\n\nThe crowd erupted in applause, but Yuri bowed his head. The cheering sounded to him like crackling flames devouring wood. 'Is revolution, then, an endless war?' he asked himself quietly."
 Soviet.63.a:0 "How much more blood must flow beneath this red star?"
 Soviet.64.t:0 "The New Constitution"
 Soviet.64.d:0 "The basement chambers of the Kremlin where the draft constitution was being forged were thick with suffocating heat. Like an ancient smithy of history, the committee hammered out the framework of the state. Yet ironclad disputes turned the room into a theater of shouts and flying fists.\n\n\"We must never forget we are laying the foundations of a new nation!\" roared a committee member in agitation, his hand frantically scratching at papers spread across the desk. Yet the sentences left in the wake of his pen refused to cohere—to his peers, they looked like a leaning tower destined to collapse at any moment.\n\n\"Isn't this going too far? Such radical clauses will invite disaster down the road,\" another retorted, tapping a finger sharply against the desk. Though the 'revolution' was over, the language of the law remained volatile and chaotic. Amidst a young delegate leaping across the table to brand his opponent a 'capitalist lackey' with a flushed face, the clauses of the new constitution grated against one another like misaligned gears."
 Soviet.64.a:0 "What kind of madness is this... a political commissar?"
 Soviet.65.t:0 "Recovery"
 Soviet.65.d:0 "\"Comrades! Splendid news! Our comrades at the front have secured victory!\" Ivan could scarcely recall what he had done upon hearing those words, though he vividly remembered the deafening cheers of those around him. In truth, he understood little of civil wars or revolutions. Weren't both called 'Soviet,' and didn't both wave red banners? Yet Ivan had learned since the days of the Empire that siding with whoever happened to protect you at the moment was the surest way to survive unmolested.\n\nFortunately, the current government offered aspects genuinely to Ivan's liking. With the civil war concluded, the regime enacted baffling yet effective measures that stabilized a populace shattered by years of strife. While grumblers complained that their diet had merely shifted from watery gruel to thin borsch, Ivan had no patience for them. Had they forgotten the horrors of the Tsarist era and the Red-White fratricide? He was prepared to give full credit to a government making genuine efforts to secure stability. Three meals a day, a roof shielded from the rain, and officials touring the countryside proclaiming they served the people—if this wasn't a proper country, what was?"
 Soviet.65.a:0 "At any rate, Ivan felt a quiet stability in his life."
 Soviet.66.t:0 "Beneath the Red Sky"
 Soviet.66.d:0 "He gazed upward at the sky. His entire life felt as though it had battered him like a midday squall. He had sworn to labor eternally for the people, ascending to his high office only after shedding seas of blood.\n\n\"Comrade Lenin, what are we to do?\"\n\nBukharin muttered softly, sweeping a hand across his brow. Even seated at the pinnacle of supreme authority, the revolution refused to grant him rest.\n\nAbove all, a colossal threat loomed to the west: the Kaiserreich—the Germanic power that had crushed Britain and France alike and toppled even the seemingly immortal Russian Empire. The architects of the humiliating Treaty of Brest-Litovsk. They would inevitably move to invade the Soviet masses. To preempt that blow, the nation must grow strong. By forging the Soviet into a superpower and striking Germany preemptively, victory could be seized... Without realizing it, Bukharin's thoughts were growing chillingly similar to those of the very political rivals he despised.\n\nHe stared down at the map. Ukraine, the Baltics, Belarus—the peoples of those vast lands languished under German shackles. Once more, Bukharin vowed silently:"
 Soviet.66.a:0 "Such a catastrophe shall never be repeated."
 Soviet.67.t:0 "One Federation, Two Governments"
 Soviet.67.d:0 "The Soviets claiming to represent all-Russian toilers remain dangerously fractured. Naturally, paths toward an unfinished socialist paradise diverge, yet today's crisis stems from a far unhealthier source.\n\nImpoverished socialism is backward socialism—the efficacy of the New Economic Policy (NEP), once bitterly criticized by Nikolai Bukharin, has finally worn thin. While the Red Army offers nominal support, it is transparently clear that economic theory holds little genuine interest for the officer corps. Any visitor to Moscow witnesses factional squabbles infesting every street corner, dividing administrative offices and military academies alike. The wounds of the previous civil war remain unheeded, tearing society in two.\n\nOur great Soviet stands disunited. The federal government and the military lock horns in constant, independent factional warfare. None wish to follow in the footsteps of Kamenev, whose desperate bid to clasp hands with the entire world brought only ruin. Amidst the confrontation between Bukharin and Tukhachevsky, the hour of choice draws near."
 Soviet.67.a:0 "There cannot be two suns in the Russian sky."
 Soviet.68.t:0 "Communist Demonstrations"
 Soviet.68.d:0 "Anti-government protests chanting communist slogans have surged dramatically of late. The administration attributes this agitation to foreign subversion, heavily suspecting Soviet Russia as the prime instigator. They appear to be inciting our labor force to sabotage national stability. How the government responds to this threat is of paramount importance."
 Soviet.68.a:0 "Suppress them with an iron fist."
 Soviet.68.b:0 "Respond with conciliation."
 Soviet.68.c:0 "Ignore them."
 Soviet.69.t:0 "Stalin and His Clique"
 Soviet.69.d:0 "At approximately 9:00 AM today, the public trial commenced for Stalin and his followers, charged with high treason and Marxist revisionism. The Moscow Tribunal sentenced them to rigorous imprisonment ranging from ten to twenty years, with Stalin himself receiving a thirty-year sentence. A historic moment unfolded as the once-omnipotent center of Soviet power collapsed.\n\nContrary to widespread expectations, Stalin was spared the death penalty—a leniency some attribute to Bukharin's inherently moderate disposition. Regardless, the Soviet state confronts yet another profound turning point. All eyes now turn to the impending trial of Trotsky."
 Soviet.69.a:0 "A fitting punishment for traitors."
 Soviet.70.t:0 "Zinoviev and His Clique"
 Soviet.70.d:0 "At approximately 1:00 PM today, the trial opened for Zinoviev and his associates, charged with high treason and violations of the ban on anti-state ideologies. Handing down sentences mirroring the previous trial, the Moscow Tribunal imposed ten to twenty years of imprisonment, alongside permanent deportation for Zinoviev himself.\n\nPredictable as the prior verdict against Stalin, no death sentences were issued, further underscoring Bukharin's paternalistic style of governance. Consequently, the terror of sweeping political purges has noticeably receded from public consciousness."
 Soviet.70.a:0 "The traitors have been dealt with."
 Soviet.71.t:0 "To an Unfamiliar Foreign Shore"
 Soviet.71.d:0 "Mikhail Tukhachevsky leaned heavily against the stern railing. The red flag fluttering in the sea breeze was identical to the one crowning the ancient Kremlin spires, yet to him, it cut a profoundly pathetic figure. Why? The answer was agonizingly obvious. Just as everything in western Russia had vanished at Brest-Litovsk, Mikhail had lost every shred of his influence. The once-feared Marshal was now reduced to a weary middle-aged nobody clad in a fancy uniform, utterly drained of strength.\n\nReflecting upon the past twenty hours revealed only a cascade of failures. The majority of the troops had flatly rejected his authority, pointing their bayonets at his chest instead. His grand coup plots in Moscow and Leningrad had been exposed long ago, and his most trusted adjutant proved to be a minion of Bukharin. Could any fate be more wretched than his present existence? The essence of a coup is swiftness; literally, Mikhail was the most rapidly fallen general in all of Russia.\n\nIndecisive as to his next step, he had departed the naval port of Leningrad carrying only his passport and a meager pouch of rubles. Dimly shimmering across the dark crimson waters of the northern sea, the mother star comforting our planet offered no answers. The stars seemed unusually blurred this evening.\n\n'The shadows of white seabirds are nowhere in sight. Nor upon the mast,'"
 Soviet.71.a:0 "'Nor upon the surrounding seas.'"
 Soviet.72.t:0 "Military Coup"
 Soviet.72.d:0 "In the chilling hours of dawn, rebel forces spearheaded by Tukhachevsky advanced upon the Moscow Kremlin. Attempting to breach the barricades erected around the citadel, the insurgent troops clashed fiercely with loyalist defenders. The victor of this desperate struggle is..."
 Soviet.72.a:0 "Tukhachevsky's conspiracy was leaked in advance; his assault failed."
 Soviet.72.b:0 "Tukhachevsky successfully seized the Kremlin."
 Soviet.73.t:0 "Political Purges"
 Soviet.73.d:0 "Throughout the day, summary tribunals hastily processed numerous politicians tied to the Bolshevik apparatus. The proceedings were rushed at a breakneck pace, resulting almost universally in prison terms, with only a tiny fraction cleared of charges or acquitted. The aftershocks of this purge promise to endure for a long time."
 Soviet.73.a:0 "Terrifying."
 Soviet.74.t:0 "Enactment of the Parliamentary Act"
 Soviet.74.d:0 "Yesterday afternoon, the Supreme Soviet enacted the Parliamentary Act, officially outlawing all political parties save for the ruling vanguard and ordering their immediate dissolution. People's Commissar Tukhachevsky hailed the measure as an emergency step to unify a fractured Soviet, cementing his absolute one-man dictatorship."
 Soviet.74.a:0 "The dawn of tyranny."
 Soviet.75.t:0 "The Hunt Commences"
 Soviet.75.d:0 "A massive manhunt for Bukharin has been unleashed. Having vanished into the shadows following Tukhachevsky's seizure of the Kremlin, Tukhachevsky has mobilized vast resources to hunt down one of the people's ultimate enemies."
 Soviet.75.a:0 "Will the search bear fruit?"
 Soviet.76.t:0 "Top Secret"
 Soviet.76.d:0 "Report on the Search for Bukharin\n\n- Red Army Main Intelligence Directorate\n\n\nActing upon orders from the Supreme Command of the Red Army, this Directorate launched a sweeping operation to ascertain the whereabouts of former General Secretary Nikolai Ivanovich Bukharin, who vanished following the coup. Below is a summary of operations and findings:\n\n\n- Completed searches of 47 priority safehouses and underground networks within Moscow.\n\n- Raided 19 dachas (estates reserved for former high-ranking officials) in the Moscow suburbs.\n\n- Tightened surveillance at border checkpoints anticipating foreign escape routes (Polish, Romanian, and Manchukuo borders).\n\n- Detained and interrogated 37 individuals linked to Bukharin.\n\n\nConclusion:\n\nDefinitive proof of survival: Unconfirmed.\n\nCorpse or conclusive evidence of death: Recovered.\n\nLast reported sighting in Moscow:\n\nEyewitness testimony places a wounded man near the Kremlin shortly after midnight on the day of the coup, though the timeline fails to align with the outbreak of the rebellion."
 Soviet.76.a:0 "Where on earth could he be hiding?"
 Soviet.77.t:0 "Search Fails"
 Soviet.77.d:0 "Ultimately, the search parties failed to unearth Bukharin. In his absence, a show trial was conducted in Moscow against his cronies, handing down severe prison sentences. Though Bukharin was condemned to death in absentia, he remains at large, rendering the sentence purely symbolic."
 Soviet.77.a:0 "A trial of Bukharin... without Bukharin."
 Soviet.78.t:0 "Execution of Kollontai"
 Soviet.78.d:0 "This morning marked the execution of Kollontai, condemned to death for treason. A pillar of the former Bukharin administration, she was singled out by Tukhachevsky as a prime 'traitor.' Her execution served as a stark public demonstration of the undisputed supremacy of Tukhachevsky's regime."
 Soviet.78.a:0 "Farewell."
 Soviet.79.t:0 "Punishment of the Troika"
 Soviet.79.d:0 "Formal tribunals for the Troika concluded this morning. Stalin, Trotsky, and Zinoviev were condemned to death, while lesser figures received decades of imprisonment—a stark testament to the total eclipse of the old Bolshevik central powers."
 Soviet.79.a:0 "Power vanishes overnight."
 Soviet.80.t:0 "Capital Rallies Backed by [FROM.GetName]"
 Soviet.80.d:0 "Several political factions have announced mass rallies in the capital this week. Aside from demands that our nation demonstrate greater efforts to improve ties with [FROM.GetNameDef] and purge public offices of politicians critical of the [FROM.GetAdjective] regime, the demonstrators appear to voice few concrete grievances.\n\nWhile these protests may merely reflect spontaneous public sentiment, one striking detail stands out: several key ringleaders recently returned from visiting [FROM.GetCapitalVictoryPointName], growing noticeably more energetic in their agitation ever since."
 Soviet.80.a:0 "Well, citizens possess that right."
 Soviet.80.b:0 "Send in the police to crack some skulls!"
 Soviet.81.t:0 "Soviet Russia's Proposal to Join the Anti-German Front"
 Soviet.81.d:0 "Soviet Russia has appealed to us for arms assistance and proposed our secret participation in a joint anti-German front. It appears they harbor the exact same thirst for vengeance against Berlin as we do. A clandestine pact with them promises immense strategic benefits."
 Soviet.81.a:0 "Splendid!"
 Soviet.81.b:0 "We have no need for them."
 Soviet.82.t:0 "France Agrees to Our Proposal"
 Soviet.82.d:0 "The French government has agreed to forge an anti-German front with us, dispatching thousands of infantry equipment. This is magnificent news, marking a crucial stride toward crushing Germany."
 Soviet.82.a:0 "Prudent friends."
 Soviet.83.t:0 "France Rejects Our Proposal"
 Soviet.83.d:0 "The French government has rebuffed all our overtures, showing zero inclination to cooperate in an assault on Germany. This is disheartening news."
 Soviet.83.a:0 "We are sufficient unto ourselves."
 Soviet.84.t:0 "Coup in Moscow"
 Soviet.84.d:0 "Foreign correspondents in Moscow filed frantic dispatches regarding early morning gunfire echoing through the streets. Martial law was clamped down across the Western Russian Military District, and party troops seized key locations in Russia's iconic cities. General Mikhail Nikolayevich Tukhachevsky was spotted entering the Kremlin, with international observers identifying him as the architect of the coup.\n\nDubbed 'the most revolutionary general in all Russia,' Tukhachevsky wields immense clout within the Red Army. Debate swirls over whether his coup was opportunistic or long-planned, but consensus unites on one grim reality: civilian control over the Soviet military has collapsed. The German Ambassador in Moscow offered no comment on the day's events. The international community watches closely to see how Berlin-Moscow relations will be impacted."
 Soviet.84.a:0 "It has happened at last."
 Soviet.85.t:0 "Night of Distrust"
 Soviet.85.d:0 "Amidst the gloom of a Moscow night, a solitary figure gazed out from the Kremlin window. Bukharin lost himself in troubled contemplation, the name of Tukhachevsky echoing relentlessly through his mind.\nThough they had triumphed in the civil war to forge a workers' state, the Red Army's Tukhachevsky had recently exhibited alarming, insubordinate tendencies.\n\n'Something is amiss.'\n\nHe concluded.\nEven if tangible proof was lacking, Tukhachevsky was undeniably a mortal threat. Sweeping him from power was fast becoming an unavoidable destiny."
 Soviet.85.a:0 "Eliminating him has become an absolute necessity."
 Soviet.86.t:0 "Breeding Discontent"
 Soviet.86.d:0 "Gathering his divisional commanders beneath the nocturnal sky of Moscow, Tukhachevsky wrestled with dark resolves. Bukharin sought to clasp hands with our mortal enemies, France and Britain, and ultimately moved to discard Tukhachevsky himself.\nClenching his fists in fierce determination, he muttered:\n\n\"Let us truly begin.\"\n\nLeft unchecked, Bukharin's policies would drive the Soviet Union straight into ruin at the hands of capitalist powers. Striking him down swiftly and decisively was the sole remaining path to save Russia."
 Soviet.86.a:0 "For the Motherland."
 Soviet.87.t:0 "Intelligence Report"
 Soviet.87.d:0 "Moments ago, shocking intelligence reached our desk: Tukhachevsky and his faction are actively plotting a coup d'état. While definitive physical proof remains elusive, their suspicious movements provide ample cause for alarm, demanding a deeper, rigorous investigation into Tukhachevsky. Should their conspiracy be confirmed, robust counter-measures must be enacted immediately."
 Soviet.87.a:0 "I knew it."
 Soviet.88.t:0 "Formulating the Plan"
 Soviet.88.d:0 "A successful coup demands meticulous operational planning. Our loyal forces must swiftly seize the Supreme Soviet to paralyze parliamentary functions while simultaneously storming and occupying the Kremlin. We must capture Bukharin and the supreme committee members, hurl them from power, and swiftly establish our own government."
 Soviet.88.a:0 "Now, let us begin."
 Soviet.89.t:0 "Death of Kamenev!"
 Soviet.89.d:0 "Though no realist expected Kamenev to survive indefinitely, none anticipated his end would arrive quite so soon. His relentless efforts to reconcile and stabilize the various Soviet factions were shattered by a single assassin's bullet.\n\nClinging to life past the dawn of the new year of '36 to impart one final message, Kamenev finally passed away today. The entire nation is blanketed in mourning, and his funeral is being held with full state honors. To manage the political vacuum, a Troika collective leadership has been established; minor protests by the Workers' Opposition were swiftly drowned out by their sheer lack of numbers."
 Soviet.89.a:0 "What future awaits the Soviet Union?"

 #### TROIKA REWORK SECTION ####
 soviet_rework_troika.001.t:0 "Kamenev's Eternal Slumber"
 soviet_rework_troika.001.d:0 "On January 6, 1936, the inevitable occurred.\nKamenev finally joined Lenin in eternity, leaving both of them gone from the leadership of the glorious Russian Soviet Federative Socialist Republic.\nEver since, the Troika—comprising Joseph Stalin, Lev Trotsky, and Grigory Zinoviev—has prepared to seize the RSFSR's leadership and usher in a new era for the Republic. Yet, true to form, this triumvirate has faced unceasing resistance since its inception, and whether they can successfully consolidate power remains shrouded in doubt as rival factions clash over the Republic's destiny."
 soviet_rework_troika.001.a:0 "The Troika triumphs, for the Republic!"
 soviet_rework_troika.001.b:0 "The Troika is unfit; we require a new successor, for the People!"
 soviet_rework_troika.002.t:0 "Chairman Grigory Zinoviev"
 soviet_rework_troika.002.d:0 "Zinoviev maintains that the paramount objective of socialism is securing the freedom and equality of the Russian masses while liberating all oppressed peoples from the chains of bourgeois states. He insists that a one-man dictatorship in Russia breeds militarism and leads straight to ruin, making the decentralization of power within the federal government an absolute necessity. To ensure the unity of our federal government, the Red Army, and the toilers of the world, Zinoviev shall guide us."
 soviet_rework_troika.002.a:0 "The Chairman of Revolution"
 soviet_rework_troika.003.t:0 "General Secretary Joseph Stalin"
 soviet_rework_troika.003.d:0 "Presently, Russia possesses a military apparatus far inferior to powers such as Germany, Britain, and France. Stalin argues that raising Russia's global standing requires sweeping military reform and realistic rearmament. Furthermore, we must propagate Marxist-Leninist thought and project Russian influence beyond our domestic borders into neighboring lands. Stalin shall guide us toward balanced development."
 soviet_rework_troika.003.a:0 "The Centrist Secretary"
 soviet_rework_troika.004.t:0 "People's Commissar Lev Trotsky"
 soviet_rework_troika.004.d:0 "Trotsky asserts that safeguarding our homeland and transforming it into a great power demands that all Russians rally in iron solidarity beneath a strong leader. He insists that cultivating absolute loyalty through a singular creed is imperative. Threatened on all sides—from Germany in the west to Japan in the east—our survival depends upon Trotsky's leadership."
 soviet_rework_troika.004.a:0 "The Militaristic Commissar"
 soviet_rework_troika.005.t:0 "No Turning Back"
 soviet_rework_troika.005.d:0 "The hour has arrived. The man who shall seal Russia's fate is..."
 soviet_rework_troika.005.a:0 "The Chairman — International Revolution!"
 soviet_rework_troika.005.b:0 "The Secretary — Centrism!"
 soviet_rework_troika.005.c:0 "The Commissar — Militarism!"
 soviet_rework_troika.006.t:0 "First Steps Toward World Revolution"
 soviet_rework_troika.006.d:0 "The wave of communism prophesied by Karl Marx erupted from the Winter Palace in October 1918. Yet that revolutionary surge stalled in the wake of Germany's victory. Isolated and hemmed in, many erstwhile revolutionaries have retreated into cowardly compromise—an intolerable betrayal of communist principles. The international revolution is an absolute historical necessity that shall ignite alongside the collapse of capitalism."
 soviet_rework_troika.006.a:0 "Not an end, but a beginning."
 soviet_rework_troika.007.t:0 "Meeting with Left Communists"
 soviet_rework_troika.007.d:0 "Last evening, Soviet Chairman Grigory Zinoviev held a clandestine meeting with factions of left communists, focusing discussions primarily on strategies for international revolution and the role of labor unions.\n\nAs a politician sympathetic to left-communist ideals, Zinoviev's dialogue with them was predictable. This summit may well reshape the future trajectory of Soviet Russia."
 soviet_rework_troika.007.a:0 "A productive dialogue."
 soviet_rework_troika.008.t:0 "Cooperating with the Anti-Stalin Faction"
 soviet_rework_troika.008.d:0 "Reports surfaced last evening confirming that Chairman Zinoviev met with members of the anti-Stalin faction in a secure Moscow safehouse. While Zinoviev denies the claims, given his notorious relations with Stalin, such an encounter is entirely plausible. Stalin remarked that while unverified, such actions would deal a fatal blow to Troika unity."
 soviet_rework_troika.008.a:0 "Stalin's usefulness is zero in any case."
 soviet_rework_troika.009.t:0 "The Menace of Tukhachevsky"
 soviet_rework_troika.009.d:0 "No one can deny Tukhachevsky's military brilliance; however, his ideological reliability is highly questionable. He displays a suspicious obsession with expanding the armed forces while needlessly provoking neighboring states. Leaving him unchecked within the military invites catastrophe. Expelling him and his followers from the ranks is the prudent course."
 soviet_rework_troika.009.a:0 "He is a dangerous element."
 soviet_rework_troika.010.t:0 "A Reformed Military"
 soviet_rework_troika.010.d:0 "Sixty days following Tukhachevsky's trial, military reforms are complete, establishing a streamlined, highly efficient command structure. The Red Army shall no longer meddle deeply in politics."
 soviet_rework_troika.010.a:0 "A welcome outcome."
 soviet_rework_troika.011.t:0 "Breaking with Reformist Socialists"
 soviet_rework_troika.011.d:0 "Reformist socialists reject revolutionary socialism, cling to the capitalist framework, and peddle the delusion that communist ideals can be reached through gradual reforms. Such revisionism is both impossible and antithetical to our goals. Let us sever all ties with these reformist traitors worldwide and rally around revolutionary socialists to fan the flames of global revolution."
 soviet_rework_troika.011.a:0 "They are traitors."
 soviet_rework_troika.012.t:0 "Comintern Congress Convenes in Moscow"
 soviet_rework_troika.012.d:0 "Last evening in Moscow, communists from across the globe gathered for an international congress. Discussions centered on effective methods to export communism worldwide, bitter denunciations of reformist socialists, and the absolute correctness of the revolutionary line.\n\nCapitalist governments worldwide dismissed the gathering with widespread hostility. It remains to be seen what shockwaves this congress will send across the globe."
 soviet_rework_troika.012.a:0 "Long live communism!"
 soviet_rework_troika.012.b:0 "Fools."
 soviet_rework_troika.013.t:0 "The Trial of Trotsky"
 soviet_rework_troika.013.d:0 "This morning in Moscow, Lev Trotsky was brought in chains before a people's tribunal.\nTrotsky was tried for slandering Marxist ideals, defiling the sanctity of the revolution, and spearheading a militaristic, dangerous faction alongside his cohorts.\nThe court sentenced him to life imprisonment, with his followers receiving severe penal terms. Trotsky's faction shall no longer exert any influence over Zinoviev."
 soviet_rework_troika.013.a:0 "Farewell."
 soviet_rework_troika.014.t:0 "Trial of the Stalinist Faction"
 soviet_rework_troika.014.d:0 "With the collapse of Stalin's faction, his primary associates were dragged into custody. Prominent figures including Mikhail Kalinin, Nikita Khrushchev, and Lazar Kaganovich stood trial today, receiving thirty-year prison sentences alongside their co-conspirators. With his inner circle neutralized, only Joseph Stalin remains to face judgment."
 soviet_rework_troika.014.a:0 "Now it is time to deal with him."
 soviet_rework_troika.015.t:0 "The Trial of Stalin"
 soviet_rework_troika.015.d:0 "This morning in Moscow, Joseph Jugashvili was hauled before the court.\nConvicted of conspiring against the Soviet state, insulting workers' rights, and committing grave felonies against the Union, he was sentenced to life imprisonment. Stalin poses no further threat to Zinoviev.\nWith the elimination of both Trotskyist and Stalinist pillars, the Troika has effectively dissolved, cementing Zinoviev's ascent to power."
 soviet_rework_troika.015.a:0 "All propagators of false ideals have been purged."
 soviet_rework_troika.016.t:0 "Denouncing the Workers' Opposition"
 soviet_rework_troika.016.d:0 "At yesterday's party congress, Stalin launched a ferocious attack on the Workers' Opposition led by Bukharin and Kollontai. He blasted Bukharin's heavy industrialization policies as utterly detached from Soviet realities and harmful to the masses, while condemning Bukharin's reckless push for vengeance against Germany as a suicidal rush to destroy Russia. Stalin demanded the immediate arrest and trial of these terrorists."
 soviet_rework_troika.016.a:0 "They deserve every condemnation."
 soviet_rework_troika.017.t:0 "Chasing Chimeras"
 soviet_rework_troika.017.d:0 "At yesterday's party congress, Stalin delivered a searing critique of Zinoviev. While acknowledging that world revolution remains an ultimate communist goal, Stalin dismissed Zinoviev's timeline as radically impractical and unrealizable. Despite fierce pushback from Zinoviev's loyalists, Stalin pressed his attack, arguing that not every nation is ripe for instant revolution and that coercive force remains essential to liberate oppressed peoples."
 soviet_rework_troika.017.a:0 "Correct!"
 soviet_rework_troika.018.t:0 "The Trial of Bukharin"
 soviet_rework_troika.018.d:0 "This morning in a Moscow courtroom, Bukharin and his inner circle faced trial for inciting the masses and conspiring to overthrow the state. The tribunal found them guilty, sentencing Bukharin and his chief cronies to thirty years of labor camps. The Workers' Opposition is thoroughly crushed."
 soviet_rework_troika.018.a:0 "They flew too close to the sun."
 soviet_rework_troika.019.t:0 "A Star of the Kremlin"
 soviet_rework_troika.019.d:0 "In the era of the Tsars, Russia was crushed beneath a single autocrat. For centuries, the empire followed the Emperor's whip, exploiting and trampling the working class. As Stolypin noted, a single double-headed eagle watching over Western Russia and the Far East was quite enough; decentralized power was a luxury we never needed to crush 'revolutionary elements.' That was the soil from which our revolution was born.\n\nJoseph Stalin was not the protagonist of the revolution. Lenin, now passed, was the true architect who shattered Russian absolutism. Stalin had merely been a worker supporting the revolution like any other Central Committee comrade—a fundraiser for the Leninist faction. Could such a modest footprint truly matter? The Soviet state was forged through the cooperation of Lenin and Trotsky, while Zinoviev carved out his own expansive domain. Though elevated to General Secretary, his position was no different from a temporary caretaker regime.\n\nConspiracy is mandatory. Zinoviev, who babbles of permanent revolution despite the carnage in London and Paris, and Trotsky, who builds a state for his own glory rather than the people, must be eliminated. Should they provoke an unnecessary war, Russia and its people will be hurled into the slaughter.\n\nIt must be done because no one else has the stomach for it, and if we fail, millions shall perish. No further justification is required."
 soviet_rework_troika.019.a:0 "The lights in the Kremlin office burned throughout the night."
 soviet_rework_troika.020.t:0 "Zinoviev Ousted from Politics"
 soviet_rework_troika.020.d:0 "At today's party congress, Zinoviev was stripped of all posts and permanently expelled from the party, sealing his total exclusion from Soviet politics.\n\nHis followers were likewise purged from public life, with select members facing criminal tribunals. This marks the total annihilation of Zinoviev's faction and the definitive death of the Troika system."
 soviet_rework_troika.020.a:0 "Farewell."
 soviet_rework_troika.021.t:0 "Trotsky Ousted from Politics"
 soviet_rework_troika.021.d:0 "At today's party congress, Trotsky was stripped of all offices amidst a cascade of charges.\n\nHis militaristic dogma and criminal transgressions united the delegates in voting for his permanent expulsion, sweeping away his network of followers. The de facto collapse of the Troika leaves Stalin holding unchallenged authority in Soviet Russia."
 soviet_rework_troika.021.a:0 "He reaped what he sowed."
 soviet_rework_troika.022.t:0 "The Tale of Dmitry"
 soviet_rework_troika.022.d:0 "'Comrade Trotsky leads the people!'\nSo read the bold lettering on a massive propaganda poster depicting Trotsky as St. George on a white steed, trampling a venomous snake.\n\nDmitry, a private in the Soviet Western Army, had noticed these hagiographic posters multiplying rapidly across the barracks.\n\n\"What's this, another poster put up?\"\n\nDmitry turned to see his comrade-in-arms, Sergei, staring up at the wall.\n\n\"Seems like they're popping up everywhere lately.\"\n\nDmitry turned back to inspect the poster.\n\n\"Trotsky's a giant among men, though. Hard to find his equal in Russian history.\"\n\nSergei shrugged good-naturedly, throwing an arm around Dmitry's shoulders.\nAs he noted, the rank-and-file soldiers—if not the officers—largely adored Trotsky, feeling little aversion to the propaganda. Yet a lingering unease scratched at the back of Dmitry's mind.\n\n\"Anyway, I have laundry to fetch. See you later.\"\n\nWith that, Sergei trotted off.\n\nDmitry followed suit, shoving his vague misgivings deep into the back of his mind as he walked away."
 soviet_rework_troika.022.a:0 "Ah, it's nothing."
 soviet_rework_troika.023.t:0 "Trotsky Denounces Zinovievism"
 soviet_rework_troika.023.d:0 "At today's party congress, Trotsky launched a blistering assault on Zinovievism, dismissing international revolution as a pipe dream designed to swindle the masses. Zinoviev's loyalists shot back, branding Trotsky a militarist, but Trotsky's rhetorical dominance held firm, turning the assembly into an open tribunal against the Zinovievists."
 soviet_rework_troika.023.a:0 "Foolish Zinoviev."
 soviet_rework_troika.024.t:0 "The Greatest of Men"
 soviet_rework_troika.024.d:0 "Lev Trotsky—the military hero who, as Commissar of War, rebuilt the Red Army and rescued Soviet Russia from the brink of ruin.\nStaring at his reflection in the pane, that was the man he saw, gazing out over Moscow.\nKamenev's death had birthed the Troika—a triumvirate shared with Stalin and Zinoviev.\nYet joint rule was historically doomed to end in blood.\nWho should succeed them? Zinoviev was a hopelessly detached idealist who would plunge the Soviet into chaos, while Stalin was an opportunistic waverer unfit for Lenin's grand vision.\nWho else could it be? Trotsky believed none possessed the genius, the heroic stature, and the razor-sharp realism required save for himself.\nHow, then, to brush them aside and claim undisputed leadership?\n\nThe answer took little time to formulate."
 soviet_rework_troika.024.a:0 "\"One way or another, I shall sweep them from the Soviet.\""
 soviet_rework_troika.025.t:0 "Fierce Criticism of Stalin"
 soviet_rework_troika.025.d:0 "At this morning's party congress, Trotsky delivered a scathing critique of Stalin's character and methods, denouncing his habitual opportunism and ambiguity. Despite vocal protests from Stalinists, Trotsky's polished rhetoric effortlessly carried the day, swelling his political capital within the party."
 soviet_rework_troika.025.a:0 "So it is."
 soviet_rework_troika.026.t:0 "Arrest of the Zinovievists"
 soviet_rework_troika.026.d:0 "Mass arrests of Zinovievists swept Moscow this morning. Charged with high treason, their protests were swiftly crushed by state security forces. The Zinoviev faction has been entirely eradicated from the Troika, leaving only trials and sentencing."
 soviet_rework_troika.026.a:0 "The international revolutionaries are no more."
 soviet_rework_troika.027.t:0 "The Arrest of Stalin"
 soviet_rework_troika.027.d:0 "Scarcely days after Stalin's henchmen were ousted from parliament, security forces raided his Moscow residence last evening. Mirroring the fate of Zinoviev, Stalin was arrested for treason and collusion with anti-state elements. Though he vehemently denied the charges, the desired verdict was already preordained."
 soviet_rework_troika.027.a:0 "Trotsky has triumphed."
 soviet_rework_troika.028.t:0 "The Gang of Four"
 soviet_rework_troika.028.d_1:0 "Semyon Budyonny, Sergey Kamenev, Pavel Dybenko, and Mikhail Bonch-Bruyevich represent the loudest obstacles to our militaristic policies. Incompatible with Soviet ideals, they must be purged from the military preemptively to avoid future treachery."
 soviet_rework_troika.028.d_2:0 "Semyon Budyonny, Sergey Kamenev, Pavel Dybenko, and Mikhail Bonch-Bruyevich oppose militarism and favor permanent revolution. Though deviating from our centrist line, their presence will qualitatively elevate our armed forces."
 soviet_rework_troika.028.a:0 "Purge them."
 soviet_rework_troika.028.b:0 "Leave them be."
 soviet_rework_troika.032.t:0 "Beneath the Twilight of the Great Steppe"
 soviet_rework_troika.032.d:0 "The war was over. The war was over. Launched years prior under the banner of liberating all peoples from German oppression, the conflict had finally closed after claiming millions of lives.\n\nSharing in that ordeal, a soldier named Dmitry gazed out from a makeshift tent across the brilliant, golden-lit plains of Ukraine.\n\n\"Daydreaming again?\"\n\nDmitry looked up to see his unit comrade, Sergei.\n\n\"Not really.\"\n\nSergei slumped down onto the grass beside him.\n\n\"At last, this cursed war is over.\"\n\nSergei murmured with a faint smile.\n\n\"What does it matter, we're still stuck here handling postwar cleanup.\"\n\nDmitry grumbled.\n\n\"What? You haven't heard? We're heading home in two days!\"\n\nDmitry's eyes widened in sheer disbelief. Years had passed since he left his homeland, yet the endless exile was finally drawing to a close.\n\n\"Guess you hadn't heard the news, eh?\"\n\nSergei chuckled brightly.\n\n\"Soon we'll see our families, our homes again...\"\n\n\"Yes, we are finally going home.\"\n\nExchanging no further words, the two soldiers simply smiled as they watched the sun dip below the vast horizon."
 soviet_rework_troika.032.a:0 "Every story reaches its end."
 soviet_rework_troika.033.t:0 "Beneath the Snow-Covered Ural Factory"
 soviet_rework_troika.033.d:0 "\"The war is over!\"\n\nThose were the first words Ivan heard upon arriving at the factory floor. For an instant, profound silence gripped the interior, followed immediately by an eruption of ecstatic cheers from the workers.\n\n\"It's over! It's over!\"\n\nCheers, laughter, and tears of relief blended into a chaotic symphony. Rumors of peace had circulated, but with no fixed date, everyone had grown weary of the unending struggle, making the jubilation all the more intense.\n\nIvan closed his eyes, leaning his head back. It was finally over. Unlike the men dragged off to the front lines, his exemption due to fitness had landed him safely in a factory—a stroke of immense fortune.\nYet the toil had been relentless all the same.\nAnd now, even that chapter was closed.\n\n\"Ah...\"\n\nHe slumped heavily into his chair with a quiet groan, driven less by patriotic fervor like 'The Great Motherland triumphs!' than by the sheer, blissful relief of escaping a grueling existence."
 soviet_rework_troika.033.a:0 "And the factory propaganda banner that day read: 'Workers' Victory Day.'"
 soviet_rework_troika.034.t:0 "Speech by Comrade Tukhachevsky"
 soviet_rework_troika.034.d:0 "In the heart of Russia—the Moscow Council Chamber, supreme seat of Soviet power—thousands of delegates sat in hushed anticipation, every eye fixed upon a single man: Tukhachevsky. The man who shattered the Troika alongside Bukharin, and ultimately felled Bukharin himself to correct his ideological deviations.\nHis fiery gaze burned with relentless intensity. With the struggle against Germany freshly concluded, the delegates hung upon his every word as he called the assembly to order.\n\n\"Comrades and deputies of the Soviet!\"\n\nHis booming voice filled the hall.\n\n\"We have triumphed after a protracted struggle against the German bourgeoisie! Yet! This is by no means the end of our crusade. Across Europe and the Americas, predators still lurk in the shadows, waiting for a chance to tear down our system!\"\n\nTukhachevsky's gestures grew sharp with passion. Pausing to draw a deep breath, he pressed on:\n\n\"Here lies our eternal battle! The ultimate showdown with the bourgeois powers of France, America, and beyond! They plot our destruction, and we must maintain a colossal military and a mobilized economy to meet them. Until our revolution is fully realized, we shall continue to fight!\""
 soviet_rework_troika.034.a:0 "And the hall erupted in thunderous applause."
 soviet_rework_troika.035.t:0 "Proclamation of World Revolution"
 soviet_rework_troika.035.d:0 "Inside the Council Chamber, thousands of delegates sat assembled before the podium where Soviet Chairman Grigory Zinoviev stood.\n\n\"Comrades and deputies!\"\n\nZinoviev's call instantly commanded absolute silence.\n\n\"In the past, our revolution was confined to Russia alone, seemingly checked by the German bourgeoisie. Yet the Great Liberation War has proven otherwise. We have successfully revolutionized parts of Eastern and Central Europe, planting our communist creed in new soil. And vast swaths of the world still cry out for revolution.\"\n\nGlancing down briefly at his prepared text, Zinoviev continued:\n\n\"Our revolution does not halt here. Czechoslovakia, Slovakia, the Middle East, Africa... spreading the revolution to these lands is our inescapable duty and destiny. Comrades faithful to Marx, let us march forward and carry the revolution to completion!\""
 soviet_rework_troika.035.a:0 "Three cheers for the revolution!"
 soviet_rework_troika.036.t:0 "Forward, Ever Forward"
 soviet_rework_troika.036.d:0 "Moscow divides Russia into two: Moscow, and everywhere else. And the Kremlin divides Moscow: where power resides, and where it does not.\n\nBeneath the Kremlin's red star, Grigory Zinoviev drew breath. He remembered the exact moment he first stepped into this place—overwhelmed by triumph and sheer terror. The monumental power entrusted to him felt crushing. Every night spent locked in bitter political combat with Troika comrades and waging desperate war against Germany felt as grueling as the final days of Nicholas I.\n\nYet now he could declare with confidence that those days were past. Comrade Zinoviev—the man who restored Russia's ancient glory and dyed Prussia crimson. Who could dare challenge such a mythmaker? Any slander would instantly evaporate.\n\nRussian socialism had swelled into a second great flood, inundating Germany, Austria, and Eastern Europe. The victims of autocracy finally received their due.\n\n...He would not stop. Even if he wished to, the tide was unstoppable. Armed with the hammer and sickle, the masses rising from the shadows of colonial empires and capitalist states had begun their march. Zinoviev knew with absolute certainty: this armistice was not the end of the revolution.\n\nThe world revolution—the invisible war—had already begun."
 soviet_rework_troika.036.a:0 "Proletarians of all countries, unite!"
 soviet_rework_troika.037.t:0 "A Nation of One Man"
 soviet_rework_troika.037.d:0 "The Soviet has triumphed. The ultimate confrontation with the German bourgeoisie and European oppressors ended in the people's victory.\n\nDays prior, a grand victory parade was held in Moscow, reviewed by Mikhail Tukhachevsky, Chairman of the Revolutionary Military Council and Supreme Commander of the Red Army.\n\nTukhachevsky rose to prominence by siding with Bukharin to topple the Troika following Kamenev's death, before launching a coup against Bukharin himself. He champions uncompromising military buildup and perpetual confrontation with anti-communist states.\n\nHis worldview has locked the Soviet under rigid state control, sustaining a heavy industry-focused mobilization economy.\n\nThough praising the veterans of the war at the parade, he emphasized that while this war was won, perpetual threats demand continued readiness.\n\nGiven his proclivities, the Red Army shall continue expanding indefinitely, placing a heavy strain on the Soviet economy. For now, the populace bears the burden out of revolutionary zeal, but if prolonged indefinitely, the Soviet risks internal collapse."
 soviet_rework_troika.037.a:0 "If the flames consume all the kindling, what remains of the fire?"
 soviet_rework_troika.038.t:0 "Food Crisis"
 soviet_rework_troika.038.d:0 "The massive influx of refugees fleeing west of the Urals has severely worsened Siberia's already fragile food supply. Unsuited for heavy agriculture, the frozen Siberian soil threatens to turn this human wave into a catastrophe.\n\nSwift government action is urgently required, though whether a government fresh from a brutal defeat by Germany possesses the bandwidth to address it remains in grave doubt."
 soviet_rework_troika.038.a:0 "A grave crisis."
 soviet_rework_troika.039.t:0 "The Rationing System"
 soviet_rework_troika.039.d:0 "\"Ration time! Come collect your food!\"\n\nAt the communist guard's call, residents rushed out from their makeshift quarters. Despite the large crowd, the rations brought forth looked meager.\n\n\"How many in your household?\"\n\n\"Five of us, comrade.\"\n\n\"Here you go.\"\n\nThe guard doled out rations matching family size, yet even at a glance, the portions were pitiful—a handful of corn and a few pinches of flour.\n\n\"Wait, comrade, there are five of us. Five.\"\n\nThe man protested, assuming the guard misheard.\n\n\"That is for five people. Move aside, you're blocking the line!\"\n\n\"P-please, but...\"\n\n\"Take it or leave it, move!\"\n\nFacing the guard's sharp reprimand, the man retreated empty-handed, clutching his pathetic handful of grain."
 soviet_rework_troika.039.a:0 "At least it keeps body and soul together."
 soviet_rework_troika.040.t:0 "Speech in the Kremlin"
 soviet_rework_troika.040.d:0 "\"Glory to the great people, to the victorious people! Eternal glory to the heroes who sacrificed their lives for our freedom and happiness in the fight against the enemy!\"\n\nSurveying the cheering crowds across Red Square, Joseph Vissarionovich Stalin drew a hollow breath. Berlin, unable to endure further blows, had surrendered. Decades of Prussian imperialist ravaging in Western Russia had finally met their end.\n\nThe war was a bitter trial for the motherland, yet a unified Russia under socialism had endured. If not the strength of the people, to whom should the credit go? Joseph remembered his manifesto from days prior.\n\nMillions perished. In Kiev, Minsk, Warsaw, Krakow, Vilnius... Vienna, Prague, and Berlin. Every step forward exacted a heavy toll in blood.\n\nCountless fallen, nameless heroes, and missing soldiers remain unaccounted for. It will take decades to find them all. Yet the Kremlin must honor them properly. One day, a memorial for the fallen shall rise on Red Square.\n\nFor now, however, let the people enjoy the peace they earned. Having endured unbearable hardships, these weary, liberated souls still showered him with praise in Red Square. Hear this, comrades: all is finished!"
 soviet_rework_troika.040.a:0 "May this peace endure for a thousand years."
 soviet_rework_troika.041.t:0 "One Soviet, One People's Commissar"
 soviet_rework_troika.041.d:0 "In the spring of 1917, shortly after Kerensky's downfall, the Kremlin announced a pact with German militarism—a mistake Lev Davidovich Trotsky deeply regretted. Back then, he remained mired in idealism, insisting the war could only end via global workers' revolution.\n\nGermany showed no mercy. Within a month, Russia lost vast territories. Prussian militarism marched past Belarus and Ukraine toward Moscow. The Politburo hastily capitulated, fragmenting Russia into multiple states that languished ununited for over twenty years.\n\nWhen the second war erupted, the Kremlin panicked. Could we face the mighty Germans? Would the nightmare of Brest repeat itself? Lev seized power, deaf to their terrified cries—they were not worth listening to, nor indeed worth living.\n\nAnd now, 'our Comrade Trotsky' has crowned Russia the victor of Europe. Swallowed by the Red Army, the old authority of Berlin lies in ruins, striking fear into Western imperialists. All achieved by Comrade Trotsky.\n\nTrotsky—the Supreme People's Commissar. The master of state and military. What more could he desire?\n\nHe could scarcely answer, intoxicated as he was by planting the red banner in Berlin. Yet one absolute truth remained:\n\n...He now cast his gaze toward the West."
 soviet_rework_troika.041.a:0 "It is not yet over."
 soviet_rework_troika.042.t:0 "War and Peace"
 soviet_rework_troika.042.d:0 "Nikolai Ivanovich Bukharin understood war. Rising as Moscow's premier leader during the Petrograd revolution, he demanded unwavering resistance against Germany under the banner of world revolution—right up until the Treaty of Brest-Litovsk.\n\nRussia lost thirty percent of its territory. Nikolai felt utterly stripped of everything. Split into fragments like Poland, the Baltics, and Finland, duped by Western self-determination, the Soviets won the civil war yet lost the Great War.\n\nFrom that moment, Nikolai sharpened his blade of revenge. Whatever the cost or alliances required, Germany would be driven from Western Russia. Russia was unindustrialized; seizing power, Bukharin prioritized heavy industry above all. Steel alone could crush German industry. It demanded immense sacrifices, but he was proven right. Nikolai Bukharin was right.\n\nWar flared across Western Russia. Only when flames engulfed Germany and Austria did Nikolai realize: this time was different. Fate favored Mother Russia.\n\nThe armistice was signed. Germany was torn apart forever, and Austria shared its fate. All Slavic comrades were liberated from imperialist chains.\n\nMost importantly, Nikolai could finally piece together his shattered dreams. Twenty years of waiting to crush Germany. His country had paid him his due."
 soviet_rework_troika.042.a:0 "At last, he was free of the ghosts of the past."
 soviet_rework_troika.043.t:0 "A Ship Reaches Shore"
 soviet_rework_troika.043.d:0 "The Arctic port warehouses were scenes of frantic activity. Railways connecting all of Siberia served to cushion the sting of famine. People clamored for increased grain rations while scrambling to haul wheat from socialist comrades across the oceans.\n\nIn a three-story office building hung a placard: Cargo Manager, Igor Nikolayevich. For a decade in this post, he had never seen his workplace so frantic. People queued for days just to secure a laborer's ration.\n\nWhat forced Soviet Russia to become a land where everyone starves? Recklessness masquerading as war and vengeance destroyed Russia. Defeated and constantly driven back, watching Moscow's party comrades flee across the Urals, Igor felt profound helplessness.\n\nNot a communist, nor a White sympathizer, Igor never dreamed Russia would drive the Germans back.\n\nHe simply labored to bring food for his comrades, praying for the famine and chaos to subside."
 soviet_rework_troika.043.a:0 "He simply wished to see no more blood shed in the people's name."
 soviet_rework_troika.044.t:0 "The Siberian Tundra"
 soviet_rework_troika.044.d:0 "The war with Germany stripped Soviet Russia of everything. Countless refugees and officials fled to Siberia, a barren land with paltry industry. Commanders like Aleksandr Vasilevsky realized bitterly that from such a wasteland, they could never reclaim Russian soil.\n\nAll that remained was waiting like a half-dead corpse. Vasilevsky refused to accept it. Where had Russian glory gone? Driven into exile in Siberia after losing everything.\n\nHe and other commanders found their answer—or rather, manufactured one.\n\nEverything was [SOV.GetLeader]'s fault. He must take responsibility and fall."
 soviet_rework_troika.044.a:0 "Warranted or not, he must bear the blame."
 soviet_rework_troika.045.t:0 "Assassination of [SOV.GetLeader]"
 soviet_rework_troika.045.d:0 "Shocking news stunned the globe this morning: Soviet leader [SOV.GetLeader] was found dead in his office with a bullet wound to the forehead. Following catastrophic defeats against Germany, his approval plummeted, and he clung to power in Siberia via harsh austerity. Yet worsening food shortages and empty shelves pushed the populace—and the military leadership—over the edge. His violent end was an inevitability. Absolute chaos now awaits Siberia."
 soviet_rework_troika.045.a:0 "The Soviet experiment ends today."
 soviet_rework_troika.046.t:0 "Far Eastern Communications Cut"
 soviet_rework_troika.046.d:0 "Since yesterday evening, all communication with Far Eastern administrative and military posts has ceased entirely. Whatever unfolds there will be catastrophic."
 soviet_rework_troika.046.a:0 "What on earth is happening?"
 soviet_rework_troika.047.t:0 "Siberia Goes Silent"
 soviet_rework_troika.047.d:0 "All administrative and military communication across Siberia has vanished. Entire regions have plunged into anarchy beyond central government control, the bitter fruit of unheeded warning signs."
 soviet_rework_troika.047.a:0 "Why couldn't it be prevented?!"
 soviet_rework_troika.048.t:0 "Southern Siberia Goes Silent"
 soviet_rework_troika.048.d:0 "Following the north, southern Siberia has cut all contact. Soviet Russia is crumbling in real time, leaving us utterly helpless. The price of defeat is agonizingly bitter."
 soviet_rework_troika.048.a:0 "Find a way!"
 soviet_rework_troika.049.t:0 "Eastern Urals Silent"
 soviet_rework_troika.049.d:0 "Even the eastern Urals have gone dark. Controlling little beyond Omsk, our grand dreams of global hegemony lie in ruins. We can only watch helplessly."
 soviet_rework_troika.049.a:0 "Damn it!"
 soviet_rework_troika.050.t:0 "Independence of the Sakha Republic"
 soviet_rework_troika.050.d:0 "The Sakha Republic has proclaimed full independence from the Soviet. Led by Platon Oyunsky, minorities broke away to form their own government, entirely severing Soviet control."
 soviet_rework_troika.050.a:0 "These insolent wretches!"
 soviet_rework_troika.051.t:0 "Independence of Kamchatka and Chukotka"
 soviet_rework_troika.051.d:0 "Local Far Eastern warlords have seized Kamchatka and Chukotka, slipping entirely from central control. Soviet influence in the East is in freefall..."
 soviet_rework_troika.051.a:0 "Good Lord..."
 soviet_rework_troika.052.t:0 "Chukotka Independence and Japanese Occupation of Kamchatka"
 soviet_rework_troika.052.d:0 "Chukotka has broken free from central control, while Japanese forces have occupied Kamchatka. Our protests to Tokyo met total silence, signaling the total collapse of Soviet international prestige."
 soviet_rework_troika.052.a:0 "Good Lord..."
 soviet_rework_troika.053.t:0 "Loss of Outer Manchuria"
 soviet_rework_troika.053.d:0 "[III.GetName] has seized Outer Manchuria. Acquired from Qing China to fulfill Russia's dreams of warm-water ports, this vital strategic region is lost to us. Our national power fades."
 soviet_rework_troika.053.a:0 "This was never supposed to happen..."
 soviet_rework_troika.054.t:0 "The Betrayal of Vasily Blyukher"
 soviet_rework_troika.054.d:0 "Former Soviet General Vasily Blyukher has established a breakaway Far Eastern Special Army, denouncing the old Soviet government as corrupt and illegitimate. We are powerless to stop him."
 soviet_rework_troika.054.a:0 "Traitor!"
 soviet_rework_troika.055.t:0 "Committee for the Liberation of the Peoples of Russia"
 soviet_rework_troika.055.d:0 "General Andrei Vlasov proclaimed the creation of the Committee for the Liberation of the Peoples of Russia in Buryatia. Exhibiting centralized communist traits, Vlasov builds a personal dictatorship, erasing Soviet authority locally."
 soviet_rework_troika.055.a:0 "Betrayal runs rampant."
 soviet_rework_troika.056.t:0 "Kerensky Proclaims the Russian Republic"
 soviet_rework_troika.056.d:0 "Exiled in America since the Whites' defeat, Kerensky returned immediately upon the Soviet collapse. Today, he enacted his grand ambition, proclaiming the Russian Republic in Siberia and dragging Russia backward into the past."
 soviet_rework_troika.056.a:0 "With the state in peril, opportunists run amok."
 soviet_rework_troika.057.t:0 "Rokossovsky Secures Irkutsk"
 soviet_rework_troika.057.d:0 "General Rokossovsky has seized de facto control over Irkutsk. Though declaring no formal independence or defiance, Irkutsk is lost to our control, making him a king in all but name."
 soviet_rework_troika.057.a:0 "Russia splinters like China..."
 soviet_rework_troika.058.t:0 "Vasilevsky Dominates the Eastern Urals"
 soviet_rework_troika.058.d:0 "The eastern Urals have fallen to Vasilevsky. His Front Army seized the region under the pretext of crushing pro-German traitors. Though paying lip service to communism, he rules as a military dictator."
 soviet_rework_troika.058.a:0 "Communism in name only..."
 soviet_rework_troika.059.t:0 "Collapse of Soviet Russia"
 soviet_rework_troika.059.d:0 "Driven east of the Urals, the [SOV.GetName] lost its granaries and factories. Amidst popular outrage and bitter infighting, the regime collapsed. Today, the world's greatest social experiment ends.\n\nWarlords like Kerensky, Vasilevsky, and Rokossovsky carved up sovereignty, while Dybenko's coup birthed a new regime."
 soviet_rework_troika.059.a:0 "Marx's dream is dead."
 soviet_rework_troika.060.t:0 "Coup of Pavel Dybenko"
 soviet_rework_troika.060.d:0 "Following a prolonged death rattle, Pavel Dybenko launched a coup, proclaiming himself supreme leader of the Soviet under the banner of rebuilding the collapsed state. Omsk garrison forces fled without a fight. Whether he can truly rebuild the Soviet remains to be seen."
 soviet_rework_troika.060.a:0 "Highly doubtful..."
 soviet_rework_troika.061.t:0 "Miraculous Survival"
 soviet_rework_troika.061.d:0 "A miracle occurred. Thanks to France and its allies collapsing Germany, we successfully recovered our pre-war borders. The Soviet has survived."
 soviet_rework_troika.061.a:0 "A miracle!"
 soviet_rework_troika.062.t:0 "A Grave Problem"
 soviet_rework_troika.062.d:0 "The Supreme Soviet debated a pressing crisis: defense expenditures are bleeding the national economy dry to maintain an oversized army against capitalist powers. Driven by Tukhachevsky's iron will, this policy threatens to bankrupt the Soviet."
 soviet_rework_troika.062.a:0 "It must be resolved."
 soviet_rework_troika.063.t:0 "The Marshal's Solution"
 soviet_rework_troika.063.d:0 "Tukhachevsky wrestled with the crushing financial burden of maintaining a bloated military.\n\nWhile essential for defense against imperialists, such an arrangement threatened to uproot the Soviet state.\n\nResolving the crisis, he struck upon a solution: war. If the army was expanded to face enemies, we should simply eliminate the root cause ourselves. Before the economy collapses, strike first. Resolving thus, he stepped from his office."
 soviet_rework_troika.063.a:0 "We must act swiftly."
 soviet_rework_troika.064.t:0 "Final Victory Over European Capitalism"
 soviet_rework_troika.064.d:0 "European capitalism lies crushed beneath our boots. All Soviet citizens are liberated from the nightmare of capitalist destruction.\n\nGathered under Red Square, Tukhachevsky and his revolutionary comrades celebrated this monumental day.\n\nSpanning from the October Revolution across Russia, Eastern Europe, Germany, and finally France and Britain, European threats are extinguished. Yet the struggle continues; until Asia and America are subdued, demobilization is impossible. So long as the United States stands, the threat remains.\n\nOur struggle is far from over."
 soviet_rework_troika.064.a:0 "Not yet finished."
 soviet_rework_troika.065.t:0 "A Successful Rebellion"
 soviet_rework_troika.065.d:0 "...'We have ripped off the masked pretense! Bukharin's compromises end today! This revolution's heart shall beat in steel once more!'\n\n'...Bullshit.'\n\nHe whispered alone in his office, shadows pressing down upon his shoulders.\nExpecting Bukharin's men to burst in at any moment shouting treason, he sat slumped like a broken criminal.\n\nThe telephone remained silent.\n\nOpening his desk drawer, he retrieved an old Order of St. Vladimir—a tsarist symbol mocked by the revolution, yet the root of his existence. He stroked the medal gently.\n\n\"...If this is madness, I shall pay in blood. But please, let it not be in vain. Damn it all. If only that bastard Bukharin had listened...\"\n\nThe phone rang. Trembling, he lifted the receiver.\n\n\"Success, comrade. The Kremlin is secured. Bukharin escaped, but the Council has unanimously approved your decree—\"\n\nSilence followed, broken by hollow, echoing laughter akin to a condemned man's reprieve. Tears streamed down his cheeks."
 soviet_rework_troika.065.a:0 "The revolution lived, and so did he."
 soviet_rework_troika.066.t:0 "The Dream of Treason"
 soviet_rework_troika.066.d:0 "'Comrade Tukhachevsky, your contributions are undeniable. However, the revolutionary army cannot tremble beneath a single man's name.'\n\n\"Son of a bitch.\" Tukhachevsky tore the letter to shreds. Only then did he begin to think.\n\nWhat did that bastard want? Bukharin's goals aligned with his; Tukhachevsky even preferred a hardline Bukharin. He wanted war, eager to hurl all revolutionary enemies into hell. Why cast him aside? Because both harbored identical, absolute ambitions—to hold total power alone.\n\nRealizing this, Tukhachevsky felt greater shame not at being betrayed, but at realizing he and Bukharin thought alike. Grabbing the phone, he prepared to fight for survival."
 soviet_rework_troika.066.a:0 "It is me, Tukhachevsky. Summon the division commanders."
 soviet_rework_troika.067.t:0 "Unidentified"
 soviet_rework_troika.067.d:0 "\"...Bukharin, whereabouts unknown.\"\n\nA heavy sentence closed the report.\n\nHe gazed out the window at the bustling city below. Did Bukharin's shadow linger among the crowd?\n\nTukhachevsky altered the report's conclusion from 'Operation to Continue' to 'Operation Terminated.' Leaning against the window frame:\n\nIf you live, say nothing. Remain a nameless face. If you are dead, rest in peace—my privilege as victor.\n\nLighting a cigarette, he whispered:\n\n\"I know you, and you know me. Watch me burn all our enemies to ash, in this world or the next.\""
 soviet_rework_troika.067.a:0 "He left the window open."
 soviet_rework_troika.068.t:0 "Dispute"
 soviet_rework_troika.068.d:0 "Two men sat in a room: Dmitry Shostakovich, pale and quiet, and Mikhail Tukhachevsky, his eyes burning with paranoid fury.\n\n\"Dmitri,\" Tukhachevsky began, \"the imperialists are a fate met with gunfire and flame.\"\n\n\"But,\" Shostakovich replied coldly, \"your future is a concerto played in blood, bringing comfort to no one!\"\n\n\"Comfort? We do not fight for comfort. We must destroy everything to survive!\"\n\nShostakovich remained silent. \"Who are you surviving from?\"\n\n\"Those damned imperialists plotting to tear our republic apart!\"\n\nTukhachevsky exploded. \"Get out! How dare a mere musician mock my ideology? I am the Supreme Leader, Marshal of the Red Army, the thunder god of socialism!\"\n\nShostakovich stood in silence, turning away with a final, quiet exit. Click. The door closed like an era ending."
 soviet_rework_troika.068.a:0 "Tukhachevsky parted his lips, but no words came."
 soviet_rework_troika.069.t:0 "The Great Liberation War"
 soviet_rework_troika.069.d:0 "— 'Arise, O vast country,\nArise for the mortal fight!'\n\n\"Splendid!\" Tukhachevsky clapped. \"Who wrote these lyrics?\"\n\n\"This comrade, sir.\" Vasily Lebedev-Kumach stepped forward nervously.\n\n\"Nothing special,\" Lebedev-Kumach muttered. Tukhachevsky laughed heartily. \"Then what does that make me, a nobleman who can't write verse? Just joking. I remember Shostakovich...\" He wondered what his old friend would think of this war song, though they had parted ways.\n\n\"Marshal?\" Lebedev-Kumach's voice pulled him back."
 soviet_rework_troika.069.a:0 "...Where were we?"
 soviet_rework_troika.070.t:0 "Reunion"
 soviet_rework_troika.070.d:0 "Evening light spilled across gray marble as footsteps approached Shostakovich at the piano.\n\n\"Dmitri.\"\n\nShostakovich did not look up.\n\n\"You were wrong.\"\n\nTukhachevsky smiled faintly. \"The fact that I am here—not before a tribunal in Berlin—proves I was right.\"\n\nShostakovich played a low, discordant chord—a warning and a lament.\n\n\"The war is over, Mikhail.\"\n\n\"The end is just a beginning. Now for the final movement.\"\n\nShostakovich stopped playing. \"If you write the final movement, I shall play no more.\"\n\nTukhachevsky nodded calmly. \"I expected as much. That is why you remain here. Operation Thunder God approaches—the final strike against our last enemy. Endless music, unending battle. Is that not fitting?\"\n\nShostakovich turned his head away.\n\n\"This is my score,\" Tukhachevsky whispered, opening the door."
 soviet_rework_troika.070.a:0 "Who shall play it, time alone will decide."
 soviet_rework_troika.071.t:0 "A Soldier"
 soviet_rework_troika.071.d:0 "At the Kazan engineer depot, welding sparks showered down as blocks of iron transformed into KV-1 tanks. Artyom worked with oil-stained hands when an old man in a ragged coat approached the fence.\n\n\"No clearance here, comrade—\"\n\nThe old man smiled, revealing old medals pinned to his coat. \"I saw this country born in blood, fought in the trenches, crawled beneath White cavalry.\"\n\nStaring at the KV-1, his eyes clouded. \"If we had beasts of steel like this back then... maybe the Germans wouldn't have choked the revolution.\"\n\nArtyom nodded firmly. \"This time is different, comrade. We have tanks and factories. We will win.\"\n\nThe old man nodded slowly."
 soviet_rework_troika.071.a:0 "We march across the steppe."
 soviet_rework_troika.072.t:0 "An Old Soldier's Tale"
 soviet_rework_troika.072.d:0 "Tukhachevsky stood in the square as an elderly veteran approached, his cane clicking against the pavement. \"I was an enemy of the Red Banner... your enemy, Marshal.\"\n\nTukhachevsky extended a hardened hand. \"War teaches us one thing: sides do not matter, who stands beside you now does. Do not be ashamed. The past does not drag us.\"\n\nReporters snapped photos of the staged handshake. The veteran whispered, \"I hope your words were sincere, Marshal.\""
 soviet_rework_troika.072.a:0 "Tukhachevsky gave no reply."
 soviet_rework_troika.073.t:0 "The Soviet Party Congress"
 soviet_rework_troika.073.d:0 "Kamenev's sudden passing fractured party stability, creating a severe political vacuum. The Central Committee convened the Congress to determine a successor.\n\nFactions led by Stalin, Trotsky, Zinoviev, and Bukharin scrambled for dominance. This congress marks a decisive crossroads for economic, military, and national policies."
 soviet_rework_troika.073.a:0 "The game has begun."
 soviet_rework_troika.074.t:0 "Clash with the Workers' Opposition"
 soviet_rework_troika.074.d:0 "Capitalizing on the power vacuum, Nikolai Bukharin expanded his influence, denouncing the NEP as a bourgeois compromise that sacrifices workers for peasants.\n\nStalin viewed this as an attack on bureaucracy, while Trotsky saw a clash with military doctrine. The Central Committee must decide whether to absorb or crush this radical faction."
 soviet_rework_troika.074.a:0 "A grave threat."
 soviet_rework_troika.075.t:0 "Formation of the Troika"
 soviet_rework_troika.075.d:0 "After intense negotiations, Stalin, Trotsky, and Zinoviev formed a fragile collective leadership—the Troika—to counter Bukharin. While Trotsky commanded the army, Zinoviev led the Comintern, and Stalin controlled the party apparatus.\n\nThis coalition was a balance of necessity, marking a dangerous new phase in Soviet politics."
 soviet_rework_troika.075.a:0 "The Soviet's fate is sealed."
 soviet_rework_troika.076.t:0 "The Future of Germany"
 soviet_rework_troika.076.d:0 "With Berlin in ruins, the Soviet Army controls eastern Germany. We must decide its fate: establish a communist government to spread revolution, or maintain military administration until stability is restored."
 soviet_rework_troika.076.a:0 "Establish a communist government in Germany."
 soviet_rework_troika.076.b:0 "Maintain military administration."

 soviet_rework_revolution.1.t:0 "Communist Uprising"
 soviet_rework_revolution.1.d:0 "Bolstered by surging popularity, communists have launched an armed rebellion against the government, heavily backed by Soviet Russia."
 soviet_rework_revolution.1.a:0 "Crush them!"
 soviet_rework_revolution.2.t:0 "Fallen Government"
 soviet_rework_revolution.2.d:0 "Overwhelmed by public support for communism and military defections, our government has fallen."
 soviet_rework_revolution.2.a:0 "Damn it!"

 soviet_rework_white.001.t:0 "Creation of the League of All-Russian Liberation"
 soviet_rework_white.001.d:0 "In Berlin, backed by Germany, the League of All-Russian Liberation was founded to liberate Russians from Bolshevik tyranny. Soviet leader [SOV.GetLeader] denounced them as mere German puppets."
 soviet_rework_white.001.a:0 "A minor, insignificant group."
 soviet_rework_white.001.b:0 "For the liberation of Russia!"
 soviet_rework_white.002.t:0 "League's Request for Aid"
 soviet_rework_white.002.d:0 "The League has requested rifles, artillery, and equipment to fight the Soviets, which will draw from our own military stockpiles."
 soviet_rework_white.002.a:0 "Provide support."
 soviet_rework_white.002.b:0 "Doubtful they will fight well."
 soviet_rework_white.003.t:0 "Germany Agrees to Support Us"
 soviet_rework_white.003.d:0 "Germany agreed to supply 800 rifles, 100 artillery pieces, and support equipment."
 soviet_rework_white.003.a:0 "Excellent."
 soviet_rework_white.004.t:0 "Germany Rejects Our Request"
 soviet_rework_white.004.d:0 "Germany refused aid, leaving us to fight with scarce supplies..."
 soviet_rework_white.004.a:0 "Incomprehensible."
 soviet_rework_white.005.t:0 "Communist Unrest"
 soviet_rework_white.005.d:0 "Communist riots damaged urban factories, proving subversives remain active. Thorough purges are required."
 soviet_rework_white.005.a:0 "Round them all up!"
 soviet_rework_white.006.t:0 "A Bargain with the Devil"
 soviet_rework_white.006.d:0 "In smoke-filled Brest-Litovsk, German envoys met with Arkhangelsky's White emissaries. Germany offered weapons and advisors to crush Bolshevism in exchange for ceding Ukraine, Belarus, and the Baltics to the Reich. Accepting meant humiliation for victory; refusing meant fighting alone."
 soviet_rework_white.006.a:0 "A bitter pill to swallow."
 soviet_rework_white.007.t:0 "German Influence Too Low"
 soviet_rework_white.007.d:0 "Russian internal German influence has dropped dangerously low. We must pressure them back into line."
 soviet_rework_white.007.a:0 "Exert pressure."
 soviet_rework_white.008.t:0 "Strong German Pressure"
 soviet_rework_white.008.d:0 "Demanding increased influence, Berlin threatens war if we refuse."
 soviet_rework_white.008.a:0 "We have no choice..."
 soviet_rework_white.008.b:0 "We do not care."
 soviet_rework_white.009.t:0 "Russia Submits to Pressure"
 soviet_rework_white.009.d:0 "Russia capitulated, securing our dominant influence across the East."
 soviet_rework_white.009.a:0 "Splendid."
 soviet_rework_white.010.t:0 "Russia Resists Pressure"
 soviet_rework_white.010.d:0 "Russia flatly rejected our demands, choosing war."
 soviet_rework_white.010.a:0 "Crush them utterly!"
 soviet_rework_white.011.t:0 "Political Advisory Group Established"
 soviet_rework_white.011.d:0 "Military advisors withdrew, replaced by a German Political Advisory Group to oversee Russian stability—effectively a tool for political meddling."
 soviet_rework_white.011.a:0 "Understood."
 soviet_rework_white.012.t:0 "Movement of the Russian Free Army"
 soviet_rework_white.012.d:0 "Anton Denikin's Russian Free Army is agitating to overthrow the government, denouncing it as a German colony."
 soviet_rework_white.012.a:0 "Subversive elements."
 soviet_rework_white.013.t:0 "Suspicious Activity in Petrograd"
 soviet_rework_white.013.d:0 "Arms smuggling linked to Denikin detected in Petrograd. We must strike before his influence spreads."
 soviet_rework_white.013.a:0 "Wait for them to gather, then raid."
 soviet_rework_white.013.b:0 "Strike immediately."
 soviet_rework_white.014.t:0 "Denikin's Men Arrested"
 soviet_rework_white.014.d:0 "Our raid successfully captured Denikin's key operatives in Petrograd."
 soviet_rework_white.014.a:0 "Good."
 soviet_rework_white.015.t:0 "Operation Fails"
 soviet_rework_white.015.d:0 "Our raid was mistimed, capturing only low-level cadres while leaders escaped."
 soviet_rework_white.015.a:0 "Damn it."
 soviet_rework_white.016.t:0 "Rebels Cross the Urals"
 soviet_rework_white.016.d:0 "Armed insurgents crossed the Urals toward Kazan."
 soviet_rework_white.016.a:0 "Dispatch troops immediately."
 soviet_rework_white.016.b:0 "Let border guards handle them."
 soviet_rework_white.017.t:0 "Rebels Subdued"
 soviet_rework_white.017.d:0 "Our forces successfully crushed Denikin's rebels."
 soviet_rework_white.017.a:0 "Good."
 soviet_rework_white.018.t:0 "Rebels Escape"
 soviet_rework_white.018.d:0 "Border guards were overwhelmed by rebel firepower."
 soviet_rework_white.018.a:0 "Damn it."
 soviet_rework_white.019.t:0 "Intelligence on Denikin"
 soviet_rework_white.019.d:0 "Intelligence reports a potential hideout for Denikin. It could be a trap."
 soviet_rework_white.019.a:0 "A trap. Ignore it."
 soviet_rework_white.019.b:0 "Raid the hideout."
 soviet_rework_white.020.t:0 "Fell into a Trap"
 soviet_rework_white.020.d:0 "Special forces walked into a booby-trapped ambush. Denikin was not there."
 soviet_rework_white.020.a:0 "Fuck."
 soviet_rework_white.021.t:0 "A Trap for Denikin"
 soviet_rework_white.021.d:0 "We can either feed false info to lure them out, or bribe insiders for intelligence."
 soviet_rework_white.021.a:0 "Feed false information."
 soviet_rework_white.021.b:0 "Bribe insiders."
 soviet_rework_white.022.t:0 "Operation Successful"
 soviet_rework_white.022.d:0 "Disinformation successfully lured key rebels into a trap, capturing them."
 soviet_rework_white.022.a:0 "Excellent."
 soviet_rework_white.023.t:0 "Operation Failed"
 soviet_rework_white.023.d:0 "Infiltration attempts were uncovered, compromising our assets."
 soviet_rework_white.023.a:0 "Damn it."
 soviet_rework_white.024.t:0 "Cooperation with Royalists"
 soviet_rework_white.024.d:0 "Exiled royalists have returned. Allied with them against Denikin?"
 soviet_rework_white.024.a:0 "Let us cooperate."
 soviet_rework_white.024.b:0 "Why bother?"
 soviet_rework_white.025.t:0 "Uncovering Spies"
 soviet_rework_white.025.d:0 "Spies leaking data to Denikin lurk within our government."
 soviet_rework_white.025.a:0 "Monitor suspects closely."
 soviet_rework_white.025.b:0 "Set a trap."
 soviet_rework_white.026.t:0 "Spies Apprehended"
 soviet_rework_white.026.d:0 "Surveillance successfully rooted out Denikin's moles."
 soviet_rework_white.026.a:0 "Good."
 soviet_rework_white.027.t:0 "Failed to Catch Spies"
 soviet_rework_white.027.d:0 "Spies evaded our traps, and leaks continue."
 soviet_rework_white.027.a:0 "Damn it."
 soviet_rework_white.028.t:0 "Battle of Influence"
 soviet_rework_white.028.d:0 "Denikin paints us as German dogs. We must counter his propaganda."
 soviet_rework_white.028.a:0 "Remind them we ended Bolshevik tyranny."
 soviet_rework_white.028.b:0 "Emphasize Germany as a friend."
 soviet_rework_white.029.t:0 "Public Opinion Swings Our Way"
 soviet_rework_white.029.d:0 "Our anti-Bolshevik narrative resonated, winning public favor."
 soviet_rework_white.029.a:0 "Very good."
 soviet_rework_white.030.t:0 "Public Opinion Turns"
 soviet_rework_white.030.d:0 "Denikin's propaganda succeeded, branding us pro-German traitors."
 soviet_rework_white.030.a:0 "No!"
 soviet_rework_white.031.t:0 "Denikin's Coup"
 soviet_rework_white.031.d:0 "Denikin launched a coup in Moscow, clashing with Arkhangelsky's forces."
 soviet_rework_white.031.a:0 "Denikin fell in battle and his faction shattered."
 soviet_rework_white.031.b:0 "Arkhangelsky fell, and Denikin entered the Kremlin."
 soviet_rework_white.032.t:0 "German Influence Excessive"
 soviet_rework_white.032.d:0 "Failed to curb German influence, reducing our economy to servitude."
 soviet_rework_white.032.a:0 "This was not our intent..."
 soviet_rework_white.033.t:0 "German Influence Moderated"
 soviet_rework_white.033.d:0 "German pressure has stabilized to a manageable level."
 soviet_rework_white.033.a:0 "A relief."
 soviet_rework_white.034.t:0 "Anti-Government Ban"
 soviet_rework_white.034.d:0 "President Arkhangelsky outlawed anti-government actions, purging dissidents and consolidating absolute power."
 soviet_rework_white.034.a:0 "Is this truly right?"
 soviet_rework_white.035.t:0 "Public Sentiment"
 soviet_rework_white.035.d:0 "Anti-German sentiment threatens our regime's survival.\n\n§RIf national stability drops below 15%, you will suffer severe debuffs.§!"
 soviet_rework_white.035.a:0 "Action is required."
 soviet_rework_white.036.t:0 "Russia in Turmoil"
 soviet_rework_white.036.d:0 "Nationwide strikes paralyze the pro-German government. Total collapse looms."
 soviet_rework_white.036.a:0 "This is disaster!"
 soviet_rework_white.037.t:0 "Cooperation with Germany"
 soviet_rework_white.037.d:0 "We must select one sector for continued cooperation with Germany."
 soviet_rework_white.037.a:0 "Military."
 soviet_rework_white.037.b:0 "Economy."
 soviet_rework_white.037.c:0 "Science."
 soviet_rework_white.038.t:0 "[RUS.GetName] Requests Military Cooperation"
 soviet_rework_white.038.d:0 "Russia seeks continued military ties, expanding our influence."
 soviet_rework_white.038.a:0 "Agreed."
 soviet_rework_white.038.b:0 "Rejected."
 soviet_rework_white.039.t:0 "[RUS.GetName] Requests Economic Cooperation"
 soviet_rework_white.039.d:0 "Russia seeks continued economic ties, expanding our influence."
 soviet_rework_white.039.a:0 "Agreed."
 soviet_rework_white.039.b:0 "Rejected."
 soviet_rework_white.040.t:0 "[RUS.GetName] Requests Scientific Cooperation"
 soviet_rework_white.040.d:0 "Russia seeks continued scientific ties, expanding our influence."
 soviet_rework_white.040.a:0 "Agreed."
 soviet_rework_white.040.b:0 "Rejected."
 soviet_rework_white.041.t:0 "Germany Agrees to Cooperate"
 soviet_rework_white.041.d:0 "Berlin agreed to continue cooperation, increasing our influence slightly."
 soviet_rework_white.041.a:0 "Good."
 soviet_rework_white.042.t:0 "Germany Refuses Cooperation"
 soviet_rework_white.042.d:0 "Berlin declined further cooperation."
 soviet_rework_white.042.a:0 "Unacceptable."
 soviet_rework_white.043.t:0 "Influence of the Royalists"
 soviet_rework_white.043.d:0 "Royalists aiming to crown Vladimir Kirillovich threaten our political dominance."
 soviet_rework_white.043.a:0 "Traitors."
 soviet_rework_white.044.t:0 "Royalist Maneuvers"
 soviet_rework_white.044.d:0 "Royalists debated between constitutional and absolute monarchy."
 soviet_rework_white.044.a:0 "Constitutional Monarchy."
 soviet_rework_white.044.b:0 "Absolute Monarchy."
 soviet_rework_white.045.t:0 "Royalist Influence Rises"
 soviet_rework_white.045.d:0 "Adopting constitutional monarchy won over centrists, boosting royalist clout."
 soviet_rework_white.045.a:0 "Constitutional monarchy is fine."
 soviet_rework_white.046.t:0 "Royalist Influence Falls"
 soviet_rework_white.046.d:0 "Opting for despotism alienated centrists, driving them to Arkhangelsky."
 soviet_rework_white.046.a:0 "Despotism has its merits!"
 soviet_rework_white.047.t:0 "Arkhangelsky Faction Moves"
 soviet_rework_white.047.d:0 "We must choose our angle of political attack against the royalists."
 soviet_rework_white.047.a:0 "Attack their reactionary nature."
 soviet_rework_white.047.b:0 "Attack the legitimacy of their royal candidate."
 soviet_rework_white.048.t:0 "Arkhangelsky Influence Rises"
 soviet_rework_white.048.d:0 "Attacking royalist backwardness successfully alienated them from the public."
 soviet_rework_white.048.a:0 "Naturally."
 soviet_rework_white.049.t:0 "Arkhangelsky Influence Falls"
 soviet_rework_white.049.d:0 "Our attacks failed, casting us as petty opportunists."
 soviet_rework_white.049.a:0 "Damn it."
 soviet_rework_white.050.t:0 "Royalist Maneuvers"
 soviet_rework_white.050.d:0 "Royalists weigh how to appease republicans."
 soviet_rework_white.050.a:0 "Ideological debate."
 soviet_rework_white.050.b:0 "Bribery."
 soviet_rework_white.051.t:0 "Royalist Influence Falls"
 soviet_rework_white.051.d:0 "Ideological debates bogged down, alienating republicans further."
 soviet_rework_white.051.a:0 "We should not have bothered..."
 soviet_rework_white.052.t:0 "Royalist Influence Rises"
 soviet_rework_white.052.d:0 "Generous bribery successfully bought off republican figures."
 soviet_rework_white.052.a:0 "Pragmatic."
 soviet_rework_white.053.t:0 "Arkhangelsky Faction Moves"
 soviet_rework_white.053.d:0 "We must consolidate our faction or court centrists."
 soviet_rework_white.053.a:0 "Solidify existing ranks."
 soviet_rework_white.053.b:0 "Court centrists."
 soviet_rework_white.054.t:0 "Arkhangelsky Influence Falls"
 soviet_rework_white.054.d:0 "Consolidating ranks proved ineffective while royalists poached centrists."
 soviet_rework_white.054.a:0 "No!"
 soviet_rework_white.055.t:0 "Arkhangelsky Influence Rises"
 soviet_rework_white.055.d:0 "Aggressively courting centrists heavily bolstered our political clout."
 soviet_rework_white.055.a:0 "Splendid."
 soviet_rework_white.056.t:0 "End of the Political Struggle"
 soviet_rework_white.056.d:0 "The grueling power struggle between Arkhangelsky and the royalists has reached its climax. The victor is..."
 soviet_rework_white.056.a:0 "The Royalists triumph."
 soviet_rework_white.056.b:0 "Arkhangelsky triumphs."
 soviet_rework_white.057.t:0 "Purge the Royalists"
 soviet_rework_white.057.d:0 "Massive purges executed royalist leaders, excluding Grand Duke Vladimir Kirillovich who fled to America."
 soviet_rework_white.057.a:0 "Farewell."
 soviet_rework_white.058.t:0 "Diplomatic Mission to Germany"
 soviet_rework_white.058.d:0 "Our delegation visited Berlin to assure continued cooperation, greeted by German banquets."
 soviet_rework_white.058.a:0 "Whatever."
 soviet_rework_white.059.t:0 "The Trial"
 soviet_rework_white.059.d:0 "Convicted of treason, war hero Arkhangelsky was sentenced to life imprisonment. The royalist era begins."
 soviet_rework_white.059.a:0 "Such is his fate."
 soviet_rework_white.060.t:0 "Return of the General"
 soviet_rework_white.060.d:0 "For two decades, Russia languished under German hegemony. Yet Anton Denikin has risen, overthrowing puppet rulers in a stunning coup. Berlin seethes, but the Russian eagle flies once more."
 soviet_rework_white.060.a:0 "Steel is forged in fire."
 soviet_rework_white.061.t:0 "Russia Declares Independence"
 soviet_rework_white.061.d:0 "Denikin overthrew Arkhangelsky and proclaimed immediate independence, severing all ties with Germany."
 soviet_rework_white.061.a:0 "Long live Russia."
 soviet_rework_white.061.b:0 "Prepare for invasion."
 soviet_rework_white.061.c:0 "Good luck."
 soviet_rework_white.062.t:0 "The German Ultimatum"
 soviet_rework_white.062.d:0 "Berlin issued an ultimatum demanding military observers, censorship, and the disbandment of anti-German groups."
 soviet_rework_white.062.a:0 "'NO.'"
 soviet_rework_white.063.t:0 "Russia Ignores Ultimatum"
 soviet_rework_white.063.d:0 "Russia rejected our ultimatum with a single word: 'No.' War is inevitable."
 soviet_rework_white.063.a:0 "Launch the invasion."
 soviet_rework_white.063.b:0 "No more blood for this."
 soviet_rework_white.064.t:0 "Germany Acquiesces"
 soviet_rework_white.064.d:0 "Heavily scarred from past wars, Germany tacitly accepted our independence."
 soviet_rework_white.064.a:0 "URRAH!"
 soviet_rework_white.065.t:0 "End of the German-Russian War"
 soviet_rework_white.065.d:0 "Unable to break Russian resistance, Germany declared an end to hostilities. Russian sovereignty is restored."
 soviet_rework_white.065.a:0 "Hard to believe."
 soviet_rework_white.066.t:0 "Denikin's Retirement"
 soviet_rework_white.066.d:0 "Victorious yet aged, Denikin retires, naming his successor."
 soviet_rework_white.066.a:0 "Zinovy Peshkov."
 soviet_rework_white.066.b:0 "Viktor Chernov."
 soviet_rework_white.067.t:0 "Russian General Elections"
 soviet_rework_white.067.d:0 "General elections swept the Socialist-Revolutionary Party to victory, reflecting left-leaning sentiments born of Bolshevik rule."
 soviet_rework_white.067.a:0 "Democratic Russia..."
 soviet_rework_white.068.t:0 "Trial of Left SR Leaders"
 soviet_rework_white.068.d:0 "Collaborating Left SR leaders received heavy sentences, with Maria Spiridonova sentenced to life imprisonment."
 soviet_rework_white.068.a:0 "The Right SRs emerge victorious."
 soviet_rework_white.069.t:0 "Total Triumph of Democracy"
 soviet_rework_white.069.d:0 "Having cast off Tsarist, Bolshevik, and pro-German tyrannies, Russia has embarked on a democratic path."
 soviet_rework_white.069.a:0 "A single ember sets the plains ablaze."
 soviet_rework_white.070.t:0 "Purge Pro-German Factions"
 soviet_rework_white.070.d:0 "Peshkov purged top pro-German collaborators linked to Arkhangelsky, though many escaped justice."
 soviet_rework_white.070.a:0 "Too many to execute them all..."
 soviet_rework_white.071.t:0 "New Russian Government"
 soviet_rework_white.071.d:0 "A new government formed of Denikin's loyal generals took power, continuing authoritarian traditions under a new guise."
 soviet_rework_white.071.a:0 "Merely new dictators."
 soviet_rework_white.072.t:0 "The Weary Man"
 soviet_rework_white.072.d:0 "Alexei Petrovich Arkhangelsky, having fought Reds and built an iron authority, gazed across Moscow, yearning simply for peace."
 soviet_rework_white.072.a:0 "Time to rest at last."
 soviet_rework_white.073.t:0 "Smashing the Hammer and Sickle"
 soviet_rework_white.073.d:0 "With Bolshevik atrocities buried, Kirillovich removed the Kremlin star, restoring the Russian Empire's glory."
 soviet_rework_white.073.a:0 "And someday..."
 soviet_rework_white.074.t:0 "For the Motherland"
 soviet_rework_white.074.d:0 "Zinovy Peshkov, having fought in foreign legions and aided Denikin, steps up. The military rules for Zinovy, and Zinovy rules for Russia."
 soviet_rework_white.074.a:0 "For Russia."
 soviet_rework_troika.077.t:0 "Blyukher's Advance into Mongolia"
 soviet_rework_troika.077.d:0 "Without authorization, Marshal Vasily Blyukher led Soviet troops across the Mongolian border, claiming it a necessary step to spread the revolution."
 soviet_rework_troika.077.a:0 "Has he lost his mind?"
 soviet_rework_troika.078.t:0 "Soviet Far Eastern Army Intervention in Mongolia"
 soviet_rework_troika.078.d:0 "Clashes erupted as Blyukher's unauthorized forces crossed into Mongolia, alarming foreign powers."
 soviet_rework_troika.078.a:0 "Tensions escalate."