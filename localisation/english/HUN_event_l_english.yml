l_english:
 hungary.1.t:0 "German Request for Alliance"
 hungary.1.d:0 "Germany wishes to form an alliance with Hungary. No one can say how this decision will shape Hungary's future."
 hungary.1.a:0 "A good idea."
 hungary.1.b:0 "No, we have no need for them."
 hungary.2.t:0 "German Demands for Burgenland and Slovak Independence"
 hungary.2.d:0 "The German government delivered an ultimatum to the Hungarian government yesterday evening, demanding the independence of Slovakia and the cession of Burgenland. Failure to comply with these demands may result in an attack by German forces."
 hungary.2.a:0 "There is nothing we can do..."
 hungary.2.b:0 "Tell them to go to hell."
 hungary.3.t:0 "Germany Demands Puppet Status!"
 hungary.3.d:0 "Germany informed us yesterday in a stern tone that we will face severe destruction unless we become their puppet state. Our armed forces remain far too weak to confront them."
 hungary.3.a:0 "We just secured independence... Is this already the end of our independence?"
 hungary.3.b:0 "Hungary shall not back down."