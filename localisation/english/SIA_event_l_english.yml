 siam.1.t:0 "German Request"
 siam.1.d:0 "Germany seeks to establish closer relations with us. While this decision may hinder Siamese hegemony over the Indochinese Peninsula, German support and military cooperation could yield substantial benefits for our nation."
 siam.1.a:0 "A fine idea."
 siam.1.b:0 "No, we have no need for them."