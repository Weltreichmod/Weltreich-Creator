 holand.1.t:0 "German Proposal"
 holand.1.d:0 "Germany has requested military transit and naval docking rights, expressing a desire to foster closer ties with us. What should we do?"
 holand.1.a:0 "Not bad."
 holand.1.b:0 "Never!"
 holand.2.t:0 "Flames Over the East Indies"
 holand.2.d:0 "Extremely alarming news has arrived from Batavia in the Dutch East Indies. Local nationalist leaders, led by Sukarno, have unilaterally declared the independence of the Republic of Indonesia, severely undermining the authority of the East Indies administration. The Cabinet in The Hague and Queen Wilhelmina maintain a firm stance, flatly refusing any negotiation with rebel leaders who violate our legal sovereignty. However, the situation on the ground is deteriorating rapidly as militias and armed groups expand their influence, seizing key administrative facilities and resorting to violence against European residents and those collaborating with the established order. Swift military intervention and large-scale policing operations are unavoidable to restore legitimate sovereignty over the Dutch East Indies and regain order in this critical Southeast Asian territory. The homeland must focus all available resources on this effort to prevent the collapse of the Empire."
 holand.2.a:0 "The East Indies are eternal Dutch territory."
 holand.3.t:0 "Declaration of Indonesian Independence"
 holand.3.d:0 "The political situation in Southeast Asia is plunging into severe turmoil. In Batavia, nationalist factions led by Sukarno and Mohammad Hatta have officially declared the independence of the Republic of Indonesia. The Dutch government immediately denounced the declaration as an illegal rebellion and reaffirmed its legitimate sovereignty throughout the East Indies. Dark clouds of new military conflict are gathering over Southeast Asia."
 holand.3.a:0 "Is another war beginning in Southeast Asia?"