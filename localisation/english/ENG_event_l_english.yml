l_english:
 britain.1.t:0 "King George V Passes Away"
 britain.1.d:0 "His Majesty, George V, King of the United Kingdom and the British Dominions, and Emperor of India, has passed away. His quiet calm and devotion to his subjects saw the Empire through both the Great War and the Great Depression. His son will assume the mantle as King Edward VIII, but there are already concerns that he will be too independent of thought. Stanley Baldwin and Neville Chamberlain are preparing to ensure that he will accept direction from the Prime Minister and the Cabinet."
 britain.1.a:0 "May He Rest in Peace"
 britain.2.t:0 "King Edward Abdicates"
 britain.2.d:0 "The Prime Minister has made it quite clear that the dignity of the King-Emperor will be compromised if he were to marry not just a commoner, but also a divorcée—and an American at that. After much soul-searching, His Majesty has chosen love over duty and opted to abdicate. His younger brother, Albert, will assume the throne as King George VI. London bookmakers are already taking odds on whether this shy man will make it to his own coronation."
 britain.2.a:0 "God Save King George VI!"
 britain.3.t:0 "General Election of 1936"
 britain.3.d:0 "In June of 1936, a general election was held in Britain. Now that the Integralist Party has gained immense popularity in Britain, it seems unlikely that the democratic forces will retain power. The winner of this general election is..."
 britain.3.a:0 "The Conservative Party won by a narrow margin."
 britain.3.b:0 "Oswald Mosley's British Union of Integralists won."
 britain.3.c:0 "The communist CPGB won."
 britain.4.t:0 "Alliance with France"
 britain.4.d:0 "The French government has expressed its desire to form an alliance with us. An alliance between our two nations may be necessary to counter Germany."
 britain.4.a:0 "That is a good idea."
 britain.4.b:0 "Absolutely not."
 britain.5.t:0 "Franco-British Non-Aggression Pact"
 britain.5.d:0 "The French have contacted us to sign a non-aggression pact. They share our objective of keeping Germany in check. Perhaps in the future, we will become strong allies."
 britain.5.a:0 "Splendid."
 britain.5.b:0 "Well... I think otherwise."
 britain.6.t:0 "Victory of the Conservative Party"
 britain.6.d:0 "Contrary to everyone's expectations, Britain's Conservatives won the general election. The Communist Party of Great Britain and the Integralist Union continue to voice criticism, claiming election fraud. Although they won the election, it remains to be seen whether Britain's new government can maintain power. Indeed, this election outcome threatens to plunge British society into extreme chaos."
 britain.6.a:0 "Unbelievable!"
 britain.7.t:0 "Oswald Mosley Takes Power"
 britain.7.d:0 "As expected, the British Conservative Party suffered a disastrous defeat in the general election. Britain's new government was formed by the British Union of Integralists led by Oswald Mosley. Now that a far-right party has come to power in Britain, debates are raging everywhere over what path an Integralist Britain will take. We may well be facing another World War."
 britain.7.a:0 "It approaches..."
 britain.8.t:0 "Victory of the Communist Party of Great Britain"
 britain.8.d:0 "The winner of the recent British general election has been declared as the Communist Party of Great Britain. The rule of the Communist Party, which has advocated the abolition of the monarchy and the class system, is expected to drastically alter the order of the British Empire. British capitalists and traditional politicians fiercely oppose Communist rule, and we may be standing on the verge of the end of the centuries-old British Crown."
 britain.8.a:0 "Oh, dear Lord."
 britain.9.t:0 "Resignation of Prime Minister Stanley Baldwin"
 britain.9.d:0 "Prime Minister Stanley Baldwin has resigned from his post, announcing his retirement from politics citing his advanced age. Neville Chamberlain has been named to succeed him, and the British government will now be led by the Neville Chamberlain cabinet."
 britain.9.a:0 "How will the new government lead Britain?"
 britain.10.t:0 "Backlash Against the Election"
 britain.10.d:0 "Left-wing and centrist parties have protested that the recent election results were manipulated by the integralists. Clashing with the integralists, they feel immensely threatened now that the integralists have seized power."
 britain.10.a:0 "Tell them to cease this nonsense."
 britain.11.t:0 "Backlash Against the Election"
 britain.11.d:0 "The integralists are fiercely opposing the unexpected victory of the Conservative Party. This has thrown the British government into profound turmoil, proving exceptionally difficult to overcome."
 britain.11.a:0 "Brace for impact."
 britain.12.t:0 "Integralist Backlash"
 britain.12.d:0 "The British Union of Integralists strongly opposes the outcome of this general election. They claim the election was rigged by the communists. Regardless of the facts, the government is now firmly in the hands of the communists."
 britain.12.a:0 "Tell them not to speak nonsense."
 britain.13.t:0 "The Big Ben Arson Incident"
 britain.13.d:0 "Last night, Big Ben—a symbol of Britain—was set ablaze in a shocking incident. Police have revealed that the arsonist was a member of the Labour Party who claimed it was an act of protest against the current administration. The event has sent shockwaves across the nation and raised concerns that opposition forces against the Conservative government are becoming increasingly radical. The press has labeled it an act of political terrorism, and the government has announced it will use all available means to track down those responsible."
 britain.13.a:0 "It is time to act."
 britain.14.t:0 "Left-Wing Parties Outlawed"
 britain.14.d:0 "Today, following the recent Big Ben arson incident, the government officially outlawed the Labour Party and all other left-wing political factions. These parties strongly condemned the move as political repression, but with the integralist victory now firmly secured, resistance seems futile. Labour Party offices across the country are being shut down, and key figures are either being arrested or fleeing. While some citizens expressed concern, the media hailed the move as a 'legitimate step for national security.' The government has also announced plans to increase surveillance on left-leaning civic groups and media outlets. A historic turning point in British politics has arrived."
 britain.14.a:0 "They are finished."
 britain.15.t:0 "Cruiser Tanks and Infantry Tanks"
 britain.15.d:0 "Debate has erupted within the Army High Command over whether to develop heavily armored tanks to support the infantry or fast-moving tanks to break through enemy lines. Our choice is..."
 britain.15.a:0 "Infantry tanks"
 britain.15.b:0 "Cruiser tanks"
 britain.16.t:0 "Fate of the British Monarchy"
 britain.16.d:0 "The existence of the monarchy is incompatible with a socialist regime. The monarchy must be abolished, and its estates confiscated by the state."
 britain.16.a:0 "Execute them and confiscate their property."
 britain.16.b:0 "Expel them and confiscate their property."
 britain.17.t:0 "Exile of the British Royal Family"
 britain.17.d:0 "A series of events in Britain led to the expulsion of the British royal family. They requested political asylum in Canada, and the Canadian government has approved it."
 britain.17.a:0 "They are welcome here."
 britain.18.t:0 "Independence of Canada"
 britain.18.d:0 "Canada has ultimately declared independence, maintaining that it cannot recognize a communist regime in Britain. Canada is now entirely free from British influence."
 britain.18.a:0 "No!"
 britain.19.t:0 "Independence of Australia"
 britain.19.d:0 "Australia has ultimately declared independence, maintaining that it cannot recognize a communist regime in Britain. Australia is now entirely free from British influence."
 britain.19.a:0 "No!"
 britain.20.t:0 "Independence of New Zealand"
 britain.20.d:0 "New Zealand has ultimately declared independence, maintaining that it cannot recognize a communist regime in Britain. New Zealand is now entirely free from British influence."
 britain.20.a:0 "No!"
 britain.21.t:0 "Joint Exercises with [SOV.GetName]"
 britain.21.d:0 "[SOV.GetName] accepted our proposal, and British and Soviet forces completed their joint military exercises without issue. This exercise has led to an enhancement in the operational quality of both military forces."
 britain.21.a:0 "Splendid."
 britain.22.t:0 "[SOV.GetName] Rejects Joint Exercise Proposal"
 britain.22.d:0 "Our proposal for joint military exercises was ultimately rejected. They appear to remain wary of us, and bilateral cooperation may prove difficult for some time to come."
 britain.22.a:0 "That is regrettable."
 britain.23.t:0 "Preparations for Diplomatic Contact with [SOV.GetName]"
 britain.23.d:0 "To foster relations with [SOV.GetName] and advance our national interests, we are prepared to dispatch diplomats to Leningrad. The outcome of our actions in the coming weeks will alter the global situation."
 britain.23.a:0 "Let us proceed."
 britain.24.t:0 "[SOV.GetName] Agrees to Talks in Leningrad"
 britain.24.d:0 "[SOV.GetName] responded favorably to our proposal, and we shall now commence formal negotiations with them in Leningrad."
 britain.24.a:0 "Let us put forward several proposals."
 britain.25.t:0 "[SOV.GetName] Rejects Proposal for Talks"
 britain.25.d:0 "[SOV.GetName] expressed skepticism regarding our proposal, and our diplomatic delegation ultimately returned home without holding talks."
 britain.25.a:0 "Incomprehensible."
 britain.26.t:0 "[SOV.GetName] Agrees to Military Cooperation"
 britain.26.d:0 "[SOV.GetName] has agreed to military cooperation with us. Both nations shall initiate formal military exchanges."
 britain.26.a:0 "Very good."
 britain.27.t:0 "[SOV.GetName] Refuses Military Cooperation"
 britain.27.d:0 "[SOV.GetName] refused military cooperation with us, stating that military cooperation cannot proceed outside of a formal alliance."
 britain.27.a:0 "Tsk."
 britain.28.t:0 "[SOV.GetName] Agrees to Scientific Cooperation"
 britain.28.d:0 "[SOV.GetName] has agreed to scientific cooperation with us. Both nations shall initiate formal scientific exchanges."
 britain.28.a:0 "Very good."
 britain.29.t:0 "[SOV.GetName] Refuses Scientific Cooperation"
 britain.29.d:0 "[SOV.GetName] refused scientific cooperation with us, stating that scientific cooperation cannot proceed outside of a formal alliance."
 britain.29.a:0 "Tsk."
 britain.30.t:0 "[SOV.GetName] Agrees to Economic Cooperation"
 britain.30.d:0 "[SOV.GetName] has agreed to economic cooperation with us. Both nations shall initiate formal economic exchanges."
 britain.30.a:0 "Very good."
 britain.31.t:0 "[SOV.GetName] Refuses Economic Cooperation"
 britain.31.d:0 "[SOV.GetName] refused economic cooperation with us, stating that economic cooperation cannot proceed outside of a formal alliance."
 britain.31.a:0 "Tsk."
 britain.32.t:0 "Conclusion of the Leningrad Talks"
 britain.32.d:0 "The talks in Leningrad have concluded. As agreed between Britain and [SOV.GetName], the commitments made during the conference will be fulfilled, marking the beginning of cooperation."
 britain.32.a:0 "The results will speak for themselves."
 britain.33.t:0 "British Proposal"
 britain.33.d:0 "The British government has proposed joint efforts to train outstanding military officers. This could certainly prove beneficial to both our nations."
 britain.33.a:0 "A fine opportunity."
 britain.33.b:0 "We have no need for this."
 britain.34.t:0 "France Accepts Our Proposal"
 britain.34.d:0 "France has accepted our proposal. Military cooperation between Britain and France will now commence."
 britain.34.a:0 "Understood."
 britain.35.t:0 "Military Cooperation Proposal Rejected"
 britain.35.d:0 "The French government declined to engage with our proposal, and in the end, military cooperation with them has come to naught."
 britain.35.a:0 "We shall forge our own path, fools."
 britain.36.t:0 "Civil War Against the Integralists"
 britain.36.d:0 "Ultimately, the worst outcome we feared has occurred in Britain. The British Union of Integralists, led by Oswald Mosley, has launched a civil war in southwestern England, rejecting the legitimacy of the current government. Britain has been plunged into turmoil."
 britain.36.a:0 "Blooshed seems unavoidable."
 britain.37.t:0 "Civil War Against the Communists"
 britain.37.d:0 "A communist uprising has erupted in northern England, culminating in civil war. The British government has declared a state of civil war against the communists, and political chaos in Britain will surely accelerate."
 britain.37.a:0 "Can the nation survive this?"
 britain.40.t:0 "Retirement of Prime Minister Baldwin"
 britain.40.d:0 "This morning, Prime Minister Baldwin announced his retirement from political life, expressing his desire to rest on account of his advanced age. In recognition of his long service, he was elevated to the peerage as the 1st Earl of Bewdley. Neville Chamberlain has succeeded Baldwin as Prime Minister, ushering in a new chapter for Britain."
 britain.40.a:0 "Expectations for him are high."
 britain.41.t:0 "The Second Great War"
 britain.41.d:0 "War has broken out between France and Germany. Another conflict of global proportions may present a great opportunity for Britain. Should we aid France and secure victory, restoring our former glory is guaranteed. Conversely, if we remain passive onlookers to continental affairs, we will watch the German Empire vastly expand its influence and exert pressure upon us."
 britain.41.a:0 "Opportunity rarely knocks twice."
 britain.41.b:0 "It is far too dangerous."
 britain.42.t:0 "Preparing for the Return of the King"
 britain.42.d:0 "In Britain, Parliament has held power for a long time since the Glorious Revolution. But now that hypocritical era has come to an end. We shall restore His Majesty, the representative of Almighty God, to the throne, and thereby elevate Britain once more into an empire commanding the world."
 britain.42.a:0 "Let us begin."
 britain.43.t:0 "Parliamentary Crisis"
 britain.43.d:0 "Sustained public support for the Crown and distrust toward Parliament have culminated in a major crisis for the British legislature. Citizens have taken to the streets demanding the King's restoration and the resignation of the cabinet, with demonstrations swelling in scale. All eyes are on how the government will handle this crisis."
 britain.43.a:0 "Let us see how they cope."
 britain.44.t:0 "En-Masse Resignation of the Cabinet"
 britain.44.d:0 "Ultimately, the British Cabinet has decided to resign en masse under persistent public pressure and demands. With their resignation, an emergency administration has taken office, throwing British politics into profound turmoil. The selection of a new leader to guide Britain will take place shortly, and public opinion overwhelmingly favors restoring the King to executive leadership."
 britain.44.a:0 "Britain on the brink."
 britain.45.t:0 "British Demands"
 britain.45.d:0 "The British government delivered an ultimatum demanding our annexation yesterday evening. They have given us 24 hours, warning that failure to comply will result in annexation by force."
 britain.45.a:0 "There is no choice but to submit."
 britain.45.b:0 "Out of the question."
 britain.46.t:0 "[FROM.GetName] Submits to Our Demands"
 britain.46.d:0 "[FROM.GetName] has ultimately accepted our demand for annexation, and their territory is now ours. All resources and manpower produced there are now subject to British authority. The glory of the British Empire shines once more."
 britain.46.a:0 "Very good."
 britain.47.t:0 "[FROM.GetName] Rejects Our Demands"
 britain.47.d:0 "[FROM.GetName] has ultimately rejected our demands. They stated that they have no intention of surrendering their autonomy and would rather go to war. We shall crush them into the dirt as they wish."
 britain.47.a:0 "Crush them thoroughly."
 britain.48.t:0 "Alliance with Britain"
 britain.48.d:0 "The British government has expressed a desire to form an alliance with us. They approached us requesting several of our colonial possessions. An alliance between our two nations may be necessary to counter France."
 britain.48.a:0 "That is a good idea."
 britain.48.b:0 "I question whether this is necessary."
 britain.50.t:0 "Anglo-German Alliance"
 britain.50.d:0 "Yesterday evening, an alliance between the German Empire and Britain was officially proclaimed. The two nations announced that they will share a common destiny as a bound alliance, never abandoning one another. France is reacting with intense sensitivity to this union of great powers, and this alliance threatens to reshape the map of Europe."
 britain.50.a:0 "What future awaits Europe?"
 britain.51.t:0 "Germany Rejects Alliance Proposal"
 britain.51.d:0 "The German government has rejected our proposal to form an alliance. They appear confident in standing alone. Their arrogance will be their undoing."
 britain.51.a:0 "Fools."
 britain.52.t:0 "Preparations for Diplomatic Contact with France"
 britain.52.d:0 "To foster relations with France and advance our national interests, we are prepared to dispatch diplomats to Paris. The outcome of our actions in the coming weeks will alter the global situation."
 britain.52.a:0 "Let us proceed."
 britain.53.t:0 "France Agrees to Talks in Paris"
 britain.53.d:0 "France responded favorably to our proposal, and we shall now commence formal negotiations with them in Paris."
 britain.53.a:0 "Let us put forward several proposals."
 britain.54.t:0 "France Rejects Proposal for Talks"
 britain.54.d:0 "France expressed skepticism regarding our proposal, and our diplomatic delegation ultimately returned home without holding talks."
 britain.54.a:0 "Incomprehensible."
 britain.55.t:0 "France Agrees to Military Cooperation"
 britain.55.d:0 "France has agreed to military cooperation with us. Both nations shall initiate formal military exchanges."
 britain.55.a:0 "Very good."
 britain.56.t:0 "France Refuses Military Cooperation"
 britain.56.d:0 "France refused military cooperation with us, stating that military cooperation cannot proceed outside of a formal alliance."
 britain.56.a:0 "Tsk."
 britain.57.t:0 "France Agrees to Scientific Cooperation"
 britain.57.d:0 "France has agreed to scientific cooperation with us. Both nations shall initiate formal scientific exchanges."
 britain.57.a:0 "Very good."
 britain.58.t:0 "France Refuses Scientific Cooperation"
 britain.58.d:0 "France refused scientific cooperation with us, stating that scientific cooperation cannot proceed outside of a formal alliance."
 britain.58.a:0 "Tsk."
 britain.59.t:0 "France Agrees to Economic Cooperation"
 britain.59.d:0 "France has agreed to economic cooperation with us. Both nations shall initiate formal economic exchanges."
 britain.59.a:0 "Very good."
 britain.60.t:0 "France Refuses Economic Cooperation"
 britain.60.d:0 "France refused economic cooperation with us, stating that economic cooperation cannot proceed outside of a formal alliance."
 britain.60.a:0 "Tsk."
 britain.61.t:0 "Conclusion of the Paris Talks"
 britain.61.d:0 "The talks in Paris have concluded. As agreed between Britain and France, the commitments made during the conference will be fulfilled, marking the beginning of cooperation."
 britain.61.a:0 "The results will speak for themselves."
 britain.62.t:0 "Scottish Independence"
 britain.62.d:0 "Scotland has taken advantage of postwar chaos to declare independence. The long-standing movement for Scottish independence within Britain has ultimately exploded amidst the chaos of war. Neglecting this could jeopardize the very existence of Britain."
 britain.62.a:0 "Oh, Lord..."
 britain.63.t:0 "Debate on Recognizing Scottish Independence"
 britain.63.d:0 "Debate continues within the British government over whether to recognize Scottish independence or to force them into submission by military power. Initiating another war when the long conflict has barely ended risks further alienating public sentiment, yet leaving Scottish independence unaddressed threatens the survival of the realm."
 britain.63.a:0 "Declare war."
 britain.63.b:0 "We have no choice."
 britain.64.t:0 "Scottish Declaration of Independence"
 britain.64.d:0 "Yesterday morning, astonishing news spread across the globe from Britain. Following the conclusion of a peace treaty between Britain and Germany, Scotland declared independence from the United Kingdom.\n\nFollowing Britain's de facto defeat, internal social chaos reached its peak, and Scottish separatists appear to have seized this moment to rise in revolt. The world is now watching Britain's reaction to Scottish independence."
 britain.64.a:0 "Surprising news."
 britain.66.t:0 "Discord with France"
 britain.66.d:0 "With Germany defeated and the war in Europe over, fissures among the victors have quickly emerged. During the war, a common enemy bound us together, but with that threat gone, the differences between France and Britain have come to the forefront. The French government now seeks to cement its absolute leadership, increasingly dismissing our concerns and proposals. What began as an alliance under the banner of unity has devolved into France's hegemonic project—one Britain cannot accept. Our government has resolved not to remain under Paris's shadow any longer. Britain will chart its own course and withdraw from the French-led faction. History will mark this day as the moment of our separation."
 britain.66.a:0 "We will not remain under France's shadow."
 britain.67.t:0 "Britain's Proposal of Cooperation"
 britain.67.d:0 "The British government has formally proposed transatlantic cooperation. With France tightening its grip over the continent, Britain has realized it cannot stand alone and seeks to shape a new order alongside us. Accepting the proposal would strengthen our ties with Britain and give us a leading role in shaping the postwar order. Yet doing so may strain relations with France and burden us with far greater responsibility in European affairs."
 britain.67.a:0 "Accept the proposal — together we will shape the future."
 britain.67.b:0 "Reject the proposal — we will walk our own path."
 britain.68.t:0 "The United States Accepts"
 britain.68.d:0 "The American government has accepted our proposal of cooperation. This is not a mere diplomatic gesture but a clear declaration of intent to jointly shape and lead the postwar order. Washington and London are now united under common goals, offering a counterbalance to France's unilateral ambitions. The spirit of transatlantic alliance has inspired our people with renewed hope, and Britain once more secures a prominent role in world affairs."
 britain.68.a:0 "The transatlantic alliance is born."
 britain.69.t:0 "The United States Refuses"
 britain.69.d:0 "The American government has rejected our proposal of cooperation. Declaring that they will walk their own path, the Americans have left Britain with deep disappointment. With France's influence expanding across Europe, their refusal risks leaving us isolated diplomatically. Within the government, optimists argue that we can still forge our own way, while realists insist we must find new partners. What is certain, however, is that Britain must now proceed without the support of our transatlantic cousins."
 britain.69.a:0 "We shall carve our path alone."
 britain.70.t:0 "The Death of King George V"
 britain.70.d:0 "On January 20, 1936, King George V of the British Empire and Emperor of India passed away at Sandringham House in Norfolk at the age of 70. As a constitutional monarch, he upheld stability through his composure and dedication, guiding the Empire through the upheavals of the Great War and the Great Depression.\n\nHis eldest son has now ascended the throne as King Edward VIII, yet concerns are being raised within the government regarding his free-spirited nature and his tendency to act independently from the cabinet."
 britain.70.a:0 "May he rest in peace."