l_english:
 Germany.1.t:0 "The Marx Scandal"
 Germany.1.d:0 "Just a couple of months after being elected chancellor, Wilhelm Marx's political career has seemingly been brought to a sudden halt. An anonymous tip received by the editorial department of the Deutsche Zeitung claims that Marx accepted bribes from a network of Jewish bankers and financiers to undermine German economic stability, creating unemployment and forcing reliance on bank loans—most of which originated from Jewish institutions. It appears Marx's tenure as chancellor is no longer secure."
 Germany.1.a:0 "Bloody hell, I never took a single Pfennig!"
 Germany.2.t:0 "Cabinet Reshuffle in Germany"
 Germany.2.d:0 "The Kaiser has made his decision. Earlier today, the German government announced the resignation of Chancellor Wilhelm Marx from the Reichstag following the scandal surrounding him. In the wake of the announcement, questions arose over who leaked the information to the Deutsche Zeitung and how it was obtained. Several media outlets published defense pieces arguing he was framed and committed no wrongdoing. Nevertheless, Marx has been ousted from office, leaving the Kaiser to select a new successor.\n\nThe press is paying close attention to who the Kaiser will choose as the next Chancellor, a decision that will likely shape the fate of Germany."
 Germany.2.a:0 "Farewell, Wilhelm."
 Germany.3.t:0 "A New Chancellor"
 Germany.3.d:0 "There are two primary candidates for Chancellor."
 Germany.3.a:0 "Hjalmar Schacht, the primary architect of recovery from the Great Depression."
 Germany.3.b:0 "Gerhard Tappen, former Army Commander."
 Germany.4.t:0 "German-Soviet Non-Aggression Pact Concluded"
 Germany.4.d:0 "The Soviet government has agreed to sign a non-aggression treaty with Germany in exchange for economic assistance. We have succeeded in relieving the burden of a two-front war."
 Germany.4.a:0 "Splendid."
 Germany.5.t:0 "[SOV.GetName] Rejects the Proposal!"
 Germany.5.d:0 "[SOV.GetName] has rejected our proposal. We may once again face the terrifying prospect of a two-front war."
 Germany.5.a:0 "Oh, God..."
 Germany.6.t:0 "The Austrians Agree!"
 Germany.6.d:0 "It did not take long to receive a response from the Austrians. They have agreed to our proposal!"
 Germany.6.a:0 "It was indeed the natural decision."
 Germany.7.t:0 "The Austrians Reject!"
 Germany.7.d:0 "The Austrians dismissed the German delegation, calling the proposal utter nonsense. Austria appears unwilling to enter into an alliance with us."
 Germany.7.a:0 "What?"
 Germany.8.t:0 "Renewal of the German-Soviet Non-Aggression Pact"
 Germany.8.d:0 "This morning, the German and Soviet diplomatic delegations renewed their mutual non-aggression pact. This further reduces the immediate threat of conflict between Germany and [SOV.GetName]."
 Germany.8.a:0 "Understood."
 Germany.9.t:0 "Conclusion of the Treaty of Königsberg"
 Germany.9.d:0 "Yesterday evening, German and Soviet diplomats convened in Königsberg to negotiate German economic aid to [SOV.GetName] and terms for a bilateral non-aggression pact. Both nations reached an agreement, and the treaty will remain in effect for at least three years."
 Germany.9.a:0 "Where will this lead us?"
 Germany.10.t:0 "The Anzio Negotiations"
 Germany.10.d:0 "Preparations are complete for formal negotiations with the Italians."
 Germany.10.a:0 "Let us begin."
 Germany.11.t:0 "Italy Demands Lombardy-Venetia"
 Germany.11.d:0 "Italy has demanded the return of Lombardy-Venetia, which was lost during the Great War."
 Germany.11.a:0 "That is for Austria to decide."
 Germany.12.t:0 "Italy Demands Economic Aid"
 Germany.12.d:0 "Italy has requested substantial economic assistance from us."
 Germany.12.a:0 "We agree."
 Germany.12.b:0 "Out of the question."
 Germany.13.t:0 "Anzio Negotiations Fall Through"
 Germany.13.d:0 "In the end, Italy refused to conclude negotiations with us. Then again, Italy is hardly an indispensable asset—will their absence truly pose a problem?"
 Germany.13.a:0 "They could not even defeat Ethiopia."
 Germany.14.t:0 "Austria-Hungary Denies Territorial Return"
 Germany.14.d:0 "Regrettably, Austria appears unwilling to return the territory of Lombardy-Venetia to Italy. The Italians may reject our overall proposal as a result."
 Germany.14.a:0 "We shall see..."
 Germany.15.a:0 "We agree."
 Germany.15.b:0 "Out of the question."
 Germany.16.a:0 "That is for Austria to decide."
 Germany.17.t:0 "Austria Joins [REI.GetFactionName]"
 Germany.17.d:0 "Austria has formally decided to join [REI.GetFactionName]. Today, we have gained a powerful partner."
 Germany.17.a:0 "Understood."
 Germany.18.t:0 "Austria Rejects Our Demand"
 Germany.18.d:0 "Austria has ungratefully forgotten all the aid we have provided them thus far and rejected our request."
 Germany.18.a:0 "Bastards..."
 Germany.19.t:0 "Italy Joins [REI.GetFactionName]"
 Germany.19.d:0 "Italy has decided to join [REI.GetFactionName]. Today, we have secured a powerful ally."
 Germany.19.a:0 "Understood."
 Germany.20.t:0 "Italy Rejects Our Demand"
 Germany.20.d:0 "Italy has ungratefully forgotten all our past support and flatly rejected our request."
 Germany.20.a:0 "Bastards..."
 Germany.21.t:0 "Maltese Docking Rights"
 Germany.21.d:0 "Malta has agreed to grant us naval docking rights in exchange for our guarantee of protection."
 Germany.21.a:0 "The Mediterranean is ours."
 Germany.22.t:0 "Maltese Rejection"
 Germany.22.d:0 "Malta rejected our offer to guarantee their independence, informing us that we will not receive docking rights at their ports."
 Germany.22.a:0 "Tell them we have no need for such a tiny island anyway."
 Germany.23.t:0 "Commencing Vienna Talks with Austria"
 Germany.23.d:0 "Whether Austria will stand by our side as before remains to be seen, but as brothers of shared heritage, would it not be logical to assist one another?"
 Germany.23.a:0 "Let us begin."
 Germany.23.b:0 "We have no need for Austria. There is only one Volk, one Reich."
 Germany.26.t:0 "Italy Agrees"
 Germany.26.d:0 "Italy has decided to enter the war alongside us should conflict erupt with Austria."
 Germany.26.a:0 "Splendid."
 Germany.27.t:0 "Italy Refuses"
 Germany.27.d:0 "Italy rejected our offer, stating they wish to avoid taking substantial risks. Perhaps Italy has no desire to reclaim the lands lost in the Great War."
 Germany.27.a:0 "It was a rare opportunity. Fools."
 Germany.28.t:0 "Romania Agrees"
 Germany.28.d:0 "Romania has agreed to join the war alongside us should conflict erupt with Austria."
 Germany.28.a:0 "Splendid."
 Germany.29.t:0 "Romania Refuses"
 Germany.29.d:0 "Romania rejected our offer, stating they wish to avoid significant risk—despite this being a prime opportunity to secure their claimed territories."
 Germany.29.a:0 "It was a rare opportunity. Fools."
 Germany.38.t:0 "Second Deutscher Krieg"
 Germany.38.d:0 "The German Empire has demanded Austrian territory inhabited by ethnic Germans. German troops crossed the Austrian border yesterday evening, and the situation is rapidly spiraling out of control. Observers are watching closely to see how long Austria can withstand the German offensive."
 Germany.38.a:0 "A fratricidal war."
 Germany.30.t:0 "Bohemia Enters Our Protection"
 Germany.30.d:0 "Bohemia capitulated before our forces. The Sudetenland is firmly in our hands, and Bohemia shall become our protectorate."
 Germany.30.a:0 "Splendid!"
 Germany.31.t:0 "Sudetenland Return Refused"
 Germany.31.d:0 "Bohemia has refused to hand over the Sudetenland. Retribution shall follow."
 Germany.31.a:0 "They know what this entails."
 Germany.32.t:0 "Bulgaria Agrees"
 Germany.32.d:0 "Bulgaria has agreed to sign an alliance treaty with us, marking a significant milestone in our expanding influence across the Balkans."
 Germany.32.a:0 "Good."
 Germany.33.t:0 "Bulgarian Rejection"
 Germany.33.d:0 "Bulgaria refused to form an alliance with us. They shall crumble in isolated solitude in the Balkans."
 Germany.33.a:0 "We have no need for them either."
 Germany.34.t:0 "Serbia Agrees"
 Germany.34.d:0 "Serbia has agreed to sign an alliance treaty with us, demonstrating our growing sway in the Balkans."
 Germany.34.a:0 "Good."
 Germany.35.t:0 "Serbian Rejection"
 Germany.35.d:0 "Serbia refused to form an alliance with us. They shall crumble in isolated solitude in the Balkans."
 Germany.35.a:0 "We have no need for them either."
 Germany.36.t:0 "The Netherlands Grants Military Access"
 Germany.36.d:0 "The Netherlands has granted us military transit rights in exchange for our guarantee of their independence. This marks a positive step forward in our bilateral relations."
 Germany.36.a:0 "Good."
 Germany.37.t:0 "The Netherlands Rejects"
 Germany.37.d:0 "The Dutch government informed us that not a single soldier of ours will be permitted to step foot on their territory. Building a close partnership with them appears unlikely."
 Germany.37.a:0 "Fools..."
 Germany.40.t:0 "Georgia Submits"
 Germany.40.d:0 "Georgia has become our protectorate. We have secured a valuable bridgehead to exert pressure on [SOV.GetName] whenever we choose."
 Germany.40.a:0 "Long live the German Empire!"
 Germany.39.t:0 "Georgian Rejection"
 Germany.39.d:0 "Georgia rejected our proposal, calling it an infringement upon their sovereignty. Let us see if their arrogant stance holds when faced with Soviet aggression."
 Germany.39.a:0 "Their state will not endure long."
 Germany.41.t:0 "German-Greek Alliance"
 Germany.41.d:0 "Yesterday evening, the foreign ministers of Germany and Greece signed an accord regarding military cooperation and political partnership. This clearly signals German interest in the Middle East and will inevitably bring us into conflict with the Ottoman Empire. Though Germany and Greece were once adversaries, our new alliance proves that history knows no permanent enemies."
 Germany.41.a:0 "Is it time to redraw the map?"
 Germany.42.t:0 "Greek Rejection"
 Germany.42.d:0 "Greece declined our offer, stating they cannot take on the risk involved. One would think no nation could match our strength against the Ottomans..."
 Germany.42.a:0 "Idiots—do they not realize the Ottomans will attack them?"
 Germany.43.t:0 "German-Ottoman Alliance"
 Germany.43.d:0 "Yesterday at mid-day, Germany and the Ottoman Empire concluded a Mutual Defense Treaty. Just as in the Great War, the two nations stand as allies once more. This will come as troubling news to hostile neighbors of the Porte. How long can the Ottoman realm endure under German protection?"
 Germany.43.a:0 "Formation of the German-Ottoman Alliance."
 Germany.44.t:0 "Ottoman Empire Rejects Offer"
 Germany.44.d:0 "The Ottoman Empire rejected our request, seemingly trapped in the arrogant belief that they can resolve their crises alone. It is self-evident that they are heading toward collapse."
 Germany.44.a:0 "Fools."
 Germany.45.t:0 "Ukrainian Defense Plan"
 Germany.45.d:0 "The High Command has submitted two options to fortify Ukraine. The first is constructing a fortified line along the Ukrainian-Russian border; the second is establishing defense lines along the Dnieper River."
 Germany.45.a:0 "Not an inch of Ukrainian soil shall be yielded!"
 Germany.45.b:0 "Economy of force—effective defense must take priority."
 Germany.46.t:0 "German Policy Toward Denmark"
 Germany.46.d:0 "The time has come to decide our policy toward Denmark on our northern border. We can launch an invasion to reduce them to a puppet state, or foster friendly relations to bring them within our sphere of influence. Whichever path is chosen, may it benefit the Reich."
 Germany.46.a:0 "Is it truly necessary to create more enemies?"
 Germany.46.b:0 "As I recall, Denmark falls within our Lebensraum plans."
 Germany.47.t:0 "German-Danish Alliance"
 Germany.47.d:0 "Yesterday morning, a military alliance treaty between Germany and Denmark was formally signed. Reports indicate both nations expressed mutual interest in concluding the pact. Neighboring states are watching closely to gauge the consequences of this alliance."
 Germany.47.a:0 "Hmm..."
 Germany.48.t:0 "German-Danish Guarantee of Independence"
 Germany.48.d:0 "The Danish government has agreed to maintain friendly relations with us. Both governments have agreed to guarantee each other's independence in perpetuity, remaining in force so long as neither state falls."
 Germany.48.a:0 "Splendid."
 Germany.49.t:0 "Danish Rejection"
 Germany.49.d:0 "The Danish government flatly rejected our proposal, reaffirming Denmark's commitment to strict permanent neutrality."
 Germany.49.a:0 "Well, no matter."
 Germany.50.t:0 "Norwegian Rejection"
 Germany.50.d:0 "The Norwegian government rejected our demand, demonstrating a firm resolve to resist. War appears unavoidable."
 Germany.50.a:0 "They know what this entails."
 Germany.51.t:0 "Swedish Rejection"
 Germany.51.d:0 "The Swedish government rejected our demand, demonstrating a firm resolve to resist. War appears unavoidable."
 Germany.51.a:0 "They know what this entails."
 Germany.52.t:0 "German-Finnish Alliance"
 Germany.52.d:0 "Yesterday, the German and Finnish governments officially formed an alliance. The Soviet government lodged a formal protest, accusing Germany of openly threatening [SOV.GetName]. Observers across Europe are watching how this alliance will alter the balance of power."
 Germany.52.a:0 "Understood."
 Germany.53.t:0 "Finnish Rejection"
 Germany.53.d:0 "The Finnish government issued a refusal, stating that an alliance with us carries too much danger. It seems unlikely Finland will maintain warm relations with us in the near future."
 Germany.53.a:0 "Why would they refuse?"
 Germany.54.t:0 "German-Swedish Mutual Independence Guarantee"
 Germany.54.d:0 "Germany and Sweden have agreed to a mutual independence guarantee, marking a constructive step forward in bilateral relations."
 Germany.54.a:0 "Excellent news!"
 Germany.55.t:0 "Swedish Rejection"
 Germany.55.d:0 "Sweden rejected our proposal, insisting on its policy of strict neutrality. Well, if they insist on refusing, there is little more to be done."
 Germany.55.a:0 "Why would they refuse?"
 Germany.56.t:0 "German-Romanian Mutual Independence Guarantee"
 Germany.56.d:0 "Germany and Romania have agreed to a mutual independence guarantee, marking a constructive step forward in bilateral relations."
 Germany.56.a:0 "Excellent news!"
 Germany.57.t:0 "Romanian Rejection"
 Germany.57.d:0 "Romania rejected our proposal, maintaining its stance of strict neutrality. Well, if they insist on refusing, there is little more to be done."
 Germany.57.a:0 "We shall see..."
 Germany.58.t:0 "Bohemia Submits!"
 Germany.58.d:0 "Following days of escalating tension, Bohemia has ultimately been annexed by the German Empire. The Bohemian government proved unable to withstand intense German diplomatic pressure. Germany may once again be preparing for global war."
 Germany.58.a:0 "Oh."
 Germany.59.t:0 "Fate of Bohemia"
 Germany.59.d:0 "Bohemia has refused to merge with our Reich. Foolish Bohemians seem to believe they can hold out against us on their own."
 Germany.59.a:0 "Idiots."
 Germany.60.t:0 "Siam Agrees!"
 Germany.60.d:0 "Siam has granted us military transit rights, advancing relations between Siam and Germany another step forward."
 Germany.60.a:0 "Splendid."
 Germany.61.t:0 "Siam Refuses"
 Germany.61.d:0 "Siam rejected our proposal. They appear to have little desire for closer ties with us. We may eventually have to compete with them for influence in Indochina."
 Germany.61.a:0 "Competing with Siam? Absurd."
 Germany.62.t:0 "Boer Resistance"
 Germany.62.d:0 "Last night, Boer populations launched large-scale riots. Eleven government offices were burned, and thirty deaths have been confirmed. The uprising has exposed severe internal fractures in South Africa, demonstrating the failure of current government policy. Rumors suggest German involvement, though Berlin denies all allegations, dismissing them as malicious falsehoods."
 Germany.62.a:0 "It was bound to happen."
 Germany.63.t:0 "Policy Toward Hungary"
 Germany.63.d:0 "Hungary, a newly emerged state in Central Europe, was born out of the collapse of the Austro-Hungarian Empire. The time has come to determine our official policy line toward this new nation."
 Germany.63.a:0 "Standard diplomatic ties will suffice."
 Germany.63.b:0 "Demand Slovakian independence and the cession of Burgenland."
 Germany.63.c:0 "Hungary must become our puppet state."
 Germany.64.t:0 "Hungary Agrees"
 Germany.64.d:0 "After lengthy deliberation, the Hungarian government agreed to comply with our demands, further consolidating German hegemony in Central Europe."
 Germany.64.a:0 "Understood."
 Germany.65.t:0 "Hungarian Government Rejects"
 Germany.65.d:0 "The Hungarian government rejected our demands. They must be underestimating us."
 Germany.65.a:0 "Disgusting."
 Germany.66.t:0 "Independence of Ukraine"
 Germany.66.d:0 "Following the recent revolution in Ukraine, the Ukrainian government declared total independence, severing its subordinate relationship with Germany."
 Germany.66.a:0 "Ukrainian independence is impossible, even in their dreams!"
 Germany.66.b:0 "Leave them be; that is their fate."
 Germany.67.t:0 "Ukraine Offers Terms of Surrender"
 Germany.67.d:0 "Ukraine informed our government that it is willing to accept puppet status provided we recognize Ukraine's democratic government."
 Germany.67.a:0 "Understood."
 Germany.67.b:0 "Never."
 Germany.69.t:0 "[SOV.GetName] Offers Terms of Surrender"
 Germany.69.d:0 "Unable to withstand our German offensive, [SOV.GetName] suffered continuous defeats and has finally raised the white flag."
 Germany.69.a:0 "We have won the war."
 Germany.69.b:0 "The Slavs deserve to be wiped out."
 Germany.70.t:0 "Armistice of Gorky"
 Germany.70.d:0 "After a fierce campaign, Germany has emerged victorious in the German-Soviet War. [SOV.GetName] made repeated strategic blunders and has ultimately conceded defeat. All that remains is a humiliating and crushing treaty for [SOV.GetName]."
 Germany.70.a:0 "Victory for Germany."
 Germany.71.t:0 "Treaty of Kazan"
 Germany.71.d:0 "[SOV.GetName] collapsed before our overwhelming military power, granting us complete victory over them."
 Germany.71.a:0 "German victory and the collapse of Russia."
 Germany.71.b:0 "A grand victory."
 Germany.71.c:0 "It is over; the war is lost."
 Germany.72.t:0 "Treaty of Kazan"
 Germany.72.d:0 "Following intense fighting, Germany has won the German-Soviet War. [SOV.GetName] was completely shattered by total defeat and, much like in 1918, has ceded vast territories to Germany. It seems unlikely [SOV.GetName] will ever recover..."
 Germany.72.a:0 "The realization of Lebensraum."
 Germany.73.t:0 "Italy Requests Alliance"
 Germany.73.d:0 "Italy has requested to form an alliance with our nation, which would further bolster Germany's influence across Europe."
 Germany.73.a:0 "A fine proposal."
 Germany.73.b:0 "We have no need for them."
 Germany.74.t:0 "Alliance Between Germany and Italy"
 Germany.74.d:0 "Yesterday morning, an alliance was formally concluded between Germany and Italy. As a result, German sway over Europe has expanded further, a military pact that will surely provoke France."
 Germany.74.a:0 "Let us wait and see..."
 Germany.74.b:0 "Cheers to victory!"
 Germany.75.t:0 "Arms Production Pact with the Ottoman Empire"
 Germany.75.d:0 "The Ottoman Empire has requested technical assistance to establish domestic arms production, agreeing to compensate us financially."
 Germany.75.a:0 "Understood."
 Germany.75.b:0 "No."
 Germany.76.t:0 "Demise of Kaiser Wilhelm II"
 Germany.76.d:0 "Kaiser Wilhelm II, Emperor of the German Empire and the last monarch of the 19th century, has passed away from old age at Charité Hospital in Berlin. Mourning processions formed across the Reich. The throne of the Kaiser, who led Germany into becoming the world's premier power across the 19th and 20th centuries, will now pass to his son. Crown Prince Wilhelm is expected to ascend as Wilhelm III. History shall remember the late Kaiser as the monarch of the Great War and a formidable ruler of Germany."
 Germany.76.a:0 "Let us mourn his passing and celebrate the accession of Wilhelm III!"
 Germany.76.b:0 "That abominable Guillaume is dead at last."
 Germany.77.t:0 "Subduing Austria"
 Germany.77.d:0 "We have succeeded in breaking the Austro-Hungarian Empire following the war. Now, we shall negotiate territorial demarcations with our allies who fought alongside us against Austria."
 Germany.77.a:0 "Let us begin."
 Germany.78.t:0 "War with [AUH.GetName]"
 Germany.78.d:0 "Since the Great War, [AUH.GetName] has been little more than a burden. Maintaining them as an ally imposes severe costs on us. It would be far better to conquer them, unify all German lands, and expand our borders."
 Germany.78.a:0 "Vorwärts! Vorwärts!"
 Germany.79.t:0 "Total Defeat of [AUH.GetName]"
 Germany.79.d:0 "The Austro-Hungarian Empire has been completely shattered before our forces. Their lands have been partitioned according to our design, establishing a new order across Central Europe."
 Germany.79.a:0 "Long live Germany!"
 Germany.80.t:0 "The Great Sacred War"
 Germany.80.d:0 "People of Germany! At four o'clock this morning,\n\nFrench forces launched an unprovoked invasion across the entire German border. Nanzig, Maas, Mülhausen, and Cambrai came under simultaneous attack, resulting in hundreds of casualties already.\n\nAs of today, the final war against the French aggressors has begun. Right is on our side, we shall bring the enemy to their knees, and..."
 Germany.80.a:0 "...victory shall be ours!"
 Germany.81.t:0 "German-Turkish Alliance"
 Germany.81.d:0 "Just as in 1914, an alliance between Germany and the Ottoman Empire has been established. This move by the Reich has heightened tensions among neighboring states, with Paris expressing deep displeasure over German actions. Nevertheless, Berlin and Constantinople formally announced plans to solidify bilateral ties and deepen their military alliance."
 Germany.81.a:0 "What future awaits the world?"
 Germany.82.t:0 "German-Russian Non-Aggression Pact Concluded"
 Germany.82.d:0 "The Russian government has agreed to sign a non-aggression pact with Germany in exchange for economic aid, successfully relieving our burden of a two-front war."
 Germany.82.a:0 "Splendid."
 Germany.83.t:0 "Russian Rejection!"
 Germany.83.d:0 "Russia has rejected our proposal. We may once again be dragged into the nightmare of a two-front war."
 Germany.83.a:0 "Oh, God..."
 Germany.84.t:0 "Conclusion of the Treaty of Hamburg"
 Germany.84.d:0 "Yesterday evening, German and Russian diplomats met in Hamburg to negotiate German economic aid to Russia and terms for a mutual non-aggression pact. Both nations reached an accord, which will remain in force for at least three years."
 Germany.84.a:0 "Where will this lead us?"
 Germany.85.t:0 "Renewal of German-Russian Non-Aggression Pact"
 Germany.85.d:0 "This morning, the German and Russian diplomatic delegations renewed their non-aggression pact. So long as the Treaty of Hamburg remains valid, we shall continue to renew this agreement."
 Germany.85.a:0 "Understood."
 Germany.86.t:0 "Russia Offers Terms of Surrender"
 Germany.86.d:0 "Unable to withstand the German offensive, Russian forces suffered repeated defeats and have ultimately raised the white flag."
 Germany.86.a:0 "We have won the war."
 Germany.86.b:0 "The Slavs deserve to be wiped out."
 Germany.87.t:0 "Armistice of Gorky"
 Germany.87.d:0 "Following an intense campaign, Germany has emerged victorious in the German-Russian War. Russia committed major strategic blunders and has finally conceded defeat. All that remains is a humiliating and unbearable treaty for Russia."
 Germany.87.a:0 "Victory for Germany."
 Germany.88.t:0 "Treaty of Nizhny Novgorod"
 Germany.88.d:0 "Russia collapsed before our overwhelming military power, granting us complete victory over them."
 Germany.88.a:0 "German victory and the collapse of Russia."
 Germany.88.b:0 "A grand victory."
 Germany.88.c:0 "It is over; the war is lost."
 Germany.89.t:0 "Treaty of Nizhny Novgorod"
 Germany.89.d:0 "Following intense fighting, Germany has won the German-Russian War. Russia was completely shattered by total defeat and, much like in 1918, has ceded vast territories to Germany. It seems unlikely Russia will ever recover..."
 Germany.89.a:0 "The realization of Lebensraum."
 Germany.90.t:0 "Einstein-Szilard Letter"
 Germany.90.d:0 "Albert Einstein\nClayallee 150 14195 Berlin\n\nWilhelm II\nSchloßplatz 1 10178 Berlin\n\nYour Majesty:\nSome recent work by E. Fermi and L. Szilard, which has been communicated to me in manuscript, leads me to expect that the element uranium may be turned into a new and important source of energy in the immediate future. Certain aspects of the situation which has arisen seem to call for watchfulness and, if necessary, quick action on the part of the Administration. I believe therefore that it is my duty to bring to your attention the following facts and recommendations: In the course of the last four months it has been made probable—through the work of Joliot in France as well as Fermi and Szilard in Austria-Hungary-Croatia—that it may become possible to set up a nuclear chain reaction in a large mass of uranium by which vast amounts of power and large quantities of new radium-like elements would be generated. Now it appears almost certain that this could be achieved in the immediate future. This phenomenon would also lead to the construction of bombs, and it is conceivable—though much less certain—that extremely powerful bombs of a new type may thus be constructed. A single bomb of this type, carried by boat and exploded in a port, might very well destroy the whole port together with some of the surrounding territory. However, such bombs might very well prove to be too heavy for transportation by air."
 Germany.90.a:0 "Next."
 Germany.91.t:0 "Second Page"
 Germany.91.d:0 "Mainland Germany has only very poor ores of uranium in moderate quantities. There is some good ore in Canada and Bohemia, while the most important source of uranium is German Congo. In view of this situation you may think it desirable to have some permanent contact maintained between the Administration and the group of physicists working on chain reactions in Germany. One possible way of achieving this might be for you to entrust with this task a person who has your confidence and who could perhaps serve in an unofficial capacity. His task might comprise the following:\na) to approach Government Departments, keep them informed of the further development, and put forward recommendations for Government action, giving particular attention to the problem of securing a supply of uranium ore for mainland Germany.\nb) to speed up the experimental work, which is at present being carried on within the limits of the budgets of University laboratories, by providing funds, if such funds be required, through his contacts with private persons who are willing to make contributions for this cause, and perhaps also by obtaining the co-operation of industrial laboratories which have the necessary equipment.\nI know that France has asked their ally Britain to ban the sale of uranium from its uranium mines in Canada to other countries except France. France has moved so quickly, perhaps because people like André Dewavrin of the French Bureau Central de Renseignements et d'Action have reported that Germany is doing something with uranium.\n\nYours very truly,\n\nAlbert Einstein"
 Germany.91.a:0 "He is right."
 Germany.92.t:0 "Western Front Collapse"
 Germany.92.d:0 "The Western Front has collapsed under the French offensive, rendering our Friedrich Line useless. We must urgently establish a defense line along the Rhine and restore army morale."
 Germany.92.a:0 "Germany shall not fall!"
 Germany.93.t:0 "After Everything Ended"
 Germany.93.d:0 "*Gasp!*\nA middle-aged man with a Kaiser-style mustache awoke with a jolt in a family home in Munich, German Empire. He seemed to have just had a terrible nightmare. His entire body was drenched in cold sweat.\n\"What a horrible dream...\"\nThe man recalled the vivid contents of the dream that still lingered in his mind.\n\nIn the dream, Germany had lost the First World War, and he himself was the leader of that Germany. He had ordered the deaths of countless Jews and even created a strange salute and slogan. Eventually, in pursuit of revenge for the First World War, he started a Second World War—but was defeated once again and died by suicide with a pistol in a Berlin bunker. It was a truly horrifying dream.\nIn the dream, Germany seemed more like France wearing a German mask—defeated in the First World War, started another war for revenge, and lost again, just like France.\nHe felt a bit relieved knowing it had only been a dream. The idea that great Germany would be trampled under the feet of France and the Soviets—it was unthinkable.\n\"No matter what, Germany never loses.\"\nGermany had already repelled the cowardly attacks of France and the Soviets, and had won the Second World War, forcing them into submission. Defeat was simply not a possibility.\n\n\"What's wrong?\"\nA woman's voice came from beside him. Rubbing her tired eyes, she had just woken up—it was his wife.\n\"It's nothing, my dear... Just a bad dream.\"\n\"You're soaked in sweat... Are you really okay?\"\nShe looked at him, concerned.\n\"I'm really fine.\"\n\n*Knock, knock.*\nAt that moment, someone knocked on their door.\n\"I'll get it!\"\nShe started to go, but the man gently grabbed her wrist and stopped her.\nHe shook his head as if it was nothing at all.\n\"No, I'll go.\"\nSaying that, the man opened the front door.\n\nA mailman stood before him, apparently there to deliver a letter.\nThen the mailman spoke:"
 Germany.93.a:0 ""Is this the residence of Mr. Adolf Hitler?""
 Germany.1000.t:0 "Weltkrieg Siegtag"
 Germany.1000.d:0 "Since the end of the Great War on November 11th, 1919, January 18th—the day France surrendered to Germany—has been designated as the anniversary of victory in the Great War. Germany's greatest victory celebration was once Sedan Day, but it has now yielded its place to Siegtag.\n\nFrom Maas to Memel, from Etsch to Belt, veterans and soldiers march through the streets to the rousing tunes of military bands, greeted by cheering crowds. The entire Empire is decorated in black, white, and red flags as citizens celebrate their victory in the war."
 Germany.1000.a:0 "For the Kaiser, for the Vaterland!"