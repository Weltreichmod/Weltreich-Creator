l_english:
 ukraine.1.t:0 "German Economic Aid"
 ukraine.1.d:0 "The Germans have announced they will provide aid to help us overcome our dire economic situation."
 ukraine.1.a:0 "They didn't even care back in 1932..."
 ukraine.2.t:0 "The June Democratic Struggle"
 ukraine.2.d:0 "Unable to endure the hunger and the oppression of the dictatorship, hundreds of thousands of citizens took to the streets across Kyiv, marching to demand democratization and the resignation of the current government. If we remain idle, a far greater crisis may unfold. We must act swiftly to handle this situation."
 ukraine.2.a:0 "Open fire!"
 ukraine.2.b:0 "The age of democracy has arrived..."
 ukraine.3.t:0 "Germany Rejects the Surrender Terms"
 ukraine.3.d:0 "Germany has rejected our conditional surrender. They declared that the war will continue until our nation is completely brought to its knees."
 ukraine.3.a:0 "What the..."
 ukraine.4.t:0 "Crackdown on Democratic Protests in Ukraine"
 ukraine.4.d:0 "As Ukrainian troops and citizens demanding democratization and the regime's resignation stood face to face, soldiers shouted 'Fire!' and opened volley fire into the crowd. The demonstration site instantly turned into chaos, and shot citizens bled to death on the ground. Police and troops arriving later rounded up protesters while brandishing batons. This incident will undoubtedly leave a profound mark on Ukraine."
 ukraine.4.a:0 "The flower of democracy is nourished by blood."
 ukraine.5.t:0 "Civil War in Ukraine!"
 ukraine.5.d:0 "Amidst all the turmoil, the country has finally fractured. The Soviet Ukrainian democratic government in the east and the Ukrainian government in the south have risen against us. This is a horrific catastrophe."
 ukraine.5.a:0 "The agony of fratricidal strife"
 ukraine.6.t:0 "The Military Slips Out of Control"
 ukraine.6.d:0 "Amidst mounting public outrage over the government's violent suppression of protests, countless military units have cut off all communication. The implications of this massive loss of contact are unmistakably clear."
 ukraine.6.a:0 "Fools!"
 ukraine.7.t:0 "Conditional Surrender Accepted"
 ukraine.7.d:0 "Germany has chosen to comply with our request. They have recognized our democratic government, and we have been placed under German protection. Will the day of Ukraine's complete independence ever arrive?"
 ukraine.7.a:0 "Ukraine still lives..."
 ukraine.8.t:0 "Communist Uprising!"
 ukraine.8.d:0 "Last night, contact was re-established with the out-of-touch Eastern Army. They have broken away from us by declaring the establishment of the Ukrainian Soviet Republic."
 ukraine.8.a:0 "This is treason!"
 ukraine.9.t:0 "Democratic Uprising!"
 ukraine.9.d:0 "The democrats have established a breakaway government in southern Ukraine. They claim to be the sole legitimate administration."
 ukraine.9.a:0 "Unacceptable!"
 ukraine.10.t:0 "First Ukrainian Assistance Plan"
 ukraine.10.d:0 "Declaring that it cannot stand by and watch the economy collapse in the aftermath of the famine, the German government has initiated economic assistance."
 ukraine.10.a:0 "Too little, too late."
 ukraine.11.t:0 "Second Ukrainian Assistance Plan"
 ukraine.11.d:0 "Germany has launched a second round of aid to completely eradicate the economic turmoil."
 ukraine.11.a:0 "Do as you please."
 ukraine.12.t:0 "Victory for the Hetmanate!"
 ukraine.12.d:0 "All attempts to overthrow the German-allied Hetman government, with its dreams of democracy and an independent Ukraine, failed. In the face of the mighty German army, the Ukrainian rebels lost their lives and the fervor of the rebellion eventually died down in a gale.\n\nThe leaders of the rebellion were executed for treason and many others were imprisoned. Ukraine's spring seems like it will never come."
 ukraine.12.a:0 "A natural outcome."
 ukraine.13.t:0 "Victory for the Ukrainian Soviet State!"
 ukraine.13.d:0 "The victors of the fierce Ukrainian civil war were the communists. They defeated the powerful Germans who supported the Ukrainian state and won the victory. The fall of German hegemony might have begun. Despite continued German support for the Hetman, the Ukrainian Soviet government, backed by Soviet Russia, gained the final victory in the civil war. The Hetman forces had consistently lost battles due to their complacency and outdated tactics, which ultimately led to their defeat and the loss of their capital.\n\nThe Ukrainian Soviets fell under the protection of Soviet Russia, which led to Germany's fierce criticism of Soviet Russia."
 ukraine.13.a:0 "Understood."
 ukraine.14.t:0 "Victory for the Ukrainian People's Republic!"
 ukraine.14.d:0 "A remarkable thing has happened. In the Ukrainian Civil War, it was not the Hetman government, backed by Germany and Soviet Russia, or the Ukrainian Soviet government, but the Ukrainian People's Republic, backed tenuously by France.\n\nThe generals of the Ukrainian People's Republic used brilliant tactics to devastate the Hetman and Ukrainian Soviet armies, bringing victory to the most unlikely of victors."
 ukraine.14.a:0 "Understood."
 ukraine.15.t:0 "The Galicia-Lodomeria Division"
 ukraine.15.d:0 "Following the collapse of Austria, Galicia-Lodomeria has declared independence, though its territory is claimed by Poland, Ukraine, Bohemia, and Romania. Despite this opportunity for freedom, they lack a functional government. We must partition Galicia and place it under direct rule."
 ukraine.15.a:0 "Let us begin."
 ukraine.16.t:0 "Poland Agrees to the Accord"
 ukraine.16.d:0 "Poland has accepted our proposal. Galicia will now vanish from the map, leaving Poland, Ukraine, Bohemia, and Romania to partition and govern the region."
 ukraine.16.a:0 "A thoroughly expected outcome."
 ukraine.17.t:0 "Poland Rejects the Proposal"
 ukraine.17.d:0 "To our surprise, Poland has rejected our proposal. It seems securing Galicia for ourselves will prove difficult..."
 ukraine.17.a:0 "Incomprehensible."
 ukraine.18.t:0 "Outbreak of the Ukrainian Civil War"
 ukraine.18.d:0 "Recent social fragmentation and successive declarations of independence in Ukraine have finally culminated in civil war. A three-way conflict has erupted between the existing Kingdom of Ukraine, Socialist Ukraine, and the Ukrainian People's Republic, with the German Empire siding with the Kingdom of Ukraine and declaring war. Now that the German Empire has entered the fray, the suppression of the rebellion is all but certain."
 ukraine.18.a:0 "Could there be a twist of fate?"
 ukraine.19.t:0 "Alliance Proposal from [UKR.GetName]"
 ukraine.19.d:0 "Having declared independence from German influence, Ukraine has offered to recognize our government's sovereignty and proposed an alliance. Should we accept this offer, our destiny will be irrevocably altered."
 ukraine.19.a:0 "Yes, we forge our own destiny."
 ukraine.19.b:0 "Too perilous."
 ukraine.20.t:0 "Belarus Joins the Cause"
 ukraine.20.d:0 "Following our persuasion, Belarus has resolved to stand with us against Germany. The future of Eastern Europe shines bright."
 ukraine.20.a:0 "For independence!"
 ukraine.21.t:0 "Betrayal of Belarus"
 ukraine.21.d:0 "Belarus has slipped from our grasp, declaring independence and choosing to align with Ukraine. Our solidarity across Eastern Europe is rapidly crumbling."
 ukraine.21.a:0 "God help us."
 ukraine.22.t:0 "Belarus Refuses"
 ukraine.22.d:0 "Despite our overtures, Belarus has chosen to remain a dependent state of Germany. Our struggle against them must continue."
 ukraine.22.a:0 "Curses!"
 ukraine.23.t:0 "Germany Recognizes Our Independence"
 ukraine.23.d:0 "The German government has formally recognized Ukraine's independent administration. Reluctant to wage a protracted war against us, they arrived at this decision after lengthy deliberation. Ukraine is free at last!"
 ukraine.23.a:0 "Long live Ukraine!"
 ukraine.24.t:0 "Occupation of Chełm"
 ukraine.24.d:0 "With anti-German and Ukrainian forces seizing control across Ukraine, our government has seized the chaos to occupy Chełm. With German assent, our borders will expand beyond their previous limits."
 ukraine.24.a:0 "Chełm is ours!"
 ukraine.25.t:0 "Chełm Occupied"
 ukraine.25.d:0 "Amidst the chaos following the conclusion of the civil war, Poland unlawfully occupied Chełm. A formal diplomatic note of protest was dispatched to Warsaw, but they have yet to respond."
 ukraine.25.a:0 "Those bastards!"