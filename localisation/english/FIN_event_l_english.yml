l_english:
 Finland.1.t:0 "German-Finnish Alliance Proposal"
 Finland.1.d:0 "The German Empire wishes to maintain close relations with our Kingdom of Finland. Securing an alliance with Germany to protect ourselves against the threat of [SOV.GetName] would not be a bad choice."
 Finland.1.a:0 "Very well."
 Finland.1.b:0 "No."
 Finland.2.t:0 "Demand for Karelia"
 Finland.2.d:0 "The Finnish government has planned to annex Karelia and the Kola Peninsula amidst the ongoing war with [SOV.GetName]. Should we emerge victorious in this war, these lands shall become ours."
 Finland.2.a:0 "If we can win, that is."