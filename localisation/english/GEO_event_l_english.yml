 GEO.1.t:0 "German Proposal"
 GEO.1.d:0 "Germany has requested garrison rights within Georgian territory in exchange for protecting us. While this would be sufficient to safeguard us against the threat of [SOV.GetName], it would simultaneously result in our sovereignty being compromised by Germany."
 GEO.1.a:0 "Understood."
 GEO.1.b:0 "Unacceptable."