l_english:
 romania.1.t:0 "German Proposal"
 romania.1.d:0 "Germany wishes for us to participate should they enter into war with Austria. No one can say whether accepting this will bring us gain or harm."
 romania.1.a:0 "Understood."
 romania.1.b:0 "I do not think that would be wise."
 romania.2.t:0 "German-Romanian Guarantee of Mutual Independence"
 romania.2.d:0 "Germany seeks to foster closer relations with us. Friendly ties with Germany, the world's premier power, may yield significant benefits for our nation."
 romania.2.a:0 "Splendid."
 romania.2.b:0 "I am not so certain..."
 romania.3.t:0 "Romanian Faction Request"
 romania.3.d:0 "Romania has requested to enter the war alongside us. Should we accept their proposal, we shall gain another valuable ally."
 romania.3.a:0 "Splendid."
 romania.3.b:0 "No."