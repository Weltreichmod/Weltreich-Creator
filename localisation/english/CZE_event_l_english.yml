l_english:
 bohemia.2.t:0 "Bohemian Independence"
 bohemia.2.d:0 "With the collapse of the Austrian Empire, we have finally secured our independence. Today shall truly be remembered as a historic day."
 bohemia.2.a:0 "For liberty!"
 bohemia.1.t:0 "Demands for the Sudetenland"
 bohemia.1.d:0 "Germany is threatening us to relinquish the Sudetenland, citing that the majority of its population is German. With our meager military forces, the possibility of resisting them is exceedingly slim."
 bohemia.1.a:0 "There is nothing we can do..."
 bohemia.1.b:0 "Fight back!"
 bohemia.3.t:0 "Fate of Bohemia"
 bohemia.3.d:0 "Germany has delivered an ultimatum demanding our annexation, warning that failure to comply will mean war. It appears there is precious little we can do..."
 bohemia.3.a:0 "What a cruel fate."
 bohemia.3.b:0 "Give me liberty, or give me death!"