 india.1.t:0 "Collapse of the British Raj"
 india.1.d:0 "Following the fall of Britain to hostile forces, the British Raj has been plunged into catastrophic chaos. British colonial officials and civilians have initiated a desperate mass exodus, while regions harboring long-standing resentment against imperial rule have erupted into violence, with remaining British populace beaten or murdered.\n\nBeyond anti-British violence, sectarian tensions between Hindus and Muslims have reached a boiling point. Amidst this spiraling unrest, India has fractured into multiple nation-states—the Jewel in the Crown is shattered."
 india.1.a:0 "An inevitable outcome."