 Norway.1.t:0 "German Pressure"
 Norway.1.d:0 "The German Empire insists that our nation must become their protectorate. They have made it clear that failure to accept their proposal will result in war. Whether we can truly stand against such a mighty empire remains uncertain."
 Norway.1.a:0 "There is nothing we can do..."
 Norway.1.b:0 "Fight back!"