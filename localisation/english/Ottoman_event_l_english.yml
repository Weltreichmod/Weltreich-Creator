l_english:
 turkey.1.t:0 "German Proposal"
 turkey.1.d:0 "The German Empire wishes to form an alliance with us once more, just as it did in the Great War. They would prove to be a valuable ally in quelling internal turmoil and fighting against Iran, Greece, Saudi Arabia, and other hostile states."
 turkey.1.a:0 "Is there any reason to reject this proposal?"
 turkey.1.b:0 "The Ottoman Empire stands strong enough on its own."
 turkey.2.t:0 "Baghdad Incident"
 turkey.2.d:0 "Police opened fire on citizens in Baghdad demanding independence at around midnight yesterday. What began as a peaceful demonstration rapidly devolved into bloody chaos following an order to fire. This tragedy has incited fierce outrage among the numerous ethnic minorities across the Ottoman Empire."
 turkey.2.a:0 "Who cares?"
 turkey.3.t:0 "Suspicious Movements Among Minorities"
 turkey.3.d:0 "In the wake of the Baghdad Incident, suspicious movements have been detected among ethnic minorities. While their exact motives remain unclear, their actions bodes ill for the stability of the realm."
 turkey.3.a:0 "Let us wait and see."
 turkey.4.t:0 "Sudden Cessation of Minority Protests"
 turkey.4.d:0 "The persistent demonstrations by ethnic minorities have suddenly ground to a halt. Police and military command are watching these suspicious developments with heightened vigilance. Darker events may well be unfolding in the near future."
 turkey.4.a:0 "What are they preparing for..."
 turkey.5.t:0 "Syrian Uprising"
 turkey.5.d:0 "Yesterday evening, the Syrians formally declared their independence. The southwestern regions of the Ottoman Empire have fallen under their control, and loyal Ottoman subjects residing there have reportedly been brutally slain."
 turkey.5.a:0 "Bastards!"
 turkey.6.t:0 "Hejaz Uprising"
 turkey.6.d:0 "Following Syria's lead, the people of the Hejaz have declared independence. Reports indicate that crowds are marching in celebration, seizing the property of Ottoman citizens and expelling them from the region."
 turkey.6.a:0 "What in the world..."
 turkey.7.t:0 "Kuwaiti Uprising"
 turkey.7.d:0 "Kuwait, previously under British influence, has declared independence from the Ottoman Empire. The wave of minority declarations shows no signs of abating, and the empire appears to be disintegrating."
 turkey.7.a:0 "May God have mercy on us..."
 turkey.8.t:0 "Iraqi Uprising"
 turkey.8.d:0 "Iraq, the site of the recent Baghdad Incident, has also declared its independence. This has severed vast swathes of minority-inhabited territories from the empire. Whether the current crisis will end here remains uncertain."
 turkey.8.a:0 "Is this the end of the Ottoman Empire?"
 turkey.9.t:0 "Kurdish Uprising"
 turkey.9.d:0 "In a surprising turn of events, even the Kurds have declared independence, completely upending prior assumptions that no further secessions would follow after Iraq."
 turkey.9.a:0 "What?"
 turkey.10.t:0 "Establishment of the Sinai Defense Force"
 turkey.10.d:0 "In response to suspicious movements among local minorities, Ottoman garrisons in Sinai have organized an autonomous defense force to secure their positions."
 turkey.10.a:0 "Understood."
 turkey.11.t:0 "The Question of Minority Integration"
 turkey.11.d:0 "Ethnic minorities across the Ottoman Empire have proclaimed independence and established break-away regimes. Our government cannot tolerate such illegal acts of rebellion. Whether we prevail or perish, full-scale war has become unavoidable."
 turkey.11.a:0 "Forward! Onward to victory!"
 turkey.11.b:0 "This is fate. Leave them be."
 turkey.12.t:0 "The Middle East War"
 turkey.12.d:0 "The Ottoman Empire has long suffered from minority unrest, and recent events across the Middle East have culminated in widespread declarations of independence. Refusing to recognize these break-away regimes, the Ottoman government has declared war. The outcome of this struggle will determine whether the empire survives."
 turkey.12.b:0 "What is happening to oil prices?"
 turkey.13.t:0 "Yemen's Rightful Territory"
 turkey.13.d:0 "With the Ottoman Empire plunged into chaos, an ideal opportunity has emerged to reclaim our rightful lands. Let us recover what belongs to Yemen."
 turkey.13.a:0 "Splendid."
 turkey.14.t:0 "Illegal Yemeni Occupation"
 turkey.14.d:0 "Yesterday afternoon, Yemeni forces forcibly seized portions of southern Ottoman territory, taking advantage of current regional turmoil to occupy lands they have long claimed."
 turkey.14.a:0 "That is not our primary concern right now."
 turkey.15.t:0 "Independence of the UAE and Qatar"
 turkey.15.d:0 "Exploiting the chaos engulfing the Ottoman Empire, Qatar and the United Arab Emirates have proclaimed independence. Already consumed by war against major break-away factions, the Ottoman government is unlikely to declare war against them."
 turkey.15.a:0 "Damn it."
 turkey.16.t:0 "Egypt Breaks Free"
 turkey.16.d:0 "The Kingdom of Egypt has slipped from our grasp. Having long enjoyed considerable autonomy, Cairo has seized upon current instability to formally declare total independence."
 turkey.16.a:0 "We are ruined..."
 turkey.17.t:0 "Italy Rejects Surrender Terms"
 turkey.17.d:0 "Italy has rejected our request for conditional surrender, responding that their offensives will continue unceasingly until the Ottoman state is utterly broken. The empire's days appear numbered..."
 turkey.17.a:0 "No!"
 turkey.19.t:0 "1939 Erzincan Earthquake"
 turkey.19.d:0 "At 1:57 AM on 27 December 1939, a devastating earthquake with a moment magnitude of 7.8 Mw and a maximum Mercalli intensity of XII struck Erzincan Province in eastern Anatolia. With 32,968 dead and nearly 100,000 injured, this event marks the most severe natural disaster endured by the Ottoman Empire in the 20th century."
 turkey.19.a:0 "Our deepest condolences."
 turkey.20.t:0 "Hospitalization of Mustafa Kemal"
 turkey.20.d:0 "Years of unceasing stress, heavy smoking, and severe drinking habits have drastically deteriorated the health of Grand Vizier Mustafa Kemal, the man who saved the empire from total ruin. He recently collapsed at his residence.\n\nThough he stubbornly refuses to step down, his condition has rendered him incapable of discharging his official duties. Parliament has already begun quietly vetting potential successors to the office of Grand Vizier."
 turkey.20.a:0 "Let us pray for his swift recovery."
 turkey.21.t:0 "Death of Mustafa Kemal Pasha"
 turkey.21.d:0 "As the Grand Vizier's condition rapidly declined over recent weeks, it became clear that his final hours were at hand. Accepting his fate, he summoned his closest confidants and adoptive daughter, Sabiha, to dictate his last will. Upon placing his signature on the document, official medical bulletins ceased, signaling the end. Flanked by his secretary, three Turkish physicians, and the commander of the Guard, he uttered his final words to Dr. Neşet Ömer: \"Aleyküsselâm\"—Peace be upon you.\n\nAt 9:05 AM, Ghazi and Grand Vizier Mustafa Kemal Pasha breathed his last. Upon hearing the news, his devoted friend Salih rushed into the room, gazed at his patron's body, and stepped outside to shoot himself in the chest.\n\nHis will bequeathed his private property to the party, provided a monthly pension for his sister, and made special provision for the education of İsmet Pasha's children. Furthermore, he formally recommended İsmet as his successor while endorsing Cêlal for party leadership.\n\nParliament promptly declared a national day of mourning, dedicating a joint statement of gratitude to \"Halâskâr Gazi\"—the Savior Ghazi. Warships and civilian vessels alike gathered off his coastal villa, weeping, sounding their horns, and waving Ottoman flags to honor the man forever etched into the empire's history."
 turkey.21.a:0 "Let us weep for the Defender of Gallipoli, the Lion of Antep, and the Ghazi of Maraş!"
 turkey.22.t:0 "New Grand Vizier of the Ottoman Empire"
 turkey.22.d:0 "Amid nationwide mourning for Mustafa Kemal, the government convened to select a new Grand Vizier. The Sultan and Parliament have elected İsmet Pasha to the office. In his maiden address to the assembly, the new Grand Vizier firmly pledged to uphold Kemal's legacy and vision. Though Kemal has passed, his spirit endures."
 turkey.22.d1:0 "Amid nationwide mourning for Mustafa Kemal, the government convened to select a new Grand Vizier. The Sultan and Parliament have elected Celâl Bayar to the office. In his maiden address to the assembly, the new Grand Vizier firmly pledged to uphold Kemal's legacy and vision. Though Kemal has passed, his spirit endures."
 turkey.22.a:0 "May God be with him."
 turkey.23.t:0 "Uprising of Ultra-Nationalists"
 turkey.23.d:0 "Furious over the government's concessions regarding minority autonomy and partial independence, Ottoman ultra-nationalists have launched an armed rebellion against the state."
 turkey.23.a:0 "What?!"
 turkey.23.b:0 "Overthrow the government!"
 turkey.24.t:0 "End of the Middle East War"
 turkey.24.d:0 "The war for Ottoman hegemony and minority self-determination in the Middle East has ended in total defeat for the empire. Forced to yield vast territories to break-away factions, Ottoman presence in the Arab world has effectively been erased, stripping the state of its great-power status in the region."
 turkey.24.a:0 "So it has come to this..."
 turkey.25.t:0 "Ottoman Victory"
 turkey.25.d:0 "Our forces have achieved total victory over the break-away minority factions. Ottoman hegemony across the Middle East has been preserved, securing the empire's future for generations to come."
 turkey.25.a:0 "For the Ottoman Empire!"
 turkey.26.t:0 "German Acceptance"
 turkey.26.d:0 "Germany has accepted our proposal. We can now procure large quantities of infantry equipment without further impediment."
 turkey.26.a:0 "Splendid."
 turkey.27.t:0 "German Refusal"
 turkey.27.d:0 "Germany has rejected our proposal. While their motives remain unclear, it is evident Berlin intends to distance itself from our administration."
 turkey.27.a:0 "Oh..."
 turkey.28.t:0 "French Acceptance"
 turkey.28.d:0 "France has accepted our proposal. We can now secure significant shipments of field artillery without issue."
 turkey.28.a:0 "Splendid."
 turkey.29.t:0 "French Refusal"
 turkey.29.d:0 "France has rejected our proposal. While their motives remain unclear, it is evident Paris intends to distance itself from our administration."
 turkey.29.a:0 "Oh..."
 turkey.30.t:0 "Ottoman Request to Join [FRA.GetFactionName]"
 turkey.30.d:0 "The Ottoman Empire has formally requested to enter into a military alliance with France. Their recent diplomatic warmth toward Paris appears to have been aimed at this very moment."
 turkey.30.a:0 "Welcome, my friend."
 turkey.30.b:0 "We have no need for them."
 turkey.31.t:0 "French Rejection of Entry into [FRA.GetFactionName]"
 turkey.31.d:0 "Despite our diplomatic overtures, France has refused to admit us into their faction. It is now clear that our past policy decisions have left us isolated from both Berlin and Paris."
 turkey.31.a:0 "What?"
 turkey.32.t:0 "Ottoman Request to Join [GER.GetFactionName]"
 turkey.32.d:0 "The Ottoman Empire has requested to conclude a military alliance with Germany. Their favorable stance toward us in recent months has clearly culminated in this proposal."
 turkey.32.a:0 "Welcome, friend."
 turkey.32.b:0 "We have no need for them."
 turkey.33.t:0 "German Rejection of Entry into [GER.GetFactionName]"
 turkey.33.d:0 "Despite active diplomatic efforts, Germany has refused to accept us into their faction. It is now obvious that our past actions have left us abandoned by both Germany and France."
 turkey.33.a:0 "What?!"
 turkey.34.t:0 "Ottoman Demands"
 turkey.34.d:0 "Yesterday evening, the Ottoman Empire issued an ultimatum demanding that our government accept puppet status. War now appears unavoidable."
 turkey.34.a:0 "Persia shall remain independent forever!"
 turkey.34.b:0 "We must accept."
 turkey.35.t:0 "Persian Resistance"
 turkey.35.d:0 "Iran has flatly rejected our ultimate demand. If war is what they desire, our forces shall crush them completely."
 turkey.35.a:0 "Let it begin."
 turkey.36.t:0 "Iran Submits as Ottoman Puppet State"
 turkey.36.d:0 "Unable to withstand Ottoman diplomatic and military pressure, the Iranian government has accepted our ultimatum. Iran is now a puppet state of the Ottoman Empire."
 turkey.36.a:0 "A wise decision."
 turkey.37.t:0 "Surrender of Iran"
 turkey.37.d:0 "Overwhelmed by our firepower and relentless offensives, Iran has requested unconditional surrender. Having triumphed in the Persian campaign, three courses of action have been proposed for processing the territory."
 turkey.37.a:0 "Annex the entire realm."
 turkey.37.b:0 "Annex strategic regions and reduce the remainder to a puppet state."
 turkey.37.c:0 "Establish a puppet state over the entire region."
 turkey.38.t:0 "Ottoman Policy Toward Pakistan"
 turkey.38.d:0 "Pakistan shares our Islamic heritage. We may be able to bring them under our sway without resorting to military force."
 turkey.38.a:0 "Attempt diplomatic conciliation."
 turkey.38.b:0 "War remains the superior solution."
 turkey.39.t:0 "Ottoman Demands"
 turkey.39.d:0 "Yesterday morning, the Ottoman government delivered an ultimatum demanding that our nation submit to their protection. The empire is far superior in strength, rendering victory in battle highly unlikely."
 turkey.39.a:0 "Yield to their demands."
 turkey.39.b:0 "Never!"
 turkey.40.t:0 "Pakistan Submits!"
 turkey.40.d:0 "Unable to withstand our threats, Pakistan has agreed to become an Ottoman protectorate. The pathway to India now lies wide open."
 turkey.40.a:0 "Splendid."
 turkey.41.t:0 "Pakistani Rejection"
 turkey.41.d:0 "Pakistan has rejected our ultimatum, denouncing Ottoman demands as an infringement upon the sovereignty of an independent state."
 turkey.41.a:0 "This means only one thing."
 turkey.42.t:0 "Ottoman Demands on the Gulf"
 turkey.42.d:0 "The Ottoman Empire has demanded the surrender of our Gulf possessions, issuing an ultimatum that threatens war should we refuse to comply."
 turkey.42.a:0 "Tell them to go to hell."
 turkey.42.b:0 "We agree to their terms."
 turkey.43.t:0 "Demands for British Middle East"
 turkey.43.d:0 "Currently at war with Great Britain, we have drafted terms contingent upon our ultimate victory, demanding the total cession of their Middle Eastern territories."
 turkey.43.a:0 "Understood."
 turkey.45.t:0 "Britain Capitulates!"
 turkey.45.d:0 "Unable to sustain the war effort, Britain has agreed to yield the Gulf states to us. Ottoman influence over the Persian Gulf has been fully restored."
 turkey.45.a:0 "Splendid."
 turkey.46.t:0 "British Rejection"
 turkey.46.d:0 "Britain has rejected our ultimatum, condemning our demands as a violation of sovereign rights."
 turkey.46.a:0 "This means only one thing."
 turkey.47.t:0 "Qatar Submits!"
 turkey.47.d:0 "Unable to withstand our pressure, Qatar has agreed to become an Ottoman protectorate, further expanding our sway in the Gulf."
 turkey.47.a:0 "Splendid."
 turkey.48.t:0 "Qatari Rejection"
 turkey.48.d:0 "Qatar has rejected our ultimatum, denouncing Ottoman actions as an infringement upon sovereign independence."
 turkey.48.a:0 "This means only one thing."
 turkey.49.t:0 "Kuwait Submits!"
 turkey.49.d:0 "Unable to withstand our pressure, Kuwait has agreed to become an Ottoman protectorate, further expanding our sway in the Gulf."
 turkey.49.a:0 "Splendid."
 turkey.50.t:0 "Kuwaiti Rejection"
 turkey.50.d:0 "Kuwait has rejected our ultimatum, denouncing Ottoman actions as an infringement upon sovereign independence."
 turkey.50.a:0 "This means only one thing."
 turkey.51.t:0 "Ottoman Financial Request"
 turkey.51.d:0 "The Ottoman Empire has requested financial aid from our government. Extending economic assistance may grant us significant leverage over Constantinople."
 turkey.51.a:0 "Very well. We shall grant it."
 turkey.51.b:0 "Absolutely not."
 turkey.52.t:0 "France Accepts Request"
 turkey.52.d:0 "The French government has accepted our request for economic assistance, providing vital relief to our financial distress."
 turkey.52.a:0 "Good news."
 turkey.53.t:0 "French Refusal"
 turkey.53.d:0 "The French government has ultimately rejected our request for financial assistance. While direct economic aid will not be forthcoming, maintaining our alliance will still yield strategic benefits."
 turkey.53.a:0 "Let us hope so."
 turkey.54.t:0 "Ottoman Request Regarding Egypt"
 turkey.54.d:0 "The recent war in the Middle East severely weakened Ottoman authority over Egypt, allowing Cairo to assert independence. As our allies, the Ottomans seek to reclaim Egypt and have requested our assistance."
 turkey.54.a:0 "Assist them in exerting diplomatic pressure on Egypt."
 turkey.54.b:0 "This is not our concern."
 turkey.55.t:0 "France Agrees"
 turkey.55.d:0 "France has agreed to our proposal, joining us in applying diplomatic pressure on Egypt. Re-establishing control over Egypt is now within our grasp."
 turkey.55.a:0 "Very good."
 turkey.56.t:0 "France Refuses"
 turkey.56.d:0 "Despite our requests, France has declined to join our initiative. Though couched in diplomatic language, it is clear Paris has no intention of intervening in Egyptian affairs."
 turkey.56.a:0 "Disappointing..."
 turkey.57.t:0 "Franco-Ottoman Pressure"
 turkey.57.d:0 "The Ottoman and French governments have delivered a joint ultimatum demanding our immediate submission as an Ottoman puppet state, threatening war should we refuse."
 turkey.57.a:0 "Damn them."
 turkey.57.b:0 "This land belongs to the Egyptians, forever!"
 turkey.58.t:0 "Egypt Submits"
 turkey.58.d:0 "Yielding to joint pressure from our government and France, Egypt has returned to puppet status under Ottoman authority, restoring our influence in North Africa."
 turkey.58.a:0 "Glory to the Empire!"
 turkey.59.t:0 "Egypt Rejects Ultimatum"
 turkey.59.d:0 "Egypt has flatly rejected our ultimatum, declaring that they prefer death to puppet status. War has commenced, and their ultimate fate is sealed."
 turkey.59.a:0 "If war is what they choose..."
 turkey.60.t:0 "Ottoman Warship Procurement Request"
 turkey.60.d:0 "The Ottoman government expressed formal interest yesterday in purchasing warships from our shipyards, offering substantial financial compensation."
 turkey.60.a:0 "We agree."
 turkey.60.b:0 "Absolutely not."
 turkey.61.t:0 "New Warships Delivered!"
 turkey.61.d:0 "[FROM.GetName] accepted our order and completed construction of the naval vessels on schedule. Their technical specialists are arriving at our docks, and payment must now be finalized."
 turkey.61.a:0 "A successful transaction."
 turkey.62.t:0 "Warship Sale Denied"
 turkey.62.d:0 "[FROM.GetName] has declined to sell naval vessels to our government."
 turkey.62.a:0 "Why, though?"
 turkey.63.t:0 "Sinai Restored!"
 turkey.63.d:0 "With the conflict that engulfed the empire concluded in an Ottoman victory, the Sinai Defense Force—originally raised for regional security—has been requested to re-integrate into the national armed forces. Sinai is once again under direct imperial administration."
 turkey.63.a:0 "Welcome home!"
 turkey.64.t:0 "Annexation of Sinai"
 turkey.64.d:0 "With the Ottomans defeated in the Middle East and plunged into severe instability, a unique opportunity has arrived to reclaim the Sinai Peninsula. Let us restore the glory of Egypt!"
 turkey.64.a:0 "For Egypt!"
 turkey.65.t:0 "Egypt Annexes Sinai"
 turkey.65.d:0 "Earlier today, Egypt annexed the Sinai Peninsula, exploiting the Ottoman Empire's defeat and internal collapse in the Middle East. Control of the Suez Canal now rests firmly in Egyptian hands."
 turkey.65.a:0 "And so the Ottoman era ends."
 turkey.66.t:0 "End of the Middle East War"
 turkey.66.d:0 "The protracted struggle across the Middle East has ultimately concluded in an Ottoman victory. The empire has preserved its regional hegemony and brought the break-away minorities back under control. How long this dominance will endure remains uncertain, but immediate collapse has been averted."
 turkey.66.a:0 "So the empire survived after all..."
 turkey.67.t:0 "End of the Middle East War"
 turkey.67.d:0 "The war over Ottoman hegemony and minority self-determination has ended in a partial victory for Constantinople. While imperial forces successfully subdued Iraq and Syria, they failed to crush the remaining break-away factions. The empire defended its core territories but could not prevent wider secessions, leaving lingering tensions that may trigger future uprisings."
 turkey.67.a:0 "So that is how it settled..."
 turkey.68.t:0 "German Alliance Proposal"
 turkey.68.d:0 "Germany wishes to form an alliance with us against Greece. Partnering with Berlin could significantly solidify our strategic standing."
 turkey.68.a:0 "This is how a solid alliance is forged."
 turkey.68.b:0 "No!"
 turkey.69.t:0 "Kemalist Revolution"
 turkey.69.d:0 "Defeat in the Middle East War empowered opposition factions resisting the Sultan's autocratic rule. Led by the Kemalists—the most formidable opposition group—insurgents launched a coup that swiftly captured Constantinople. This morning, Mustafa Fevzi Çakmak formally proclaimed the dissolution of the Ottoman Empire and the establishment of the Republic of Turkey, reshaping the geopolitical landscape of the Near East."
 turkey.69.a:0 "The Era of Turkey."
 turkey.70.t:0 "Fall of the Ottoman Empire"
 turkey.70.d:0 "Military defeat in the Middle East unleashed a massive revolutionary wave against the Ottoman government. Dissatisfied with centralizing imperial policies, Kemalist forces launched an uprising that brought a definitive end to centuries of Ottoman rule. Led by Mustafa Fevzi Çakmak, the Republic of Turkey was officially proclaimed this morning, establishing a new order in the Middle East."
 turkey.70.a:0 "Astonishing news."
 turkey.71.t:0 "Senussi Declaration of Independence"
 turkey.71.d:0 "Shocking news arrived from Ottoman Tripolitania yesterday evening. The Senussi order initiated a widespread uprising across Libya, overthrowing Ottoman authority and establishing the Senussi Kingdom. They have declared complete independence from the empire."
 turkey.71.a:0 "It could not be helped."
 turkey.72.t:0 "Alphabet Reform"
 turkey.72.d:0 "Like many Muslim states, the Ottoman Empire historically utilized the Arabic script despite its inability to accurately represent Turkish vowel sounds. Long regarded as sacrosanct due to its religious origins, Mustafa Kemal deemed the script unsuitable for a modern nation and instituted sweeping reforms. Adopting a modified Latin alphabet tailored to Turkish phonetics, the letters 'Q', 'W', and 'X' were omitted, while new characters such as 'Ç', 'Ş', 'Ğ', 'Ö', and 'Ü' were introduced."
 turkey.72.a:0 "Toward a modern script."
 turkey.73.t:0 "Establishment of National Schools"
 turkey.73.d:0 "Following the alphabet reform, the state established National Schools—intensive four-month public education centers designed to eradicate illiteracy across the populace. Declaring Turkish the sole official language, Mustafa Kemal mandated Turkish-language instruction across public educational institutions throughout the empire."
 turkey.73.a:0 "Reform presses forward."
 turkey.74.t:0 "Abolition of the Madrasas"
 turkey.74.d:0 "Madrasas traditionally served as religious institutions for secondary and higher education across the Islamic world. In a modern secular state, such traditional structures are obsolete. Abolishing this system will ensure religious institutions no longer impede national modernization."
 turkey.74.a:0 "Eradicate the remnants of the past."
 turkey.75.t:0 "Law on Educational Organization"
 turkey.75.d:0 "The national education system has been thoroughly restructured around a secular curriculum under the exclusive authority of the Ministry of National Education. Instruction in foreign schools for Turkish language, history, geography, and philosophy must now be conducted by Turkish staff. Traditional religious subjects such as Tafsir, Hadith, Fiqh, and Kalam have been purged from the curriculum, while primary education has been made free, compulsory, and co-educational."
 turkey.75.a:0 "A new educational order."
 turkey.76.t:0 "University Reform"
 turkey.76.d:0 "Grounded in the intellectual contributions of thinkers like Tevfik Fikret and Ziya Gökalp, higher education has been overhauled to foster independent scientific inquiry. Replacing restrictive traditional structures, autonomous academic institutions—including the Ankara Law School, the Gazi Educational Institute, and the Institute of Agriculture—were founded. Swiss Professor Albert Malche was formally engaged to assist in designing modern university frameworks."
 turkey.76.a:0 "Educational reform accomplished."
 turkey.77.t:0 "Administrative Reorganization"
 turkey.77.d:0 "The state has been restructured into standardized administrative divisions: provinces, districts, sub-districts, and villages. Centrally appointed officials—governors for provinces, district governors for districts, and directors for sub-districts—now administer these units under direct government oversight, ensuring uniform implementation of revolutionary reforms nationwide."
 turkey.77.a:0 "Redraw the administrative map."
 turkey.78.t:0 "Law on the Maintenance of Order (Takrir-i Sükûn)"
 turkey.78.d:0 "Mustafa Kemal enacted the Law on the Maintenance of Order (Takrir-i Sükûn), granting executive authorities broad emergency powers to suppress civil unrest. Mobilized military forces swiftly dispersed insurgent bands and apprehended their leaders, who were tried and sentenced before extraordinary Independence Courts."
 turkey.78.a:0 "Sedition will not be tolerated."
 turkey.79.t:0 "Establishment of the People's Party"
 turkey.79.d:0 "Mustafa Kemal Pasha publicly announced the formation of a unified political organization: the People's Party. He declared that the party's platform rests unshakeably upon the principles of complete national independence and unconditional popular sovereignty, serving as the true representative of the entire nation."
 turkey.79.a:0 "For the people!"
 turkey.80.t:0 "Constitutional Secularism"
 turkey.80.d:0 "Constitutional amendments have codified secularism as an unalterable foundational principle of the state. This legal reform firmly establishes secular governance over administrative and civic life, embedding it as a permanent pillar of political organization."
 turkey.80.a:0 "By the principle of secularism."
 turkey.81.t:0 "Women's Suffrage and Political Rights"
 turkey.81.d:0 "Through sequential legislative enactments, women have been granted full political rights—initially participating in municipal elections and village councils, culminating in constitutional amendments recognizing their right to vote and stand for election to the national parliament."
 turkey.81.a:0 "Political reform accomplished."
 turkey.82.t:0 "The Hat Reform"
 turkey.82.d:0 "The Hat Law was enacted to modernize headwear practices in accordance with Western standards. While practical in nature, replacing the traditional fez—long regarded as a symbol of Islamic identity—with Western-style hats has provoked sharp resistance from traditionalist circles, who view the measure as a departure from religious customs."
 turkey.82.a:0 "Reforms are underway."
 turkey.83.t:0 "Closure of Dervish Lodges and Zawiyas"
 turkey.83.d:0 "Enactment of the Law Concerning the Closure of Dervish Lodges, Zawiyas, and Tombs, and the Abolition of Traditional Titles:\n\nAll religious orders are hereby suppressed, and titles such as Sheikh, Dervish, Disciple, Dede, Seyyid, Çelebi, Baba, Emir, and Caliph are outlawed. Practices associated with fortune-telling, sorcery, and amulet-making are strictly prohibited, alongside the wearing of vestments associated with former religious ranks."
 turkey.83.a:0 "Superstition must be ruthlessly eradicated."
 turkey.84.t:0 "Reform of Calendar, Time, and Weights"
 turkey.84.d:0 "A comprehensive reform replaced traditional Ottoman measurement and timekeeping systems with international standards. The Gregorian calendar replaced traditional calendars, Western numerals replaced Eastern Arabic digits, and the metric system superseded traditional units such as the arşın, dirham, and okka. Standardizing weights, measures, and time has streamlined domestic commerce and foreign trade."
 turkey.84.a:0 "A major step forward."
 turkey.85.t:0 "The Surname Law"
 turkey.85.d:0 "The Surname Law mandates that every citizen adopt a fixed family name, with the given name preceding the surname in official usage. Names that are obscene, absurd, or reference tribal affiliations, foreign nationalities, or former aristocratic titles are strictly prohibited."
 turkey.85.a:0 "All citizens are equal before the law."
 turkey.86.t:0 "Abolition of Titles and Honorifics"
 turkey.86.d:0 "All traditional honorifics, titles, and aristocratic designations have been formally abolished. Henceforth, all citizens shall be addressed solely by their legal names, reinforcing civic equality across society."
 turkey.86.a:0 "Social reform accomplished."
 turkey.87.t:0 "Abolition of the Ministry of Sharia and Endowments"
 turkey.87.d:0 "The Ministry of Sharia and Endowments (Şeriyye ve Evkaf Vekâleti) has been formally dissolved. Separating religious administration from executive governance is essential to securing a secular state order."
 turkey.87.a:0 "Separation of Church and State."
 turkey.88.t:0 "Adoption of a New Constitution"
 turkey.88.d:0 "The constitution of 1876 has become thoroughly obsolete. To modernize state institutions and match European powers, a new constitutional framework must be established."
 turkey.88.a:0 "The Great Reform."
 turkey.89.t:0 "Abolition of the Mecelle"
 turkey.89.d:0 "The Mecelle—the Ottoman civil code drafted under Ahmed Cevdet Pasha between 1868 and 1878 based on Islamic jurisprudence—has been formally repealed. It shall be replaced by a modern secular civil code."
 turkey.89.a:0 "Splendid."
 turkey.90.t:0 "The Turkish Civil Code"
 turkey.90.d:0 "Adapted from the Swiss Civil Code, the new civil law establishes legal gender equality within the family, mandates civil marriage, enforces monogamy, and grants women equal rights regarding inheritance, divorce, and professional employment. Non-religious jurisdiction previously held by religious patriarchates has been completely revoked."
 turkey.90.a:0 "A modern legal code."
 turkey.91.t:0 "The Turkish Penal Code"
 turkey.91.d:0 "Modeled upon the Italian Zanardelli Code, a new penal code has been enacted. The law criminalizes the establishment of organizations aimed at asserting class dominance or undermining the constitutional order."
 turkey.91.a:0 "Constitutional reform accomplished."
 turkey.92.t:0 "Deposition of the Sultan"
 turkey.92.d:0 "Monarchical authority has been permanently abolished. The state will no longer expend resources sustaining an autocratic ruler; the Turkish nation shall govern itself through sovereign institutions."
 turkey.92.a:0 "We have no need for a Sultan."
 turkey.93.t:0 "Revolution in the Ottoman Empire"
 turkey.93.d:0 "Sensational reports arrived from Constantinople today. Forces under Fevzi Pasha, aligned with Kemalist revolutionaries, stormed the imperial palace and forcibly deposed Sultan Abdülmecid II. An interim military administration has been established, announcing the intended transition to a republic.\n\nAbdülmecid II and key imperial officials have been imprisoned in Kostantiniyye, marking the final collapse of the Ottoman monarchy."
 turkey.93.a:0 "For the Republic!"
 turkey.94.t:0 "The Caliphate Question"
 turkey.94.d:0 "While the Sultanate has been abolished, the status of the Caliphate remains unresolved. Maintaining the office could preserve leverage over the broader Islamic world, though retaining it risks creating dual authority within the state."
 turkey.94.a:0 "Retaining the Caliphate ensures influence across the Muslim world."
 turkey.94.b:0 "It creates dangerous dual authority. Abolish the Caliphate!"
 turkey.95.t:0 "Compromise with the Kemalists"
 turkey.95.d:0 "We shall align with Kemalist principles, establishing Turkish as the official language, committing to secular statehood, and maintaining strict adherence to Atatürkish principles."
 turkey.95.a:0 "For a modern society."
 turkey.96.t:0 "Transfer of the Capital to Ankara"
 turkey.96.d:0 "Kostantiniyye served as the imperial capital for centuries. To distance the new regime from the Ottoman past, the capital shall be relocated to Ankara—a central, strategically secure city with a predominantly Turkish population."
 turkey.96.a:0 "A new era begins."
 turkey.97.t:0 "Proclamation of the United Ottoman Empire"
 turkey.97.d:0 "Prime Minister Celâleddin Bayar formally proclaimed the United Ottoman Empire last night. Following Kemalist-inspired reforms, the realm has transformed into a constitutional federal monarchy embracing its diverse ethnicities.\n\nWhile observers continue to question the long-term stability of a multi-ethnic federation, immediate collapse appears to have been averted."
 turkey.97.a:0 "The Sick Man of Europe is no more."
 turkey.98.t:0 "Establishment of the Republic of Turkey"
 turkey.98.d:0 "The Turkish military administration formally proclaimed the founding of the Republic of Turkey this morning. Critics denounce the move as an attempt to distract public attention from failures in the Middle East War, though the junta maintains firm control through military authority."
 turkey.98.a:0 "The regime's final throes."
 turkey.99.t:0 "Establishment of the United States of Turkey"
 turkey.99.d:0 "The Turkish military junta announced the creation of the United States of Turkey today, establishing an authoritarian state centered on Turkic nationalism. Protests by ethnic minorities were forcefully suppressed.\n\nWhile the new union may bring short-term stability, its long-term viability remains highly uncertain."
 turkey.99.a:0 "Will they endure?"
 turkey.100.t:0 "Depoliticization of the Armed Forces"
 turkey.100.d:0 "Political entanglements within the officer corps severely weaken military effectiveness. New regulations must be enacted to enforce strict separation between the armed forces and political office."
 turkey.100.a:0 "Separate the military from politics."
 turkey.101.t:0 "Purge of the Officer Corps"
 turkey.101.d:0 "Kemalist commanders have expressed deep agitation following Mustafa Kemal's removal from executive power. To forestall potential coup plots, suspected officers must be purged from the armed forces immediately."
 turkey.101.a:0 "Purge them from the army."
 turkey.102.t:0 "Suppression of Islamic Fundamentalism"
 turkey.102.d:0 "Following Fevzi Pasha's coup, the military administration executed a sweeping crackdown on fundamentalist factions, crushing organized religious opposition. The armed forces intend to maintain strict controls to safeguard the secular character of the state."
 turkey.102.a:0 "Lay the groundwork for reform."
 turkey.103.t:0 "Turkish Territorial Demands"
 turkey.103.d:0 "The Turkish government has demanded the surrender of our northern border provinces. Having reorganized their military following the Middle East War, resisting their demands risks plunging us into a war we may well lose."
 turkey.103.a:0 "Do they truly believe another war will alter the outcome?"
 turkey.103.b:0 "We have no choice. Cede a portion of the land."
 turkey.104.t:0 "Government of [FROM.GetName] Refuses"
 turkey.104.d:0 "The government of [FROM.GetName] has refused to surrender any territory. Only one method remains to resolve this dispute."
 turkey.104.a:0 "Crush them!"
 turkey.105.t:0 "Government of [FROM.GetName] Submits"
 turkey.105.d:0 "The government of [FROM.GetName] has yielded to our demands, agreeing to cede the requested territories. Turkey shall rise again!"
 turkey.105.a:0 "Long live Turkey!"
 turkey.106.t:0 "Turkish Demands Regarding Cyprus"
 turkey.106.d:0 "The Turkish government has formally requested the transfer of Cyprus, offering financial compensation and diplomatic concessions in return."
 turkey.106.a:0 "The island is of vital strategic importance to us."
 turkey.106.b:0 "A fine proposal."
 turkey.107.t:0 "Government of [FROM.GetName] Refuses"
 turkey.107.d:0 "The government of [FROM.GetName] has rejected our request. We must now decide whether to declare war or abandon our claims to Cyprus."
 turkey.107.a:0 "Crush them!"
 turkey.107.b:0 "The island is not worth a war."
 turkey.108.t:0 "Government of [FROM.GetName] Accepts Request"
 turkey.108.d:0 "The government of [FROM.GetName] has agreed to transfer Cyprus to us in exchange for economic concessions. Cyprus is now Turkish territory."
 turkey.108.a:0 "Long live Turkey!"
 turkey.109.t:0 "Baghdad Incident"
 turkey.109.d:0 "In Baghdad around midnight, Ottoman troops opened fire on demonstrators—predominantly Kurds and Shia—demanding regional autonomy. What began as a peaceful assembly quickly turned into a bloody conflict, leaving dozens dead or wounded. Hospitals are overwhelmed, and communications have been severed.\n\nInternational observers view the event as part of a wider pattern of imperial repression. Solidarity protests have erupted across Syria, Hejaz, Armenia, and Kurdistan. Though the government promised an official inquiry, calls for self-determination continue to grow, threatening to destabilize the Near East."
 turkey.109.a:0 "I believe something similar occurred in Russia long ago..."
 turkey.1000.t:0 "Syrian Minority Demonstrations"
 turkey.1000.d:0 "Syrian minorities have launched protests demanding expanded rights and self-determination, with several demonstrations turning violent before being dispersed by police."
 turkey.1000.a:0 "Suppress them!"
