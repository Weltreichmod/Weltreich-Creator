 SUBDOCTRINE_Corps_francs: "Corps Francs"
 SUBDOCTRINE_Corps_francs_DESC: "Originating organically on the frontlines during the Great War, the Corps Francs initially focused on systematic nighttime infiltrations to secure enemy prisoners before gradually taking on large-scale surprise attacks. By gathering intelligence on the ground, conducting raids, and cooperating closely with regular infantry, the Corps Francs will facilitate the transfer of combat experience and boost overall morale."
