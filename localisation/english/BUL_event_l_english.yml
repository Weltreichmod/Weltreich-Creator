l_english:
 bulgaria.1.t:0 "German Request"
 bulgaria.1.d:0 "Germany has requested an alliance with us. This alliance could potentially elevate us to the dominant power in the Balkans."
 bulgaria.1.a:0 "A good idea."
 bulgaria.1.b:0 "No, we have no need for them."
 bulgaria.2.t:0 "Austrian Military Aid"
 bulgaria.2.d:0 "Austria wishes to foster closer ties with our government. Perhaps we can build a favorable relationship with them."
 bulgaria.2.a:0 "Obtain field artillery"
 bulgaria.2.b:0 "Obtain small arms"
 bulgaria.3.t:0 "Surrender Request Rejected"
 bulgaria.3.d:0 "The Austrian Empire has informed us that it is too late and that the fighting will continue. Perhaps Bulgaria may not survive..."
 bulgaria.3.a:0 "Is this the end of Bulgaria?"
 bulgaria.4.t:0 "Macedonian Uprising"
 bulgaria.4.d:0 "Yesterday evening, demonstrations demanding autonomy erupted across Macedonia. Some of them demanded full independence, and violent clashes broke out in several areas. While protests surrounding Macedonian independence and autonomy have occurred steadily over the past decades, this marks the first time they have spread simultaneously on such a massive scale, and the flames of unrest continue to spread rapidly."
 bulgaria.4.a:0 "What?"
 bulgaria.5.t:0 "Emergency Session of Parliament"
 bulgaria.5.d.a:0 "An emergency session of Parliament was convened today regarding the situation in Macedonia. Each political faction expressed differing stances on the current crisis. Ultimately, however, a resolution was passed to deploy police forces to Macedonia to suppress the riots, and it appears the current unrest will be quelled in short order."
 bulgaria.5.d.b:0 "An emergency session of Parliament was convened today regarding the situation in Macedonia. Each political faction expressed differing stances on the current crisis. Ultimately, however, it was decided to grant some of the protesters' demands, and discussions regarding a Macedonian Autonomy Act have already reportedly begun. This decision is expected to ease the unrest in Macedonia."
 bulgaria.5.a:0 "Take a hardline stance against them!"
 bulgaria.5.b:0 "Let us attempt to negotiate."
 bulgaria.6.t:0 "Macedonian Riots Successfully Suppressed"
 bulgaria.6.d:0 "The large-scale riots in Macedonia that persisted over the past few weeks have been forcefully put down by Bulgarian police and military forces. The chaotic society has begun to settle, firmly establishing that the Bulgarian government has no intention of ceding to the demands of the Macedonians."
 bulgaria.6.a:0 "Things should remain quiet for the time being."
 bulgaria.7.t:0 "A General's Discontent"
 bulgaria.7.d:0 "The Bulgarian general, Kimon Georgiev, harbored intense dissatisfaction over the recent decision made in Parliament. Negotiating with the Macedonians was something that should never happen—an act that tarnished the honor of Bulgaria. He sought to confront the Prime Minister directly over this matter.\n\"Listen to me, Prime Minister! I cannot accept this outcome. You know full well that Macedonia is nothing less than our rightful territory!\"\nTo his heated protest, the Prime Minister reacted as follows:"
 bulgaria.7.a:0 "He coaxed him and sent him away."
 bulgaria.7.b:0 "He drove him out."
 bulgaria.8.t:0 "Negotiations Concluded Successfully"
 bulgaria.8.d:0 "The Bulgarian government's efforts to address the recent Macedonian riots through negotiations have borne fruit. Bulgaria pledged to grant broad autonomy to Macedonia, and starting with these talks, disorder in the Macedonian region has significantly diminished."
 bulgaria.8.a:0 "Let them raise their glasses for now."
 bulgaria.9.t:0 "Zveno Coup d'État"
 bulgaria.9.d:0 "Yesterday evening, a coup d'état by Zveno took place. They seized control of the Bulgarian Parliament in an instant, and the Prime Minister of Bulgaria has gone missing. Zveno declared the dissolution of Parliament and convened an authoritarian temporary assembly to enact martial law. With this, Bulgarian democracy has been driven entirely to its death."
 bulgaria.9.a:0 "Victory for Zveno."
 bulgaria.10.t:0 "Preparations for the 1939 Parliamentary Election"
 bulgaria.10.d:0 "With approximately 100 days remaining until the 1939 parliamentary election, various political factions have begun campaigning, turning every region of Bulgaria into a battleground for political influence. The actions of each faction over the next 100 days will shape the outcome of the election."
 bulgaria.10.a:0 "The game has already begun."
 bulgaria.11.t:0 "Time Remaining Until the Election"
 bulgaria.11.d:0 "Three years from now, the results of the parliamentary election will heavily influence Bulgarian politics. We must prepare in advance. There are three major parties expected to contend for victory: the democratic Agrarian National Union, the authoritarian military faction Zveno, and the Royalist loyalists who currently hold the greatest sway in Parliament. We must choose one among these three."
 bulgaria.11.a:0 "The Royalists"
 bulgaria.11.b:0 "Agrarian National Union"
 bulgaria.11.c:0 "Zveno"
 bulgaria.12.t:0 "1939 Parliamentary Election"
 bulgaria.12.d:0 "Yesterday, the 1939 parliamentary election was held, with countless citizens participating in the vote across Bulgaria. The results of this election will exert a profound impact on Bulgarian politics and may drastically alter the nation's future. The election results were finalized early this morning, and the victor is..."
 bulgaria.12.a:0 "Victory for the Royalists"
 bulgaria.12.b:0 "Victory for the Agrarian National Union"
 bulgaria.12.c:0 "Victory for Zveno"
 bulgaria.13.t:0 "[FROM.GetName] Requests Surrender"
 bulgaria.13.d:0 "Unable to withstand the Bulgarian offensive, [FROM.GetName] suffered continuous defeats and has ultimately raised the white flag. Accepting their request will spare our soldiers from shedding any more blood."
 bulgaria.13.a:0 "Very well."
 bulgaria.13.b:0 "No."
 bulgaria.14.t:0 "[BUL.GetName] Requests Alliance"
 bulgaria.14.d:0 "The Bulgarian government has dispatched a document expressing its wish to form a formal alliance with us. An alliance with them carries a high probability of turning Greece into an adversary; however, it will simultaneously expand our influence over the Balkans."
 bulgaria.14.a:0 "A good idea."
 bulgaria.14.b:0 "Unacceptable."
 bulgaria.15.t:0 "[BUL.GetName] Joins [GER.GetFactionName]"
 bulgaria.15.d:0 "[BUL.GetName] and [GER.GetName] are now officially allied. France and its allies are reacting with great sensitivity to this alliance. The two nations have maintained close ties recently, and as of yesterday, [BUL.GetName] has officially joined [GER.GetFactionName]."
 bulgaria.15.a:0 "Understood."
 bulgaria.16.t:0 "[BUL.GetName] Joins [FRA.GetFactionName]"
 bulgaria.16.d:0 "[BUL.GetName] and [FRA.GetName] are now officially allied. The German Empire and its allies are reacting with great sensitivity to this alliance. The two nations have maintained close ties recently, and as of yesterday, [BUL.GetName] has officially joined [FRA.GetFactionName]."
 bulgaria.16.a:0 "Understood."
 bulgaria.17.t:0 "[FROM.GetName] Refuses"
 bulgaria.17.d:0 "The government of [FROM.GetName] has formally rejected our request. It appears their objectives differ from ours. We may have to stand alone."
 bulgaria.17.a:0 "Incomprehensible."
 bulgaria.18.t:0 "Demise of Ferdinand I"
 bulgaria.18.d:0 "Tsar Ferdinand I—who once led Bulgaria to victory in the Balkan Wars and secured vast territories to solidify the nation's glory—passed away yesterday at around 9:00 AM. Countless mourners have gathered to grieve the Tsar's passing, and the Bulgarian royal family remains shrouded in gloom. Following his death, Crown Prince Boris III will become the new King of Bulgaria."
 bulgaria.18.a:0 "A new era for Bulgaria."
 bulgaria.19.t:0 "Mass Socialist Demonstrations"
 bulgaria.19.d:0 "Numerous communist organizations backed by the Bulgarian Social Democratic Workers' Party held nationwide protests demanding the Prime Minister's resignation and holding the current government accountable for the defeat in war. The current situation threatens to escalate even further. We must take action."
 bulgaria.19.a:0 "Mobilize police forces to prevent the protests from spreading."
 bulgaria.19.b:0 "Suppress them with utmost severity."
 bulgaria.20.t:0 "Bulgarian Communist Coup"
 bulgaria.20.d:0 "The government's brutal crackdown on socialist protesters turned public sentiment completely against the regime, ultimately leading to its overthrow through a coup d'état by communists and socialists. The communists convened a provisional cabinet and proclaimed the Bulgarian People's Republic. With the abdication of the Tsar and the abolition of the class system already declared, further radical reforms are expected to follow continuously."
 bulgaria.20.a:0 "The Red Republic of Bulgaria."
 bulgaria.21.t:0 "Discussions on the Sovietization of the Balkans"
 bulgaria.21.d:0 "Lively debates took place in Parliament today regarding methods to spread communism throughout the Balkans. As a result, two strategies emerged: forming an alliance with another communist power, or securing the Sovietization of the Balkans through Bulgaria's sole efforts. Our decision is..."
 bulgaria.21.a:0 "Form an alliance with a major power."
 bulgaria.21.b:0 "Secure victory through our own strength."
 bulgaria.21.c:0 "The time is not yet ripe. Build our strength."
 bulgaria.22.t:0 "[BUL.GetName] Joins [SOV.GetFactionName]"
 bulgaria.22.d:0 "[BUL.GetName] and [SOV.GetName] are now officially allied. Germany, France, and their allies are reacting with great sensitivity to this alliance. The two nations have maintained close ties recently, and as of yesterday, [BUL.GetName] has officially joined [SOV.GetFactionName]."
 bulgaria.22.a:0 "Understood."
 bulgaria.23.t:0 "Bulgaria Demands Thessaloniki"
 bulgaria.23.d:0 "Bulgaria made an absurd demand of us yesterday. They threatened us to relinquish Thessaloniki, warning that failure to do so would result in a declaration of war."
 bulgaria.23.a:0 "We retreat for now... for now..."
 bulgaria.23.b:0 "Then war it is."
 bulgaria.24.t:0 "Greece Refuses"
 bulgaria.24.d:0 "The Greek government has rejected our demands. They expressed a willingness to wage war, replying that not an inch of land will be surrendered, even if blood must be spilled."
 bulgaria.24.a:0 "If that is what they wish..."
 bulgaria.25.t:0 "Greece Agrees"
 bulgaria.25.d:0 "The Greek government has accepted our demands. Wishing to avoid war, they agreed to hand over Thessaloniki without requesting anything in return."
 bulgaria.25.a:0 "Long live Bulgaria!"
 bulgaria.26.t:0 "Establishment of Yugoslavia"
 bulgaria.26.d:0 "Bulgaria waged a series of major battles to secure hegemony over the Balkan Peninsula and ultimately emerged victorious. Today, the establishment of the Kingdom of Yugoslavia—comprising Croats, Serbs, Slovenes, and Bulgarians—was officially proclaimed in Sofia. This new state encompasses most of the Balkans, and it remains to be seen how this dramatic change will alter the region."
 bulgaria.26.a:0 "The day of Bulgaria's final victory."
 bulgaria.27.t:0 "Austrian Request for Conditional Surrender"
 bulgaria.27.d:0 "The Austrian Empire suffered a crushing defeat against Greece, and thanks to the high morale of the Bulgarian forces, we easily breached their defenses. Consequently, the Austrian Empire offered terms of surrender, demonstrating to the world which power holds the upper hand."
 bulgaria.27.a:0 "We have triumphed!"
 bulgaria.27.b:0 "No, we have no need for it."
 bulgaria.28.t:0 "Bulgaria Rejects Our Surrender Request"
 bulgaria.28.d:0 "The Bulgarian government declared that the fighting will continue and that only the total destruction of the Austrian Empire will end this war. All that remains now is to await this grim outcome."
 bulgaria.28.a:0 "No!"
 bulgaria.29.t:0 "Macedonian Uprising"
 bulgaria.29.d:0 "A large-scale uprising erupted in the Macedonian region of Bulgaria as calls for expanded autonomy and independence in certain areas grew stronger. While the demonstrations initially began peacefully, they turned violent following a harsh crackdown by the government. Armed clashes occurred in several areas, with casualties reported.\n\nAlthough the Bulgarian government deployed military forces, the protests continue to spread, and anti-government sentiment among ethnic Macedonians reaches new heights. As hostilities escalate, fears are rising that this crisis could trigger regional instability across the Balkans, and the international community is closely watching the Sofia government's next move."
 bulgaria.29.a:0 "How will Bulgaria manage this crisis?"
 bulgaria.30.t:0 "Fruits of Negotiation"
 bulgaria.30.d:0 "Just days ago, Macedonia was engulfed in chaos due to fierce protests and clashes with government forces. However, the situation has now shifted dramatically. The Bulgarian government and local Macedonian leaders have reached an agreement to expand autonomy. Including enhanced political rights, guarantees of cultural identity, and the devolution of local administrative authority, this accord is evaluated as a significant step forward in easing tensions, even if it does not address every grievance. Most demonstrations have now dispersed, and the international community has responded positively to Bulgaria's diplomatic resolution. Nevertheless, extremist elements remain, leaving long-term peace uncertain."
 bulgaria.30.a:0 "Tensions have eased, but true peace remains far off."
 bulgaria.31.t:0 "Macedonian Uprising Suppressed"
 bulgaria.31.d:0 "Following weeks of intense unrest, the Bulgarian government announced that the Macedonian uprising has been successfully suppressed. Deploying police and military personnel, the government forcefully quelled the protests, and order has been largely restored throughout the region.\n\nMany local leaders have been arrested or forced into hiding, and the Sofia government made it clear that no concessions will be granted regarding autonomy or independence. While a calm demeanor currently prevails, discontent among ethnic Macedonians remains latent."
 bulgaria.31.a:0 "The region will remain quiet for the time being."