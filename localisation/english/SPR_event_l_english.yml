l_english:
 spain.1.t:0 "Demand from France"
 spain.1.d:0 "France has declared that unless Catalonia is handed over to them within a week, they will not hesitate to go to war. With the general election just around the corner, whatever choice we make will shake Spanish politics to its core."
 spain.1.a:0 "Accept their demands."
 spain.1.b:0 "Tell them: 'Let the war begin!'"
 spain.2.t:0 "Results of the 1936 General Election"
 spain.2.d:0 "The 1936 general election in Spain has resulted in a victory for the Popular Front. While the vote margin between the Spanish right and left was narrow, the parliament is now firmly under leftist control. The new government's attempts at radical reform are rapidly stoking the grievances of the right-wing forces."
 spain.2.a:0 "This may well be the seed of a massive conflict."
 spain.3.t:0 "Broad Reforms"
 spain.3.d:0 "To appease our supporters, we will implement radical and swift reforms. It is imperative that we suppress the right-wing before these reforms take effect."
 spain.3.a:0 "Shall we begin?"
 spain.4.t:0 "Purging Right-Wing Figures"
 spain.4.d:0 "We have successfully sidelined those who posed a threat to the regime. Now, we can secure our position and continue our reforms."
 spain.4.a:0 "Now we are safe... aren't we?"
 spain.5.t:0 "Civil War!"
 spain.5.d:0 "A formidable faction of military generals has launched an uprising, fiercely denouncing the current Spanish government! Backed by conservative monarchists and the clergy, they have initiated a right-wing coup. A significant portion of the military has sided with the Nationalists, yet they have failed to capture any major Spanish city aside from Seville.\n\nMeanwhile, leftist volunteers are flocking to the Republican government's banner, ready to aid in crushing the rebellion. Though the loyalists may lack proper training, no one can question their zeal.\n\nThe battlelines are drawn. Which faction shall we support?"
 spain.5.a:0 "The Nationalists!"
 spain.5.b:0 "The Republicans!"
 spain.6.t:0 "The Spanish Civil War"
 spain.6.d:0 "Civil war has erupted in Spain! Several generals seeking to overthrow the government in Madrid have risen in revolt, drawing the support of a large segment of the Spanish armed forces.\n\nThis right-wing Nationalist faction has seized control of a vast portion of Spanish territory, including overseas holdings.\nUnder the left-wing Republican government, loyalist troops and volunteers have rallied, resolved to fight this rebellion to the bitter end.\n\nThe war for Spain has begun."
 spain.6.a:0 "What fate awaits Spain?"
 spain.6.b:0 "To victory!"
 spain.7.t:0 "End of the Spanish Civil War"
 spain.7.d:0 "With the surrender of the final Republican stronghold, the Spanish Civil War has come to an end.\n\nThe Nationalists have triumphed, and a new era dawns for Spain.\n\nRavaged and battered by war, the nation faces a daunting task of reconstruction."
 spain.7.a:1 "An intriguing turn of events."
 spain.7.b:0 "Now, let us heal our nation's wounds."
 spain.8.t:0 "End of the Spanish Civil War"
 spain.8.d:0 "With the surrender of the final Nationalist forces, the Spanish Civil War has come to an end.\n\nThe Republicans have triumphed, and a new era dawns for Spain.\n\nRavaged and battered by war, the nation faces a daunting task of reconstruction."