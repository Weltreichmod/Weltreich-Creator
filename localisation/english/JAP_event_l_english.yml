l_english:
 japan_wr.1.t:0 "February 26 Incident"
 japan_wr.1.d:0 "Early this morning, the Kodoha faction and young army officers executed a coup d'état. The ongoing purges of the Kodoha since 1935 and the dismissal of Jinzaburō Masaki served as the primary catalysts, resulting in the successful assassinations of Prime Minister Inukai Tsuyoshi, Takahashi Korekiyo, and Jōtarō Watanabe. The insurgents claim that the Emperor should rule Japan directly as sole head of state and are currently attempting to seize complete control of the government."
 japan_wr.1.a:0 "The Emperor expressed severe displeasure with their actions."
 japan_wr.1.b:0 "The Emperor granted them his support."
 japan_wr.2.t:0 "1936 Japanese General Election"
 japan_wr.2.d:0 "The 1936 Japanese general election resulted in the Rikken Minseito becoming the primary party in the Diet, securing 205 seats against the Rikken Seiyukai's 175. Since the incumbent Prime Minister hails from the Rikken Seiyukai, observers anticipate that political instability may intensify."
 japan_wr.2.a:0 "Understood."
 japan_wr.3.t:0 "Dissolution of the Imperial Diet"
 japan_wr.3.d:0 "Having seized control of the state, the Kodoha faction dissolved the sitting Diet, declaring it utterly corrupt. Given their political stance, it appears certain that any new assembly will function merely as a rubber stamp for the regime."
 japan_wr.3.a:0 "Democracy is dead."
 japan_wr.4.t:0 "The New Diet"
 japan_wr.4.d:0 "A new government structure was formally unveiled under the authority of the Emperor and the Kodoha. Foreign nations quickly condemned the new administration as a mere instrument of imperial decree, while Kodoha leaders celebrated the triumph of their restorative vision."
 japan_wr.4.a:0 "Tenno Heika Banzai!"
 japan_wr.5.t:0 "Zaibatsu Dissolution Bears Fruit"
 japan_wr.5.d:0 "The long and arduous efforts to dismantle the zaibatsu conglomerates are finally yielding visible results. The national economy, once dictated by financial cliques, has entered a phase of stabilization that promises substantial benefits to the state."
 japan_wr.5.a:0 "Victory!"
 japan_wr.6.t:0 "Before the Window"
 japan_wr.6.d:0 "Ikki Kita, long regarded as the spiritual mentor of the Kodoha, has been appointed Prime Minister of the Empire of Japan. While many within the faction expected him to clear the path for direct imperial rule, his true intentions have diverged sharply. Kita envisions an emperor devoted solely to the populace, aiming to abolish the Meiji Constitution and establish a new national-socialist order."
 japan_wr.6.a:0 "Conflict is inevitable."
 japan_wr.7.t:0 "Japanese Pact Proposal"
 japan_wr.7.d:0 "Yesterday, the Japanese ambassador delivered a confidential proposal requesting military transit rights through our territory in preparation for a potential war with Russia. Should we accept this pact, the Fengtian border risks becoming a primary battleground in any future conflict."
 japan_wr.7.a:0 "I wonder if we truly have a choice."
 japan_wr.7.b:0 "Politely decline."
 japan_wr.8.t:0 "Pact Concluded"
 japan_wr.8.d:0 "Fengtian has ultimately accepted our demands. This agreement will prove invaluable should conflict erupt with Russia."
 japan_wr.8.a:0 "Yoshi! (Excellent!)"
 japan_wr.9.t:0 "Proposal Rejected"
 japan_wr.9.d:0 "Fengtian has rejected our proposal, stating they have no desire to become entangled in any potential war between Japan and Russia."
 japan_wr.9.a:0 "We shall enforce our will by strength of arms if necessary."
 japan_wr.9.b:0 "It cannot be helped."
 japan_wr.10.t:0 "Appointment of a New Prime Minister"
 japan_wr.10.d:0 "Following the tragic assassination of Prime Minister Inukai during the recent crisis, a successor must be appointed to lead the Cabinet."
 japan_wr.10.a:0 "Keisuke Okada shall assume the office of Prime Minister."
 japan_wr.10.b:0 "Fumimaro Konoe shall assume the office of Prime Minister."
 japan_wr.11.t:0 "Non-Aggression Pact with [From.GetNameDef]"
 japan_wr.11.desc:0 "Despite recent escalations in tension between [From.GetAdjective] and [Root.GetNameDef], the [From.GetAdjective] government has now expressed willingness to negotiate a Non-Aggression Pact. While the strategic advantages to our nation are obvious, we must carefully consider what benefits this yields for [From.GetAdjective], and whether we will come to regret this decision."
 japan_wr.11.a:0 "We must secure peace... for now."
 japan_wr.11.b:0 "Denying them any strategic advantage must take precedence!"
 japan_wr.12.t:0 "[From.GetNameDefCap] Accepts Non-Aggression Pact"
 japan_wr.12.desc:0 "[From.GetNameDefCap] has formally accepted our proposal for a Non-Aggression Pact."
 japan_wr.12.a:0 "They have played directly into our hands."
 japan_wr.13.t:0 "[From.GetNameDefCap] Rejects Non-Aggression Pact"
 japan_wr.13.desc:0 "For reasons of their own, [From.GetNameDef] has rejected our proposal for a Non-Aggression Pact."
 japan_wr.13.a:0 "Are they plotting against us?"
 japan_wr.14.t:0 "Economic Recovery"
 japan_wr.14.desc:0 "Our economic policies have proven successful. Financial conditions across Japan have stabilized, and future economic prospects appear remarkably strong."
 japan_wr.14.a:0 "Our efforts were not in vain."
 japan_wr.15.t:0 "Mukden Incident"
 japan_wr.15.d:0 "Shocking news arrived from East Asia this morning. The Empire of Japan launched an unprovoked invasion against the Fengtian government without a formal declaration of war, and heavy fighting is now reported across Manchuria. Analysts overwhelmingly predict a swift Japanese victory. Having long cited the Fengtian clique's insubordination as a justification for military pressure, Tokyo has finally escalated the crisis into open warfare."
 japan_wr.15.a:0 "Japanese imperialism erupts into war!"
 japan_wr.15.b:0 "Savages!"
 japan_wr.15.c:0 "For the Empire!"
 japan_wr.16.t:0 "Fall of the Fengtian Government"
 japan_wr.16.d:0 "Unable to withstand the superior technology and tactics of the Imperial Japanese Armed Forces, Fengtian troops suffered continuous defeats and were ultimately driven from Manchuria. Preparations are now underway to establish a loyal puppet administration in the region."
 japan_wr.16.a:0 "Manchuria belongs to us now."
 japan_wr.17.t:0 "Japan Demands War Participation"
 japan_wr.17.d:0 "Japan has entered full-scale hostilities with Russia and is demanding that we fulfill our obligations under our prior accord. Blood will soon spill along the Manchurian-Russian border."
 japan_wr.17.a:0 "As they wish..."
 japan_wr.18.t:0 "Fall of [SOV.GetName]"
 japan_wr.18.d:0 "Following an extended campaign, we have achieved total victory over [SOV.GetName]. The Far East and Primorsky Krai have been liberated under Japanese oversight and will now serve as loyal protectorates of the Empire."
 japan_wr.18.a:0 "Banzai!"
 japan_wr.19.t:0 "Fall of Russia"
 japan_wr.19.d:0 "Following an extended campaign, we have achieved total victory over Russia. The Far East and Primorsky Krai have been liberated under Japanese oversight and will now serve as loyal protectorates of the Empire."
 japan_wr.19.a:0 "Banzai!"
 japan_wr.20.t:0 "Japan Proposes an Alliance"
 japan_wr.20.d:0 "In preparation for the impending invasion of the Kuomintang, Japan secretly dispatched a diplomatic mission proposing a joint military alliance to partition China between our two nations."
 japan_wr.20.a:0 "We accept."
 japan_wr.20.b:0 "We refuse."
 japan_wr.21.t:0 "Fengtian Accepts Our Proposal"
 japan_wr.21.d:0 "The Fengtian clique has accepted our proposal. Together, we shall partition China, ensuring the total collapse of the Kuomintang."
 japan_wr.21.a:0 "Forward!"
 japan_wr.22.t:0 "Fengtian Rejects Our Proposal"
 japan_wr.22.d:0 "The Fengtian clique has rejected our proposal, refusing to cooperate in defeating the Kuomintang and declaring their intent to pursue an independent path."
 japan_wr.22.a:0 "Do they wish to be conquered as well?"
 japan_wr.23.t:0 "Japanese Demands for Indochina"
 japan_wr.23.d:0 "Japan has issued a ultimatum demanding the surrender of French Indochina and our Pacific island territories, threatening immediate military action should we refuse to comply."
 japan_wr.23.a:0 "Tell them to go to hell."
 japan_wr.23.b:0 "We have no choice. Accept their terms."
 japan_wr.24.t:0 "[FROM.GetNameDefCap] Rejects Demands"
 japan_wr.24.d:0 "[From.GetNameDef] has rejected our ultimatum, firmly declaring that they will never yield Indochina and expressing total readiness for war."
 japan_wr.24.a:0 "So be it. It is war."
 japan_wr.25.t:0 "[FROM.GetNameDefCap] Submits"
 japan_wr.25.d:0 "[From.GetNameDef] has acquiesced to our demands. Indochina and its strategic Pacific island territories are now firmly under Japanese control."
 japan_wr.25.a:0 "For Japan!"
 japan_wr.26.t:0 "Japan Demands Transit Rights"
 japan_wr.26.d:0 "Japan has demanded military transit rights through our territory to facilitate their campaign toward the Malay Peninsula, threatening war should we refuse access to our infrastructure and resources."
 japan_wr.26.a:0 "We comply."
 japan_wr.26.b:0 "We refuse."
 japan_wr.27.t:0 "Siam Approves Demands"
 japan_wr.27.d:0 "Siam has accepted our demands, granting full access to their rail and road networks. This transit access represents a major milestone in our drive to secure the Malay Peninsula."
 japan_wr.27.a:0 "Forward!"
 japan_wr.28.t:0 "Siam Rejects Demands"
 japan_wr.28.d:0 "Siam has rejected our demands, refusing to permit transit through their territory and declaring their intent to maintain strict sovereignty."
 japan_wr.28.a:0 "Only one response remains."
 japan_wr.29.t:0 "Japanese Diplomatic Overtures"
 japan_wr.29.d:0 "The Japanese government has formally requested an easing of diplomatic and economic sanctions against their nation. With hostilities ongoing in China, Tokyo seeks a pact of friendship and mutual non-aggression to secure its rear and sustain its war effort."
 japan_wr.29.a:0 "We shall grant their request."
 japan_wr.29.b:0 "Absurd. Refuse them."
 japan_wr.30.t:0 "United States Accepts Proposal"
 japan_wr.30.d:0 "The United States has accepted our proposal, lifting all active trade restrictions and economic sanctions. Relations between Tokyo and Washington have improved significantly, providing crucial relief to our military commitments in China."
 japan_wr.30.a:0 "Yoshi! (Excellent!)"
 japan_wr.31.t:0 "United States Rejects Proposal"
 japan_wr.31.d:0 "The United States has flatly rejected our request. This refusal heightens fears of total diplomatic isolation and threatens to severely hamper our war effort in China."
 japan_wr.31.a:0 "We shall forge our own path."
 japan_wr.32.t:0 "Japan Requests Conditional Surrender"
 japan_wr.32.d:0 "Unable to withstand our fierce counter-offensives, the Japanese government has submitted a request for conditional surrender. We have successfully defended the motherland, ensuring no foreign power will threaten China again."
 japan_wr.32.a:0 "Let us end the bloodshed here."
 japan_wr.32.b:0 "Fighting continues until Peking is secure and Tokyo falls!"
 japan_wr.33.t:0 "[FROM.GetName] Rejects Peace Offer"
 japan_wr.33.d:0 "The government of [FROM.GetName] has flatly refused our peace terms, declaring that hostilities will not cease until Tokyo itself is captured."
 japan_wr.33.a:0 "Let them try if they dare!"
 japan_wr.34.t:0 "Declining Influence in Fengtian"
 japan_wr.34.d:0 "Zhang Zuolin's persistent anti-Japanese policies have severely eroded our political and economic leverage within Fengtian. If left unchecked, Japanese influence over Chinese affairs risks total collapse. We must take immediate action."
 japan_wr.34.a:0 "Exert pressure on them."
 japan_wr.35.t:0 "Japanese Ultimatums"
 japan_wr.35.d:0 "The Japanese government has issued a stern demand insisting that all prior privileges and influence within Fengtian be fully restored, threatening severe economic and military reprisals should we decline."
 japan_wr.35.a:0 "Tell them to do as they please."
 japan_wr.35.b:0 "We must yield to their demands."
 japan_wr.36.t:0 "Fengtian Rejects Demands"
 japan_wr.36.d:0 "The Fengtian government has disregarded our demands to restore Japanese influence. They will answer for this insolence as we reassert our dominance by force."
 japan_wr.36.a:0 "Fools."
 japan_wr.37.t:0 "Influence Restored in Fengtian"
 japan_wr.37.d:0 "We have successfully re-established complete political and economic influence over Fengtian. Japanese dominance in East Asia remains vast, formidable, and ever-expanding."
 japan_wr.37.a:0 "Cheers to the Empire!"
 japan_wr.38.t:0 "Japanese Economic Assistance"
 japan_wr.38.d:0 "Japan has agreed to provide extensive economic aid. Capital and vital supplies are flowing steadily into Fengtian, offering a significant boost to the regional economy."
 japan_wr.38.a:0 "Convey our gratitude."
 japan_wr.40.t:0 "Victory in the Second Sino-Japanese War"
 japan_wr.40.d:0 "Following a grueling campaign, our forces have decisively broken Chinese resistance and secured control over the mainland. China shall now be partitioned and administered according to our strategic design."
 japan_wr.40.a:0 "Banzai!"
 japan_wr.41.t:0 "Japan Proposes Alliance"
 japan_wr.41.d:0 "In light of current strategic realities, the Japanese government has proposed a formal military alliance. While their assistance could prove decisive, it risks permanently hindering our own ambitions for Chinese unification."
 japan_wr.41.a:0 "Securing victory takes priority."
 japan_wr.41.b:0 "Out of the question."
 japan_wr.42.t:0 "Fengtian Accepts Alliance"
 japan_wr.42.d:0 "The Fengtian government has expressed a positive stance toward a military pact with our forces. This alliance will greatly facilitate our operational control across China."
 japan_wr.42.a:0 "Pragmatic leadership."
 japan_wr.43.t:0 "Fengtian Rejects Alliance"
 japan_wr.43.d:0 "The Fengtian government has refused to enter into a military alliance with us. Both armies will conduct operations independently, and they may eventually emerge as hostile rivals."
 japan_wr.43.a:0 "Fools."
 japan_wr.44.t:0 "Failed Coup in Japan"
 japan_wr.44.d:0 "Sensational reports arrived from Tokyo today. A militarist faction known as the Kodoha launched a coup attempt intended to dismantle parliamentary democracy and restore absolute executive authority to the Emperor. However, when the Emperor expressed profound indignation at their actions and commanded their immediate surrender, the uprising lost all legitimacy and collapsed rapidly.\n\nAlthough the Prime Minister and several senior statesmen were assassinated, preserving parliamentary democracy remains achievable now that the Kodoha has been shattered."
 japan_wr.44.a:0 "A coup carried out in the Emperor's name, rejected by the Emperor himself."
 japan_wr.45.t:0 "Successful Coup in Japan"
 japan_wr.45.d:0 "Dramatic news emerged from Tokyo today. The Kodoha militarist faction executed a successful coup d'état, assassinating the Prime Minister and key cabinet ministers with the explicit goal of ending parliamentary democracy. The coup achieved total triumph when the Emperor ultimately sanctioned their actions.\n\nWith parliamentary institutions dismantled by the Kodoha, Japan appears poised to revert to an autocratic structure centering absolute authority in the Crown, though whether the Emperor will actively exercise executive power remains uncertain."
 japan_wr.45.a:0 "A complete retreat into feudal autocratic rule."