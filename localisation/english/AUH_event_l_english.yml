l_english:
 AUH.1.t:0 "German Proposal"
 AUH.1.d:0 "Germany wishes to re-establish close ties with us, as was the case during the Great War. No one can say whether accepting this will bring us gain or harm."
 AUH.1.a:0 "Germany and Austria are allies."
 AUH.1.b:0 "No way!"
 AUH.2.t:0 "Italy Demands Lombardy–Venetia"
 AUH.2.d:0 "Italy is demanding the territory of Lombardy–Venetia. What should we do?"
 AUH.2.a:0 "It was hard territory to manage anyway. Hand it over."
 AUH.2.b:0 "What? Never!"
 AUH.3.a:0 "It was hard territory to manage anyway. Hand it over."
 AUH.3.b:0 "What? Never!"
 AUH.4.t:0 "Germany Requests Support"
 AUH.4.d:0 "The Germans are requesting that we join [REI.GetFactionName]. What should we do?"
 AUH.4.a:0 "Tell them we agree."
 AUH.4.b:0 "Tell them no."
 AUH.6.t:0 "South Slavic Uprising!"
 AUH.6.d:0 "The Austro-Hungarian Empire is a multi-ethnic state. Consequently, it has suffered from internal ethnic conflicts, and now that Austria is at war with Germany, the Slavs have risen up against Austria for their independence. This has made it certain that Austria is trapped in a hopeless situation."
 AUH.6.a:0 "Arise, Slavs!"
 AUH.7.t:0 "Collapse of the Austro-Hungarian Empire"
 AUH.7.d:0 "The Austro-Hungarian Empire, born through the Compromise, has faced a national crisis alongside the rise of self-determination. Through its victory in the Great War, the Habsburg realm managed to prolong its existence, yet the threat remained as a specter over Austria. Ultimately, that specter succeeded in bringing down the empire. Numerous nationalities within the realm declared independence and broke away from Austria. However, tensions among these newly independent states have already begun, and fresh conflict centered around this region appears inevitable."
 AUH.7.a:0 "It was a foregone conclusion."
 AUH.8.t:0 "Dispatch of German Military Advisory Group"
 AUH.8.d:0 "Germany has decided to dispatch a military advisory group as a gesture of goodwill toward us. This is certain to exert a positive influence on us."
 AUH.8.a:0 "Perfect."
 AUH.9.t:0 "Discussions on Imperial Restructuring"
 AUH.9.d:0 "Demands for autonomy from minorities and an outdated system of governance are breeding widespread discontent. Leaving this unaddressed will cause serious trouble."
 AUH.9.a:0 "Grant autonomy to all nationalities."
 AUH.9.b:0 "Grant sovereignty to Austrians, Hungarians, and Croats."
 AUH.9.c:0 "The Empire shall be ruled by Austria."
 AUH.11.t:0 "Hungarian Uprising"
 AUH.11.d:0 "Yesterday morning, Hungary—which had fiercely opposed the reforms of the Austrian Empire and the abolition of Hungarian privileges—staged an uprising. Fighting has already broken out in several cities, and the Austrian imperial government has declared martial law and is massing troops to suppress the Hungarian rebellion."
 AUH.11.a:0 "1848 has arrived."
 AUH.13.t:0 "The Second Compromise"
 AUH.13.d:0 "The main issue of the Second Compromise is the demarcation of Croatia's territory. There are two proposals: first, setting Slovenia, Bosnia, Montenegro, and the entire Istrian Peninsula as Croatian territory; second, setting only Bosnia, Montenegro, and parts of the Istrian Peninsula as Croatian territory."
 AUH.13.a:0 "Does Croatia really need to be that large?"
 AUH.13.b:0 "Slovenia and the Istrian Peninsula belong to Croatia."
 AUH.14.t:0 "Bohemian Uprising"
 AUH.14.d:0 "Yesterday morning, Bohemia—which had steadfastly opposed the reforms of the Austrian Empire and the abolition of Bohemian privileges—finally revolted. Fighting has already begun in several cities, and the Austrian imperial government has declared martial law and is assembling troops to quell the Bohemian uprising."
 AUH.14.a:0 "Traitors!"
 AUH.16.t:0 "Croatian Uprising"
 AUH.16.d:0 "Yesterday morning, Croatia—which had fiercely resisted the reforms of the Austrian Empire and the abolition of Croatian privileges—eventually broke out in revolt. Engagements have already commenced in several cities, and the Austrian imperial government has declared martial law and is gathering forces to put down the Croatian uprising."
 AUH.16.a:0 "How could they!"
 AUH.19.t:0 "Greek Request for Surrender"
 AUH.19.d:0 "Unable to withstand our fierce assault, the Greek government has ultimately requested surrender. We have emerged anew as the great empire dominating the Balkans."
 AUH.19.a:0 "A magnificent victory."
 AUH.19.b:0 "However, the battle continues."
 AUH.20.t:0 "Signing of Trade Agreement with Greece"
 AUH.20.d:0 "The Greek government has decided to conclude a trade agreement with us. Relations between Greece and our nation will continue to improve."
 AUH.20.a:0 "Good."
 AUH.21.t:0 "Signing of Protection Treaty with Greece"
 AUH.21.d:0 "The Austrian government has concluded a treaty of protection for the Greek government. This has improved mutual trust and relations between the two countries."
 AUH.21.a:0 "Hurrah!"
 AUH.22.t:0 "Military Alliance with Greece!"
 AUH.22.d:0 "We have entered into a military alliance with Greece. This alliance will prove to be a great asset in these turbulent times."
 AUH.22.a:0 "Very good!"
 AUH.23.t:0 "Bulgarian Request for Surrender"
 AUH.23.d:0 "Unable to endure our ferocious offensive, the Bulgarian government has at last requested surrender. We have emerged anew as the great empire dominating the Balkans."
 AUH.23.a:0 "A magnificent victory."
 AUH.23.b:0 "However, the battle continues."
 AUH.24.t:0 "Bulgaria Requests Field Artillery Support"
 AUH.24.d:0 "The Bulgarian government has requested that we send 1,000 artillery pieces. This will improve our relations with Bulgaria."
 AUH.24.a:0 "Very well."
 AUH.25.t:0 "Bulgaria Requests Small Arms Support"
 AUH.25.d:0 "In response to the Bulgarian government's request for arms support, our government sent 2,000 rifles. This will improve our relations with Bulgaria."
 AUH.25.a:0 "Not bad."
 AUH.26.t:0 "The Lombardy–Venetia Question"
 AUH.26.d:0 "The Lombardy–Venetia issue remains one of Austria's major problems. Parliament's decision on this matter will determine the future relations between Italy and us."
 AUH.26.a:0 "Return it to Italy."
 AUH.26.b:0 "Maintaining the status quo is best."
 AUH.26.c:0 "Annex Lombardy–Venetia."
 AUH.27.t:0 "Lombardy–Venetia Returned to Italy"
 AUH.27.d:0 "This morning, the Austrian Parliament agreed to the return of Lombardy–Venetia to Italy, and Italy agreed as well. Lombardy–Venetia is now part of Italy, which may help ease tensions between Italy and Austria."
 AUH.27.a:0 "It has returned to where it belongs."
 AUH.28.t:0 "Austrian Annexation of Lombardy–Venetia"
 AUH.28.d:0 "The Austrian government has finally annexed Lombardy–Venetia as part of Austria. The Italian government responded fiercely, and tensions between the two nations have heightened considerably."
 AUH.28.a:0 "Let us hope war does not break out."
 AUH.29.t:0 "Hungary Gains Independence!"
 AUH.29.d:0 "As national stability continued to decline, Hungary, which had expressed great discontent, ultimately left the empire. Hungary declared independence yesterday morning, and the Austrian Empire, hobbled by its unstable domestic state, has made no significant moves."
 AUH.29.a:0 "Oh no!"
 AUH.30.t:0 "Illyria Gains Independence!"
 AUH.30.d:0 "Following Hungary's independence, Illyria has also declared independence. The downfall of Austria appears imminent."
 AUH.30.a:0 "Oh, God."
 AUH.31.t:0 "Galicia-Lodomeria Gains Independence!"
 AUH.31.d:0 "In the end, Galicia has declared independence. Austria is now left with only its core territory and Bohemia. Yet even this seems unlikely to last long."
 AUH.31.a:0 "Please..."
 AUH.32.t:0 "Bohemian Declaration of Independence"
 AUH.32.d:0 "The Empire has collapsed. Austria no longer had the strength to maintain the state, and Bohemia, the last remaining realm, has departed the empire. It is all over now."
 AUH.32.a:0 "Is this the end of the Austrian Empire?"
 AUH.33.t:0 "The Collapse of Austria"
 AUH.33.d:0 "The Habsburg Empire, which ruled Central Europe for centuries, has finally fallen into an uncontrollable state. The breakdown of the Austrian state, long lingering since the advent of self-determination, has become reality.\n\nThe Austrian government failed to control its ethnic minorities, and the empire has completely fractured. Multiple independent states have emerged in Europe, and this collapse threatens to plunge Central Europe into chaos."
 AUH.33.a:0 "Oh dear..."
 AUH.34.t:0 "A Magnificent Victory"
 AUH.34.d:0 "The long struggle with Germany has ended in an Austrian victory. We have cleansed the humiliation suffered at their hands in the past, and now it is time to reshape their borders as we see fit."
 AUH.34.a:0 "Victory for Greater Germanism"
 AUH.35.t:0 "Victory for [AUH.GetName]"
 AUH.35.d:0 "The unimaginable has occurred. Germany, considered to possess the most powerful army in the world, has surrendered, and the Austrian Empire stands victorious. Germany was partitioned into several states by Austria, and Europe now rests in the hands of the Austrian Empire."
 AUH.35.a:0 "An unexpected turn of events."
 AUH.36.t:0 "Conquest of Italy"
 AUH.36.d:0 "We have succeeded in conquering Italy. The enemy crumbled before our mighty army, and now we shall dismantle Italy."
 AUH.36.a:0 "Back to the days before the Risorgimento!"
 AUH.37.t:0 "[AUH.GetName] Requests Surrender"
 AUH.37.d:0 "Unable to overcome the overwhelming might of the German forces and their allies, the Austrian army suffered repeated defeats and ultimately requested surrender from us. The German Empire has won, and [AUH.GetName] is now finished."
 AUH.37.a:0 "Long live Germany!"
 AUH.37.b:0 "The war is not over until they are completely finished."
 AUH.38.t:0 "Our Request for Surrender Denied"
 AUH.38.d:0 "Germany has rejected our request for surrender. They desire our total destruction and stated there is no room left for compromise. Austria may no longer survive."
 AUH.38.a:0 "No!"
 AUH.42.t:0 "Galicia-Lodomeria Uprising"
 AUH.42.d:0 "This morning, Galicia-Lodomeria declared independence against Austria and Hungary. Galicia-Lodomeria harbored deep discontent toward the Austrian government over recent months, and the consequences have finally manifested. The Austrian government has branded their actions as treason and is assembling troops in the region of Galicia-Lodomeria."
 AUH.42.a:0 "Kill them all!"
 AUH.46.t:0 "Proclamation of the United States of Greater Austria"
 AUH.46.d:0 "Since the founding of the Austrian Empire in 1804, Austria carried the inherent problem of being a multi-ethnic state. This characteristic became a major threat to the nation with the rise of nationalism. The issue was addressed in various ways, and at one time seemed resolved by reorganizing the nation into the Austro-Hungarian Empire. However, many ethnic minorities in the empire continued to suffer discrimination compared to Austrians and Hungarians, and their desire for independence grew day by day. Amidst this, the Crown Prince of the Austrian Empire was assassinated by a Serbian nationalist, sparking the First World War. Victory for Germany and its allies allowed the Austro-Hungarian Empire to prolong its life, yet it merely bought time without resolving the root cause. Today, however, Emperor Karl I of the Empire resolved the issue by granting autonomy to all nationalities, and Austria-Hungary has been reborn under the name of the United States of Greater Austria."
 AUH.46.a:0 "For His Majesty, for the Empire!"
 AUH.47.t:0 "Proclamation of Austria-Hungary-Croatia"
 AUH.47.d:0 "Since the founding of the Austrian Empire in 1804, Austria carried the inherent problem of being a multi-ethnic state. This characteristic became a major threat to the nation with the rise of nationalism. The issue was addressed in various ways, and at one time seemed resolved by reorganizing the nation into the Austro-Hungarian Empire. However, many ethnic minorities in the empire continued to suffer discrimination compared to Austrians and Hungarians, and their desire for independence grew day by day. Amidst this, the Crown Prince of the Austrian Empire was assassinated by a Serbian nationalist, sparking the First World War. Victory for Germany and its allies allowed the Austro-Hungarian Empire to prolong its life, yet it merely bought time without resolving the root cause. Today, however, Emperor Karl I of the Empire resolved the issue by granting additional autonomy to the Croatian nation, and Austria-Hungary has been reborn under the name of Austria-Hungary-Croatia."
 AUH.47.a:0 "For His Majesty, for the Empire!"
 AUH.48.t:0 "Proclamation of the Austrian Empire"
 AUH.48.d:0 "Since the founding of the Austrian Empire in 1804, Austria carried the inherent problem of being a multi-ethnic state. This characteristic became a major threat to the nation with the rise of nationalism. The issue was addressed in various ways, and at one time seemed resolved by reorganizing the nation into the Austro-Hungarian Empire. However, many ethnic minorities in the empire continued to suffer discrimination compared to Austrians and Hungarians, and their desire for independence grew day by day. Amidst this, the Crown Prince of the Austrian Empire was assassinated by a Serbian nationalist, sparking the First World War. Victory for Germany and its allies allowed the Austro-Hungarian Empire to prolong its life, yet it merely bought time without resolving the root cause. Today, however, Emperor Karl I of the Empire resolved the issue by revoking the autonomy of other minority groups and forcibly suppressing them, and Austria-Hungary has once again been designated as the Austrian Empire."
 AUH.48.a:0 "For His Majesty, for the Empire!"
 AUH.1000.t:0 "Minority Unrest"
 AUH.1000.d:0 "Minority groups are causing unrest in the streets, demanding equal sovereignty and guarantees for minority rights. Some extremists clashed with the police while demanding independence for ethnic minorities."
 AUH.1000.a:0 "Leave them be."
 AUH.1000.b:0 "Suppress them."
 AUH.1000.c:0 "Let us try to enter into dialogue."
 AUH.93.t:0 "Hungary Defects!"
 AUH.93.d:0 "Hungary has staged a rebellion! After seizing all key imperial administrative offices in their territory, they declared independence and announced the annulment of the personal union. The opportunist Horthy seized power and proclaimed himself 'Regent'. Unfortunately, there is little we can do about this, as opening a second front would surely lead us to ruin."
 AUH.93.a:0 "Pour out our condemnation."
 AUH.49.t:0 "Hungarian Rebellion"
 AUH.49.d:0 "Today, the Hungarian Parliament declared the annulment of the personal union with Austria and proclaimed the Kingdom of Hungary. Admiral Miklós Horthy of the Hungarian Navy declared himself Regent of the Kingdom. Austria will condemn this, but what can they really do?"
 AUH.49.a:0 "The Habsburgs are finished as well."
 AUH.50.t:0 "Austrian-Led German Reunification"
 AUH.50.d:0 "Astonishing news arrived from Europe this morning. Austria—which was excluded from German unification after its defeat in the war against Prussia—has declared the reunification of all German lands after emerging victorious in the war between Germany and Austria that erupted a few years ago.\n\nAfter securing victory over Germany, Austria fractured the land as it had been before unification. Following its victory even in the subsequent Second World War, Austria established total influence within Germany. Consequently, Austria was able to proclaim an Austrian-led reunification of Germany."
 AUH.50.a:0 "Long live Austria."