l_english:
 italy.1.t:0 "Talks in Anzio"
 italy.1.d:0 "A German diplomatic delegation requested a meeting around noon yesterday, stating they wished to hold discussions with us."
 italy.1.a:0 "Let us begin."
 italy.2.t:0 "Germany Proposes an Alliance"
 italy.2.d:0 "Germany has proposed that we stand by their side in the event of war. We might be able to secure promises of territorial concessions or economic aid in return."
 italy.2.a:0 "Demand Lombardy-Venetia."
 italy.2.b:0 "Demand economic aid."
 italy.2.c:0 "Italy remains neutral!"
 italy.3.t:0 "Germany Refuses"
 italy.3.d:0 "Germany rejected our demand for economic aid. What should we do now?"
 italy.3.a:0 "Then let us demand the return of Lombardy-Venetia."
 italy.3.b:0 "Then there is no need to proceed with this meeting."
 italy.4.t:0 "Germany Grants Economic Assistance"
 italy.4.d:0 "Germany has approved economic aid. Relations between our nation and Germany will likely grow stronger."
 italy.4.a:0 "Very good."
 italy.5.t:0 "Refusal to Return Territory"
 italy.5.d:0 "German diplomats state that Austria-Hungary is reluctant to return Lombardy-Venetia. How should we proceed?"
 italy.5.a:0 "Then let us demand economic aid."
 italy.5.b:0 "Then there is no need to proceed with this meeting."
 italy.6.t:0 "Our Request Rejected Again"
 italy.6.d:0 "All of our demands have been ignored by them. There seems to be no point in continuing these negotiations."
 italy.6.a:0 "This is pointless."
 italy.7.t:0 "Austria Agrees to Return Lombardy-Venetia!"
 italy.7.d:0 "Austria has agreed to return the territory of Lombardy-Venetia to us. The vast lands we lost shall return to our control."
 italy.7.a:0 "Splendid!"
 italy.8.t:0 "Germany Requests Support"
 italy.8.d:0 "The Germans are asking us to join the Reichspakt. What should we do?"
 italy.8.a:0 "Tell them we agree."
 italy.8.b:0 "Tell them no."
 italy.9.t:0 "German Proposal"
 italy.9.d:0 "Germany wishes for us to participate should they enter into war with Austria. No one can say whether accepting this will bring us gain or harm."
 italy.9.a:0 "Understood."
 italy.9.b:0 "Well... no."
 italy.10.t:0 "Outbreak of the Italian Civil War"
 italy.10.d:0 "Italy has been plunged into civil war, triggered by clashes between government troops and Blackshirts in Rome. This conflict between integralists and republicans has once again fractured Italy."
 italy.10.a:0 "In the name of democracy!"
 italy.10.b:0 "Bring down the government!"
 italy.11.t:0 "French Proposal"
 italy.11.d:0 "The French government has communicated a desire for us to join their faction. This alliance could bring us substantial benefits."
 italy.11.a:0 "A fine proposal."
 italy.11.b:0 "No."
 italy.16.t:0 "Paris-Rome Research Institute"
 italy.16.d:0 "The French government has proposed establishing a joint research institute. Accepting this would yield great results in technical research while improving our relations with France."
 italy.16.a:0 "A fine idea."
 italy.16.b:0 "We have no need for it."
 italy.17.t:0 "Suspicious Movement of Integralists"
 italy.17.d:0 "Suspicious movements by Mussolini and his integralist supporters have recently been uncovered. Intelligence indicates they intend to enter the capital by rail. Reinforcing Roman defenses and inspecting trains appears necessary."
 italy.17.a:0 "There is no harm in taking precautions..."
 italy.17.b:0 "Get out if you intend to spout such absurdities."
 italy.18.t:0 "Rome Party Convention Concludes Successfully"
 italy.18.d:0 "Yesterday evening's Rome Party Convention of the Partito Integralista Repubblicano concluded without incident. Despite rumors of an assassination plot against the Prime Minister, he pressed forward, and the event ended smoothly thanks to heightened security in Rome. Gentile's authority appears firmly consolidated."
 italy.18.a:0 "Long live Italy!"
 italy.19.t:0 "Assassination of Prime Minister Gentile!"
 italy.19.d:0 "Shocking news arrived from Rome yesterday evening. A bomb detonated during the convention of the Partito Integralista Repubblicano, killing Italian Prime Minister Gentile instantly. Authorities suspect an organized attack by radical communists, and major political upheaval is anticipated across Italy."
 italy.19.a:0 "Impossible!"
 italy.20.t:0 "Victory for the LDP"
 italy.20.d:0 "The winner of this general election was the LDP. The party has maintained strong support since its founding in 1921, and the election produced no major upsets."
 italy.20.a:0 "Nitti shall continue as Prime Minister."
 italy.21.t:0 "Postponement of General Election"
 italy.21.d:0 "Due to the outbreak of the Italian Civil War, the general election will be postponed. It remains uncertain how long the conflict will last, but holding elections during active war is impossible."
 italy.21.a:0 "I see..."
 italy.22.t:0 "Treaty of Rome"
 italy.22.d:0 "Our diplomats held discussions with Italian representatives regarding the partition of Somalia. The Ogaden region occupied by Somalia was originally our land, and Italy pledged to return it if we launch an offensive against their rear when they invade Somalia."
 italy.22.a:0 "What a rare opportunity."
 italy.23.t:0 "Ethiopia Agrees"
 italy.23.d:0 "The Ethiopian government promised to attack the rear of Somalia should we launch an invasion. We shall re-establish our presence in Africa once more."
 italy.23.a:0 "Let us reclaim Somalia for our nation."
 italy.24.t:0 "Italy Calls for War"
 italy.24.d:0 "Under the terms of the Treaty of Rome, our nation is obligated to participate in the Italo-Somali War."
 italy.24.a:0 "Advance!"
 italy.25.t:0 "Italo-Somali War"
 italy.25.d:0 "Last night, Italian forces executed a surprise amphibious landing in Somalia and initiated an invasion. Somalia was formerly an Italian colony until lost following the Great War, yet it appears destined to fall back under Italian control. Military analysts predict a few weeks will suffice for Italian forces to collapse the government in Mogadishu."
 italy.25.a:0 "Italy is expanding."
 italy.26.t:0 "Ethiopian Intervention"
 italy.26.d:0 "While Italy engaged Somalia, Ethiopia launched its own invasion. Somalia has virtually no remaining chance of survival. The Ethiopian and Italian governments appear to operate under a secret pact, preparing to partition Somalia between them post-war."
 italy.26.a:0 "Somalia is finished."
 italy.27.t:0 "End of the Italo-Somali War"
 italy.27.d:0 "Ultimately, Somalia was occupied by Italian and Ethiopian forces. The prospect of Somali independence appears exceedingly grim."
 italy.27.a:0 "As expected."
 italy.28.t:0 "End of the Italo-Somali War"
 italy.28.d:0 "In the end, Somalia was overwhelmed by Italian and Ethiopian troops. The two powers partitioned Somali territory, rendering independence impossible. This campaign has erased Somalia from the map and may mark the beginning of further Italian expansionism."
 italy.28.a:0 "A brief independence of barely twenty years."
 italy.29.t:0 "Second Italo-Turkish War"
 italy.29.d:0 "Exploiting severe internal turmoil caused by minority independence movements in the Ottoman realm, Italy declared war and invaded Libya. Italy seeks to reclaim Libya from the Ottoman Empire, just as in 1911. Whether Italy can defeat the Ottomans once more remains to be seen. However, it is clear that current Italian maneuvers are provoking deep displeasure in Berlin and Vienna."
 italy.29.a:0 "Indeed."
 italy.30.t:0 "Ottomans Offer Surrender Terms"
 italy.30.d:0 "Unable to withstand our military offensives, the Ottomans have requested terms of surrender. Italy stands victorious, and Libya shall return to our hands."
 italy.30.a:0 "Splendid."
 italy.30.b:0 "Our ambitions reach further."
 italy.31.t:0 "End of the Second Italo-Turkish War"
 italy.31.d:0 "The Italian invasion of an Ottoman Empire plunged into chaos resulted in a decisive Italian victory. All of Libya now rests under Italian rule, accelerating the decay of the Ottoman realm."
 italy.31.a:0 "The Sick Man of Europe is dying."
 italy.32.t:0 "End of the Second Italo-Turkish War"
 italy.32.d:0 "While the Italian military has long been criticized for poor performance, the current force appears to have degraded even further. The recent conflict concluded with the retreat of Italian troops, resulting in a de facto Ottoman victory. Italian forces proved entirely incapable of dislodging Ottoman defenses throughout the war."
 italy.32.a:0 "The Italian army is utterly pathetic."
 italy.33.t:0 "French Rejection"
 italy.33.d:0 "After lengthy deliberation, the French government rejected our proposal. While the exact reasons remain unclear, it is certain that France has no desire to align with us."
 italy.33.a:0 "Why, though?"
 italy.34.t:0 "German Rejection"
 italy.34.d:0 "After lengthy deliberation, the German government rejected our proposal. While the exact reasons remain unclear, it is certain that Germany has no desire to align with us."
 italy.34.a:0 "Why, though?"
 italy.35.t:0 "Mussolini's Coup Attempt"
 italy.35.d:0 "This morning, Mussolini and his followers marched on Rome in an attempt to seize power. However, government authorities uncovered the plot in advance, blockading the capital and arresting numerous conspirators. Mussolini's coup collapsed, and he reportedly fled to Switzerland.\n\nTheir hasty uprising ended in failure, delivering a severe blow to the expansion of integralism. Italian democracy shall endure."
 italy.35.a:0 "A defeat for the integralists."
 italy.36.t:0 "Assassination of Prime Minister Gentile!"
 italy.36.d:0 "Prime Minister Gentile was assassinated during the party convention in Rome yesterday evening. Regarded as the father of Italian integralism, he was killed instantly by a bomb while speaking at the podium, with several high-ranking officials sustaining grave injuries.\n\nAuthorities attribute the attack to communists. With the central figure of Italian integralism gone, a major shift in Italian politics may be at hand."
 italy.36.a:0 "What future awaits Italy?"
 italy.37.t:0 "Crushing Defeat for Italy"
 italy.37.d:0 "Italy suffered another defeat against Ethiopia, echoing past failures. Despite launching a surprise offensive against an African nation, their forces failed to break through and were repulsed. The implications for any future Italian war are glaringly obvious."
 italy.37.a:0 "Is that truly a European army?"
 italy.39.t:0 "Italian Civil War"
 italy.39.d:0 "Starting with gunfire in central Rome, all of Italy has been engulfed in civil war. The nation has fractured into an integralist South and a republican North, reflecting compounded regional and ideological divides. All eyes are on which faction will triumph and what will become of Italy."
 italy.39.a:0 "Who shall emerge as the second Garibaldi?"
 italy.40.t:0 "Armistice Deliberations"
 italy.40.d:0 "As the Italian Civil War drags on, the nation has become utterly devastated. Both Republicans and Integralists are exhausted from prolonged conflict, leading to internal calls for a ceasefire. The government has formally raised the issue of armistice, and we must make our decision."
 italy.40.a:0 "Propose an armistice."
 italy.40.b:0 "There can be no coexistence with integralists!"
 italy.41.t:0 "Republican Armistice Offer"
 italy.41.d:0 "After prolonged conflict, the Republicans have put forward an armistice proposal. Both sides are thoroughly exhausted by war, making a ceasefire an attractive prospect."
 italy.41.a:0 "Very well."
 italy.41.b:0 "Nonsense."
 italy.42.t:0 "Italian Armistice Agreement"
 italy.42.d:0 "Following extensive civil war, the two Italian factions agreed to an armistice. Severe war fatigue built immense public support for a ceasefire. An indefinite truce was signed between Republicans and Integralists, though how long this peace will endure remains uncertain. Whether Italy remains permanently partitioned or slides back into conflict, temporary peace has arrived."
 italy.42.a:0 "A fleeting peace."
 italy.43.t:0 "Integralists Reject Armistice"
 italy.43.d:0 "The Integralists flatly rejected our armistice proposal, making it clear they cannot coexist with us in the same nation. The war shall continue."
 italy.43.a:0 "The feeling is mutual, you bastards."
 italy.45.t:0 "Italy Reunited"
 italy.45.d:0 "Following the civil war, Italy has finally been reunited under one government. While sporadic skirmishes persist in outlying areas, they are expected to be suppressed within days. The conflict left infrastructure devastated, and recovering from this damage will demand considerable time."
 italy.45.a:0 "A new era for Italy."
 italy.46.t:0 "French Proposal to Sell Infantry Equipment"
 italy.46.d:0 "France has offered to sell us infantry equipment. Accepting this proposal will secure 1,000 sets of infantry equipment for our forces."
 italy.46.a:0 "Splendid."
 italy.46.b:0 "No."
 italy.47.t:0 "Purchase of Italian Infantry Equipment"
 italy.47.d:0 "Italy has agreed to purchase weapons from us, and we shall receive financial compensation for the shipment."
 italy.47.a:0 "Let us proceed."
 italy.48.t:0 "Italy Rejects Our Offer"
 italy.48.d:0 "Italy declined to purchase weapons from us, nullifying the proposed arms deal."
 italy.48.a:0 "Well, no matter."
 italy.49.t:0 "End of the Second Italo-Ethiopian War"
 italy.49.d:0 "After a lengthy campaign, Italy won the Second Italo-Ethiopian War, allowing Rome to avenge the humiliation of 1896. However, despite ultimate victory, Italian combat performance was far from impressive, leaving persistent doubts over the military's strength. Nevertheless, Italy is celebrating its victory and planning the reorganization of Ethiopia."
 italy.49.a:0 "Regardless, they emerged victorious."
 italy.38.t:0 "Fall of the Ottoman Empire"
 italy.38.d:0 "Relentless Italian offensives have brought about the collapse of the Ottoman Empire. Italy rejected Ottoman requests for conditional surrender, declaring that operations would continue until total destruction was achieved. The empire's territory will be partitioned according to Italian ambitions, and heavy war reparations will be imposed."
 italy.38.a:0 "The Sick Man of Europe has passed away."
 italy.50.t:0 "Mass Industrial Flight from Lombardy-Venetia"
 italy.50.d:0 "Lombardy-Venetia's industrial economy was previously sustained by major Austrian firms. Now under Italian control, the region is suffering a massive flight of Austrian businesses and capital. Much of the industrial infrastructure has been left damaged beyond quick repair, requiring significant time for Lombardy-Venetia to regain its past prosperity."
 italy.50.a:0 "We shall rebuild it."
 italy.51.t:0 "Democratic Overthrow of the Government"
 italy.51.d:0 "Around noon today, protesters led by democratic factions seized the Italian parliament building by force and declared the dissolution of the government.\n\nWhile scattered integralist elements continue to offer resistance, their actions are uncoordinated and expected to be suppressed easily. Democracy in Italy has been restored."
 italy.51.a:0 "The rebirth of Italian democracy."
 italy.52.t:0 "Elimination of Anti-Integralist Threats"
 italy.52.d:0 "The Italian government has successfully suppressed democratic and communist factions opposing integralism. Italy is secured from their threats, ensuring the stability of the integralist state.\n\nIn one week, the Grand Council of Integralism will convene to elect a new Prime Minister to lead the nation."
 italy.52.a:0 "Italy shall never perish."
 italy.53.t:0 "Balbo Elected Prime Minister"
 italy.53.d:0 "Italo Balbo, a prominent integralist figure who planned the March on Rome alongside Mussolini, has been appointed Prime Minister following a vote by the Grand Council of Integralism. This marks the beginning of a new era for Italy."
 italy.53.a:0 "Long live Balbo! Long live Italy!"
 italy.54.t:0 "Italian Invasion of Ethiopia"
 italy.54.d:0 "Tensions erupted in East Africa as Italy launched a sudden assault on Ethiopia, ending weeks of uneasy calm. Armored units pushed through the western frontier, and airstrikes hit areas near Addis Ababa. Ethiopia responded by declaring full mobilization, calling the conflict a 'Second Adwa.'\n\nThe clash is seen as more than a regional skirmish. Observers warn it signals a return of Italian expansionism, now threatening African stability once more. The alliance once formed in Somalia lies in ruins, replaced by open warfare. As violence spreads, global powers are monitoring the conflict closely, fearing wider repercussions across the continent."
 italy.54.a:0 "It would be amusing if they lost again."