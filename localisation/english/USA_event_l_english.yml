l_english:
 usa.2.t:0 "Discussion of the Wagner Act"
 usa.2.d:0 "The Wagner Act, designed to safeguard workers' rights, includes provisions for minimum wages and working hours. Republicans and opponents of the New Deal have fiercely denounced it as a deeply socialist piece of legislation. Amidst an intense partisan struggle between Democrats and Republicans, a vote on the bill's passage is finally underway. The result is:"
 usa.2.a:0 "It has passed."
 usa.2.b:0 "It has been rejected."
 usa.3.t:0 "1936 United States Elections"
 usa.3.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. Following the passage of the Wagner Act, the Democratic Party secured an overwhelming victory against the Republicans with the enthusiastic support of the working class. The Senate results mirrored this outcome, suggesting that Franklin D. Roosevelt's New Deal will continue its course without major obstacles."
 usa.3.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. In the wake of the Wagner Act's defeat, the Democrats managed only a narrow victory over the Republicans amid lukewarm labor support. With similar results in the Senate, Franklin D. Roosevelt's New Deal now faces formidable opposition, making its future implementation highly uncertain."
 usa.3.a:0 "The New Deal endures!"
 usa.3.b:0 "We will do everything in our power to halt the New Deal!"
 usa.4.t:0 "The Wagner-Steagall Act Bears Fruit"
 usa.4.d:0 "The Wagner-Steagall Act has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.4.a:0 "A welcome development."
 usa.5.t:0 "1936 United States Presidential Election"
 usa.5.d:0 "Yesterday's presidential election concluded in a victory for the Democratic Party. Sustained popularity from the New Deal allowed Roosevelt to easily defeat the Republican candidate, Alf Landon. This electoral outcome ensures that the New Deal will remain the guiding policy of the U.S. administration."
 usa.5.a:0 "Roosevelt's Triumph"
 usa.6.t:0 "Supreme Court Upholds the Social Security Act"
 usa.6.d:0 "The Supreme Court of the United States has ruled the Social Security Act constitutional. Enacted in 1935, the act had long faced fierce attacks from Republicans and opponents of the New Deal, who labeled it a grave threat to the nation. The court's verdict has stripped their arguments of authority, ensuring the law will remain in effect."
 usa.6.a:0 "The New Deal goes on."
 usa.7.t:0 "The Agricultural Adjustment Act Bears Fruit"
 usa.7.d:0 "The Agricultural Adjustment Act has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.8.t:0 "1938 United States Elections"
 usa.8.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. Despite the 1937 recession still gripping the nation, the Democrats successfully maintained their congressional majority. While the long-term future of the New Deal remains unclear, it will not face immediate interruption."
 usa.8.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The 1937 recession dealt a severe political blow to the Democrats and the Roosevelt administration, enabling the Republican Party to capture the congressional majority. With the presidential election two years away, Republicans are poised to take power while the Democrats find themselves sidelined."
 usa.8.d3:0 "Yesterday marked the House of Representatives and Senate elections across the United States. Despite the 1937 recession still gripping the nation, the Social Democratic Party successfully secured a congressional majority. While the long-term future of their policies remains unclear, they will not face immediate interruption."
 usa.8.a:0 "The New Deal endures!"
 usa.8.b:0 "We will do everything in our power to halt the New Deal!"
 usa.9.t:0 "The Recession of 1937"
 usa.9.d:0 "A severe crisis has struck the American economy. Just as the nation was beginning to recover from the Great Depression, a sudden and unexplained economic downturn triggered a surge in unemployment and business failures. This dealt a heavy blow to the Democratic Party, and the American public now trembles at the prospect of a second Great Depression."
 usa.9.a:0 "No... Not again!"
 usa.10.t:0 "The Fair Labor Standards Act Bears Fruit"
 usa.10.d:0 "The Fair Labor Standards Act has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.11.t:0 "The Trade Union Restriction Act Bears Fruit"
 usa.11.d:0 "The Trade Union Restriction Act has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.12.t:0 "The New Deal Under Scrutiny"
 usa.12.d:0 "The recession of 1937 has laid bare the limitations of the New Deal. We must now entrust these problems to the free market rather than modified capitalism. Just as Roosevelt pushed through sweeping reforms in his first 100 days, we will spend the next 100 days rolling back or abolishing those very measures."
 usa.12.a:0 "Let us begin."
 usa.13.t:0 "Debate on the Works Progress Administration"
 usa.13.d:0 "Congress has debated the continuation of the Works Progress Administration. Amidst a renewed recession, ongoing public works projects will undoubtedly place an unsustainable burden on the national debt. We must seriously consider curtailing or abolishing this agency."
 usa.13.a:0 "Abolish it."
 usa.13.b:0 "Curtail it."
 usa.14.t:0 "Debate on the Social Security Act"
 usa.14.d:0 "Congress has debated the maintenance of the Social Security Act. Corporations have launched sharp attacks, condemning the act as anti-business and anti-capitalist. They argue that excessive protections for workers infringe upon corporate rights and severely restrict business operations."
 usa.15.t:0 "Debate on the Wealth Tax Act"
 usa.15.d:0 "Congress has debated the maintenance of the Wealth Tax Act. Corporations have launched sharp attacks, condemning the act as anti-business and anti-capitalist. They express deep resentment, arguing that the state forcibly confiscates the rightful earnings of capitalists to distribute them to the poor."
 usa.16.t:0 "Debate on Agricultural and Rural Programs"
 usa.16.d:0 "Congress has debated the continuation of agricultural and rural programs. With the recession striking the nation once more, utilizing massive public funds to bail out farmers has become exceedingly difficult. We must decide whether to maintain or scale down these projects."
 usa.16.a:0 "Curtail them."
 usa.16.b:0 "Maintain them."
 usa.17.t:0 "Debate on the National Housing Act of 1934"
 usa.17.d:0 "Congress has debated the maintenance of the National Housing Act. With the recession striking the nation once more, providing extensive housing subsidies through public funds is no longer feasible. While this may make it harder to prevent banks from foreclosing on debtors' homes, it will eliminate wasteful government spending."
 usa.18.t:0 "The Hundred Days of Rollback"
 usa.18.d:0 "Over the past 100 days, the Republican-led Congress has moved to repeal and scale back many of Roosevelt's New Deal programs, putting a definitive brake on their expansion. Arguing that the 1937 panic exposed the fundamental flaws of the New Deal, the Republican majority has dismantled numerous New Deal statutes and initiatives. Experts refer to this period as the 'Hundred Days of Rollback,' marking the genesis of a new, Republican-driven economic policy."
 usa.18.a:0 "The New Deal is effectively abolished."
 usa.18.b:0 "The New Deal has been curtailed."
 usa.19.t:0 "The Protectionist Trade Act Bears Fruit"
 usa.19.d:0 "The Protectionist Trade Act has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.21.t:0 "Merger of the Democratic and Socialist Parties"
 usa.21.d:0 "A remarkable event has occurred today. The Democratic Party, increasingly influenced by radical elements, proposed a merger with the Socialist Party of America. The Socialists accepted, giving birth to the Social Democratic Party, which is poised to exert immense influence over American politics."
 usa.21.a:0 "American Socialism"
 usa.22.t:0 "Expansion of Welfare Laws Bears Fruit"
 usa.22.d:0 "The expansion of welfare legislation has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.23.t:0 "The Great Heat Wave of 1936"
 usa.23.d:0 "An intense and scorching heat wave has struck the United States and Canada. Commencing in late June, the most severe heat wave in modern North American history sent temperatures soaring past 100°F (38°C) as a persistent lack of precipitation worsened drought conditions. By July, temperatures broke all-time records; Steele, North Dakota, reached a staggering 121°F (50°C), while Ohio recorded 110°F, surpassing its previous high from 1934.\n\nThis catastrophe coincided with a period of ongoing economic fragility as the U.S. struggled to fully recover from the Great Depression. The prolonged drought has been directly or indirectly linked to over 3,000 reported deaths. Countless individuals suffer from heatstroke, and agricultural yields across the continent have plummeted to historic lows, sending corn and wheat prices skyrocketing. There is little sign of relief in the near future."
 usa.23.a:0 "A true disaster!"
 usa.24.t:0 "End of the Great Heat Wave"
 usa.24.d:0 "From Vancouver and Los Angeles to New York and Washington, D.C., citizens breathed a sigh of relief as news spread that a cold front was sweeping across North America, finally bringing the 1936 heat wave to an end. This event will be remembered as the deadliest natural disaster in 20th-century American history, with an estimated death toll of 5,000. Its lingering economic and social fallout is expected to persist for some time."
 usa.24.a:0 "For now, we have survived."
 usa.25.t:0 "Economic Recovery"
 usa.25.d:0 "The steady recovery of our economy and the passing of the Great Depression are bestowing tremendous benefits upon the United States. Maintaining our current course will undoubtedly secure our prosperity."
 usa.26.t:0 "Reduction of Welfare Laws Bears Fruit"
 usa.26.d:0 "The reduction of welfare legislation has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.27.t:0 "Business-Oriented Economy Bears Fruit"
 usa.27.d:0 "A business-oriented economic policy has finally yielded results. The shock of the Great Depression has receded somewhat, and the United States has successfully achieved a measure of economic revitalization."
 usa.28.t:0 "Nomination of the Republican Presidential Candidate"
 usa.28.d:0 "The Republican Party must nominate its candidate for the upcoming 1940 presidential election. After deliberation, party members have successfully selected their nominee:"
 usa.28.a:0 "Wendell Willkie"
 usa.28.b:0 "Robert Taft"
 usa.29.t:0 "1940 United States Elections"
 usa.29.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. With the Great Depression practically at an end, the Democrats successfully maintained their congressional majority. Some experts forecast that a full economic recovery may lead to the eventual dismantling of many New Deal programs."
 usa.29.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. With the Great Depression practically at an end, the Republican Party succeeded in capturing a majority in Congress. Given this momentum, the Republican presidential candidate is heavily favored to win the upcoming election."
 usa.29.d3:0 "Yesterday marked the House of Representatives and Senate elections across the United States. With the Great Depression practically at an end, the Social Democrats successfully secured a congressional majority. Furthermore, current trends suggest their presidential nominee, Norman Thomas, is poised to capture the presidency."
 usa.29.a:0 "The United States marches forward!"
 usa.29.b:0 "Republican victory!"
 usa.30.t:0 "Nomination of the Democratic Presidential Candidate"
 usa.30.d1:0 "The time has come to select our presidential candidate for the 1940 election. Democratic delegates have chosen Franklin D. Roosevelt. Should he win, Roosevelt will achieve an unprecedented third term in office in U.S. history."
 usa.30.d2:0 "The time has come to select our presidential candidate for the 1940 election. Social Democratic delegates have chosen Norman Thomas. Should he win, the United States will embark on a transformation into a socialist nation."
 usa.30.a:0 "For Roosevelt!"
 usa.30.b:0 "Norman Thomas and the Dream of a Socialist Republic"
 usa.31.t:0 "1940 United States Presidential Election"
 usa.31.d1:0 "Yesterday marked the 1940 United States presidential election. Democratic candidate Franklin D. Roosevelt emerged victorious, making him the first three-term president in history. Analysts attribute his triumph to his enduring popularity driven by successful economic recovery policies."
 usa.31.d2:0 "Yesterday marked the 1940 United States presidential election. Social Democratic candidate Norman Thomas emerged victorious. The United States has entered a new ideological era, stunning neighboring nations with the birth of a socialist republic. However, unlike the communism of [SOV.GetName], this American socialism is expected to take a distinctively democratic form."
 usa.31.d3:0 "Yesterday marked the 1940 United States presidential election. Republican candidate Wendell Willkie emerged victorious. Public disillusionment with Democratic mismanagement during the 1937 panic propelled the Republicans to power. This new president, sympathetic to the New Deal, is expected to preserve it to a degree."
 usa.31.d4:0 "Yesterday marked the 1940 United States presidential election. Republican candidate Robert Taft emerged victorious. Public disillusionment with Democratic mismanagement during the 1937 panic propelled the Republicans to power. The election of the hard-right Taft signals the complete and total abolition of the New Deal."
 usa.31.a:0 "America forges a new path."
 usa.32.t:0 "[USA.GetName] Proposes Arms Sales"
 usa.32.d:0 "[USA.GetName] has expressed a desire to sell us rifles and auxiliary equipment. While we must pay for these goods, such a transaction could prove invaluable while we are at war."
 usa.32.a:0 "We accept the deal."
 usa.32.b:0 "We have no need for them."
 usa.33.t:0 "[FROM.GetName] Agrees to Purchase Rifles"
 usa.33.d:0 "The government of [FROM.GetAdjective] has accepted our trade proposal. Payment is currently en route to America."
 usa.33.a:0 "Excellent."
 usa.34.t:0 "[FROM.GetName] Declines Rifle Purchase"
 usa.34.d:0 "The government of [FROM.GetAdjective] has rejected our trade proposal. It would seem they lack the funds to acquire such fine rifles."
 usa.34.a:0 "Let us offer them to other nations."
 usa.35.t:0 "[USA.GetName] Proposes Artillery Sales"
 usa.35.d:0 "[USA.GetName] has expressed a desire to sell us artillery pieces and auxiliary equipment. While we must pay for these goods, such a transaction could prove invaluable while we are at war."
 usa.36.t:0 "[FROM.GetName] Agrees to Purchase Artillery"
 usa.37.t:0 "[FROM.GetName] Declines Artillery Purchase"
 usa.37.d:0 "The government of [FROM.GetAdjective] has rejected our trade proposal. It would seem they lack the funds to acquire such fine artillery."
 usa.38.t:0 "1942 United States Elections"
 usa.38.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. Though the Democratic Party suffered some losses, it successfully retained its congressional majority. Nevertheless, these results signal a steady erosion of political capital."
 usa.38.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. Though the Republican Party suffered some losses, it successfully retained its congressional majority. Nevertheless, these results signal a steady erosion of political capital."
 usa.38.d3:0 "Yesterday marked the House of Representatives and Senate elections across the United States. Though the Social Democratic Party suffered some losses, it successfully retained its congressional majority. Nevertheless, these results signal a steady erosion of political capital."
 usa.38.a:0 "The United States marches forward!"
 usa.39.t:0 "1944 United States Elections"
 usa.39.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. In this cycle, the Democratic Party secured an increased vote share, positioning them favorably for the upcoming presidential election."
 usa.39.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. In this cycle, the Republican Party secured an increased vote share, positioning them favorably for the upcoming presidential election."
 usa.39.d3:0 "Yesterday marked the House of Representatives and Senate elections across the United States. In this cycle, the Social Democratic Party secured an increased vote share, positioning them favorably for the upcoming presidential election."
 usa.39.a:0 "The United States marches forward!"
 usa.40.t:0 "1944 United States Presidential Election"
 usa.40.d1:0 "Yesterday marked the 1944 United States presidential election. Democratic candidate Franklin D. Roosevelt emerged victorious, making him the first four-term president in history. Analysts attribute his triumph to his enduring popularity driven by successful economic recovery policies."
 usa.40.d2:0 "Yesterday marked the 1944 United States presidential election. Social Democratic candidate Norman Thomas emerged victorious. Having secured a consecutive term, Thomas is set to continue his socialist agenda, ensuring the survival of the Socialist States of America."
 usa.40.d3:0 "Yesterday marked the 1944 United States presidential election. Republican candidate Wendell Willkie emerged victorious. Having secured a consecutive term, President Willkie is expected to maintain his moderate compromise on the New Deal, keeping the Republicans in power."
 usa.40.d4:0 "Yesterday marked the 1944 United States presidential election. Republican candidate Robert Taft emerged victorious. Having secured a consecutive term, President Taft is set to pursue his steadfast conservative policies, firmly charting America's political and diplomatic course."
 usa.40.a:0 "America forges a new path."
 usa.41.t:0 "The Passing of Roosevelt"
 usa.41.d:0 "Franklin D. Roosevelt, the man who rescued an era in American history, passed away yesterday evening after a long battle with failing health. Having served as president since 1933, he delivered the United States from the depths of the Great Depression and became the longest-reigning president in the nation's history. While resting at his cottage in Warm Springs, he suffered a sudden cerebral hemorrhage at 1:15 p.m., reportedly murmuring, 'I have a terrific pain in the back of my head,' before collapsing from his chair. Though rushed to the hospital, he never regained consciousness and drew his final breath at 3:35 p.m. on April 12, 1945. A towering figure of the American century has departed."
 usa.41.a:0 "So ends an era, and so begins another."
 usa.42.t:0 "Embargo on Japan"
 usa.42.d:0 "We can no longer tolerate Japan's frantic expansionism. Let us enact resolute measures to cripple their capacity to wage war."
 usa.42.a:0 "Surely this will bring quiet to the region."
 usa.43.t:0 "1946 United States Elections"
 usa.43.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The Republicans expanded their vote share over the previous election, reflecting a sharp shift in public sentiment away from the Democratic Party."
 usa.43.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The Republicans expanded their vote share over the previous election, reflecting a sharp shift in public sentiment away from the Social Democratic Party."
 usa.44.t:0 "1948 United States Elections"
 usa.44.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. In this cycle, the Democrats expanded their vote share, reflecting growing public weariness with the Republican Party."
 usa.44.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. In this cycle, the Social Democrats expanded their vote share, reflecting growing public weariness with the Republican Party."
 usa.45.t:0 "1948 United States Presidential Election"
 usa.45.d1:0 "Yesterday marked the 1948 United States presidential election. Democratic candidate Harry S. Truman emerged victorious, ensuring the continuation of Democratic governance."
 usa.45.d2:0 "Yesterday marked the 1948 United States presidential election. Social Democratic candidate Henry Wallace emerged victorious, ensuring the continuation of Social Democratic governance."
 usa.45.d3:0 "Yesterday marked the 1948 United States presidential election. Republican candidate Thomas E. Dewey emerged victorious, ensuring the continuation of Republican governance."
 usa.46.t:0 "1950 United States Elections"
 usa.46.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The Democrats outperformed the Republicans in vote share, signaling a public rebuke of the Republican Party."
 usa.46.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The Social Democrats outperformed the Republicans in vote share, signaling a public rebuke of the Republican Party."
 usa.47.t:0 "1952 United States Elections"
 usa.47.d1:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The Republicans captured a larger vote share than the Democrats, signaling a public rebuke of the Democratic Party."
 usa.47.d2:0 "Yesterday marked the House of Representatives and Senate elections across the United States. The Republicans captured a larger vote share than the Social Democrats, signaling a public rebuke of the Social Democratic Party."
 usa.50.t:0 "The United States Withdraws from the French Alliance"
 usa.50.d:0 "Following the conclusion of the war, Washington began reevaluating its standing within the French-led European order. While wartime cooperation was maintained, the arrival of peace laid bare a widening chasm between France's continent-centric ambitions and American national interests.\n\nDemanding that the United States refuse subordination to French dictates, Congress and the press called for an independent diplomatic course. The government has now officially announced its secession from the French-led bloc, affirming its resolve to restore the autonomy of American foreign policy.\n\nThough this step will inevitably chill relations with Paris, it stands as a symbolic declaration that the United States acts in accordance with its own judgment and principles. Free from the shadow of any empire, America steps forward into a new diplomatic paradigm."
 usa.50.a:0 "We shall walk our own path."
 usa.51.t:0 "The United States Withdraws from the German Alliance"
 usa.51.d:0 "Cooperation with the German Empire served as a wartime necessity, but in peacetime, Berlin's expansionist diplomacy and self-serving reconstruction policies have increasingly infringed upon American diplomatic autonomy. Within Washington's halls of power, the doctrine that 'America follows no empire's bidding' has been fiercely reaffirmed.\n\nIn response, the President has formally declared the nation's withdrawal from the German-led alliance. This decision marks the reassertion of an independent American foreign policy, reflecting a desire to step outside European power struggles and pursue a balanced global stance.\n\nWhile Berlin has voiced profound regret, the United States justifies its action under the banner of freedom and self-determination. Standing apart from all blocs, America positions itself anew as an independent global power."
 usa.51.a:0 "We choose our own diplomacy."