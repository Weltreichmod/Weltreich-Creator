l_korean:
 SUBDOCTRINE_Corps_francs: "코르 프랑"
 SUBDOCTRINE_Corps_francs_DESC: "대전쟁 중 전선에서 자생적으로 발생한 코르 프랑은 한 밤중 적진을 체계적을 침투해 포로들을 확보하는 것에서 시작되어 점차 대규모 기습까지 맡았었습니다. 지상에서 적의 정보를 얻고 기습하며 보병들과 긴밀한 코르 프랑은 경험의 전수와 사기 증가를 노릴 수 있을 것입니다."
 Corps_francs_reward_1: "체계적인 역할 분담"
 Corps_francs_reward_2: "야간 장비"
 Corps_francs_reward_3: "진보된 납치기술"
 Corps_francs_reward_4: "긴밀한 소통"
 Corps_francs_reward_5: "꾸드망"