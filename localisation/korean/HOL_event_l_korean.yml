l_korean:
 holand.1.t:0 "독일의 제안"
 holand.1.d:0 "독일은 우리와 더 긴밀한 관계를 맺고 싶다며 군사 통행권과 정박권을 달라는 요청을 보냈습니다. 어떻게 해야 할까요?"
 holand.1.a:0 "나쁘지 않다."
 holand.1.b:0 "절대 안 돼"
 holand.2.t:0 "동인도의 불길"
 holand.2.d:0 "네덜란드령 동인도의 바타비아에서 극도로 위험한 소식이 도달했습니다. 수카르노를 위시한 현지 민족주의 지도자들이 동인도 당국의 통제력을 뒤흔들며 인도네시아 공화국의 독립을 일방적으로 선언했습니다. 헤이그의 내각과 빌헬미나 여왕은 법적 주권을 침해하는 반란 지도자들과의 그 어떠한 협상도 단호히 거부한다는 입장을 유지하고 있습니다. 그러나 현지에서는 민병대와 무장 세력이 세력을 확대하며 주요 행정 기관을 점거하고 유럽계 주민 및 기존 질서에 협력하는 이들을 향해 무력 행사를 자행하는 등 상황이 급격히 악화되고 있습니다. 네덜란드령 동인도의 정당한 주권을 회복하고 동남아시아 핵심 영토의 질서를 되찾기 위해서는 신속한 군사적 개입과 대규모 치안 유지 작전이 불가피합니다. 본국은 제국의 와해를 막기 위해 이 결단에 모든 자원을 집중해야 합니다."
 holand.2.a:0 "동인도는 네덜란드의 영원한 영토다."
 holand.3.t:0 "인도네시아 독립 선언"
 holand.3.d:0 "동남아시아의 정세가 거센 혼란 속으로 빠져들고 있습니다. 네덜란드령 동인도의 바타비아에서는 수카르노와 모하마드 하타를 중심으로 한 민족주의 세력이 인도네시아 공화국의 독립을 공식 선언했습니다. 네덜란드 정부는 이번 선언을 즉각 불법적 반란으로 규정하고 동인도 전역에 대한 정당한 주권 재확립을 선언했습니다. 동남아시아 일대에 새로운 군사적 충돌의 먹구름이 드리워지고 있습니다."
 holand.3.a:0 "동남아시아에 또 다른 전쟁이 시작되는가."